[project]
name = "jetlinks-agent-runtime-v2"
version = "0.1.0"
description = "Stateless JSON-configured agent runtime for JetLinks artifacts and skills."
requires-python = ">=3.12"
dependencies = [
  "agent-client-protocol>=0.9.0,<0.10.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "opensandbox>=0.1.7,<0.2.0",
  "pillow>=11.0.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "python-pptx>=1.0.2",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
jetlinks-agent-v2 = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
