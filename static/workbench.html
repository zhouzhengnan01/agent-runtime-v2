        escapeAttr,
        escapeHtml,
        formatBytes
      }
    });

    function loadAdminToken() {
      state.adminToken = localStorage.getItem('jetlinks.runtime.adminToken') || '';
      if (els.adminToken) els.adminToken.value = state.adminToken;
      renderAdminTokenStatus();
    }

    function saveAdminToken() {
      state.adminToken = (els.adminToken?.value || '').trim();
      if (state.adminToken) {
        localStorage.setItem('jetlinks.runtime.adminToken', state.adminToken);
      } else {
        localStorage.removeItem('jetlinks.runtime.adminToken');
      }
      renderAdminTokenStatus({ type: 'ok', text: state.adminToken ? 'Admin Token 已保存' : 'Admin Token 已清除' });
    }

    function clearAdminToken() {
      state.adminToken = '';
      localStorage.removeItem('jetlinks.runtime.adminToken');
      if (els.adminToken) els.adminToken.value = '';
      renderAdminTokenStatus({ text: 'Admin Token 已清除' });
    }

    function setDeepExecution(enabled) {
      state.deepExecution = Boolean(enabled);
      if (state.deepExecution) state.yoloExecution = false;
      if (els.deepExecution) els.deepExecution.checked = state.deepExecution;
      if (els.yoloExecution) els.yoloExecution.checked = state.yoloExecution;
    }

    function setYoloExecution(enabled) {
      state.yoloExecution = Boolean(enabled);
      if (state.yoloExecution) state.deepExecution = false;
      if (els.deepExecution) els.deepExecution.checked = state.deepExecution;
      if (els.yoloExecution) els.yoloExecution.checked = state.yoloExecution;
    }

    function renderAdminTokenStatus(status = {}) {
      if (!els.adminTokenStatus) return;
      els.adminTokenStatus.className = `admin-token-status ${status.type || ''}`;
      els.adminTokenStatus.textContent = status.text || (state.adminToken ? '将自动附加到管理接口请求' : '未设置时仅可使用未加锁环境');
    }

    function fetchOptions(options = {}) {
      const next = { ...options };
      const headers = new Headers(options.headers || {});
      if (state.adminToken && !headers.has('Authorization')) {
        headers.set('Authorization', `Bearer ${state.adminToken}`);
      }
      if ([...headers.keys()].length) next.headers = headers;
      return next;
    }

    function acpUrl(path) {
      const token = state.adminToken ? `?token=${encodeURIComponent(state.adminToken)}` : '';
      return `${path}${token}`;
    }

    function ensureThread() {
      if (!els.thread.value.trim()) {
        els.thread.value = initialThreadFromUrl() || localStorage.getItem(THREAD_STORAGE_KEY) || `local-${Date.now().toString(36)}`;
      }
      els.threadMini.textContent = els.thread.value.trim();
      localStorage.setItem(THREAD_STORAGE_KEY, els.thread.value.trim());
      return els.thread.value.trim();
    }

    function initialThreadFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const requested = (params.get('thread') || params.get('thread_id') || '').trim();
      if (requested) return requested.replace(/[^a-zA-Z0-9_.-]+/g, '-').slice(0, 120);
      const newThread = (params.get('newThread') || '').toLowerCase();
      if (['1', 'true', 'yes'].includes(newThread)) return newLocalThreadId();
      return '';
    }

    function newLocalThreadId() {
      return `local-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function resetThreadUiState({ clearCapabilities = true } = {}) {
      state.messages = [];
      state.timeline = [];
      state.artifacts = [];
      state.verification = null;
      state.spec = null;
      state.files = [];
      if (clearCapabilities) {
        state.selectedChatSkills = [];
        state.selectedChatMcpTools = [];
        state.selectedChatWorkflow = null;
        state.selectedAppTemplateName = null;
        setDeepExecution(false);
        setYoloExecution(false);
      }
      state.nextAgentOverride = null;
      state.nextWorkflowOverride = null;
      closeCapabilityPicker();
      state.activeAssistantIndex = null;
      state.finalResultApplied = false;
      state.pendingAutoContinueStatus = '';
      if (state.messageUpdateFrame) {
        cancelAnimationFrame(state.messageUpdateFrame);
        state.messageUpdateFrame = 0;
      }
      uploadController?.cancelAllUploads();
      state.pendingMessageIndexes.clear();
      if (els.fileInput) els.fileInput.value = '';
      if (els.requiredInputFile) els.requiredInputFile.value = '';
      hideRequiredInputPanel();
      renderMessages();
      renderAttachments();
      renderComposerCapabilities();
      renderPanel();
      renderRouteHint();
    }

    function startNewThread() {
      els.thread.value = newLocalThreadId();
      els.threadMini.textContent = els.thread.value;
      localStorage.setItem(THREAD_STORAGE_KEY, els.thread.value);
      resetThreadUiState({ clearCapabilities: true });
      els.input.focus();
    }

    function addMessage(role, content, options = {}) {
      state.messages.push({
        id: `msg-${++state.messageSeq}`,
        role,
        content,
        streaming: Boolean(options.streaming),
        progress: Boolean(options.progress)
      });
      renderMessages();
      return state.messages.length - 1;
    }

    function beginAssistantMessage() {
      if (state.activeAssistantIndex !== null && state.messages[state.activeAssistantIndex]) {
        return state.messages[state.activeAssistantIndex];
      }
      state.activeAssistantIndex = addMessage('assistant', '', { streaming: true });
      return state.messages[state.activeAssistantIndex];
    }

    function appendAssistantDelta(text) {
      if (!text) return;
      const message = beginAssistantMessage();
      if (message.progress) {
        message.content = '';
        message.progress = false;
      }
      message.content += text;
      scheduleMessageUpdate(state.activeAssistantIndex);
    }

    function setAssistantProgress(text) {
      if (!text) return;
      const message = beginAssistantMessage();
      if (message.content && !message.progress) return;
      message.content = text;
      message.progress = true;
      scheduleMessageUpdate(state.activeAssistantIndex);
    }

    function finishAssistantMessage(content) {
      if (state.activeAssistantIndex !== null && state.messages[state.activeAssistantIndex]) {
        const index = state.activeAssistantIndex;
        const message = state.messages[state.activeAssistantIndex];
        if (typeof content === 'string' && content) {
          message.content = content;
          message.progress = false;
        }
        else if (!message.content) message.content = '已完成，但没有返回文本内容。';
        message.streaming = false;
        state.activeAssistantIndex = null;
        scheduleMessageUpdate(index);
        return;
      }
      if (typeof content === 'string' && content) {
        addMessage('assistant', content);
      }
    }

    function addTimeline(name, detail) {
      state.timeline.push({ name, detail });
      if (state.timeline.length > MAX_TIMELINE_ITEMS) {
        state.timeline.splice(0, state.timeline.length - MAX_TIMELINE_ITEMS);
      }
      renderInspectorTabs();
      schedulePanelUpdate();
    }

    function schedulePanelUpdate() {
      if (state.panelUpdateFrame) return;
      state.panelUpdateFrame = requestAnimationFrame(() => {
        state.panelUpdateFrame = 0;
        renderPanel();
      });
    }

    function renderInspectorTabs() {
      document.querySelectorAll('.tab').forEach((tab) => {
        const key = tab.dataset.tab;
        tab.classList.toggle('active', key === state.activeTab);
        const label = tab.dataset.label || tab.textContent.replace(/\s+\d+$/, '').trim();
        tab.dataset.label = label;
        const count = inspectorTabCount(key);
        tab.textContent = count ? `${label} ${count}` : label;
      });
    }

    function inspectorTabCount(key) {
      if (key === 'artifacts') return state.artifacts.length;
      if (key === 'verification') return state.verification ? 1 : 0;
      if (key === 'spec') return state.spec ? 1 : 0;
      if (key === 'timeline') return state.timeline.length;
      return 0;
    }

    function selectInspectorTab(tabName) {
      state.activeTab = tabName || 'artifacts';
      renderInspectorTabs();
      renderPanel();
    }

    function renderMessages() {
      if (!state.messages.length) {
        els.messages.innerHTML = `
          <div class="message assistant">
            <div class="role">Agent</div>
            <div class="bubble">选择 Agent 后输入任务。生成类任务会在右侧形成文件预览，行为识别会先判断是否存在图片、视频或结构化证据。</div>
          </div>
        `;
        return;
      }
      els.messages.innerHTML = state.messages.map((message) => `
        <div id="${messageDomId(message)}" class="message ${escapeHtml(message.role)}">
          <div class="role">${escapeHtml(roleLabel(message.role))}</div>
          <div class="bubble ${message.streaming ? 'streaming' : ''}">
            ${renderMessageContent(message)}
          </div>
        </div>
      `).join('');
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function scheduleMessageUpdate(index) {
      if (index === null || index === undefined) return;
      state.pendingMessageIndexes.add(index);
      if (state.messageUpdateFrame) return;
      state.messageUpdateFrame = requestAnimationFrame(() => {
        const indexes = [...state.pendingMessageIndexes];
        state.pendingMessageIndexes.clear();
        state.messageUpdateFrame = 0;
        indexes.forEach(updateMessageNode);
      });
    }

    function updateMessageNode(index) {
      const message = state.messages[index];
      if (!message) return;
      const node = document.getElementById(messageDomId(message));
      if (!node) {
        renderMessages();
        return;
      }
      const bubble = node.querySelector('.bubble');
      if (!bubble) {
        renderMessages();
        return;
      }
      node.className = `message ${message.role}`;
      bubble.className = `bubble ${message.streaming ? 'streaming' : ''}`;
      bubble.innerHTML = renderMessageContent(message);
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function messageDomId(message) {
      return `chat-${message.id}`;
    }

    function renderTimelineBlock() {
      if (!state.timeline.length) {
        return '<div class="empty">等待任务</div>';
      }
      return `
        <div class="timeline-list">
          ${state.timeline.map((step) => `
            <div class="step">
              <div class="step-name">${escapeHtml(step.name)}</div>
              <div>${escapeHtml(step.detail || '')}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderAttachments() {
      uploadController?.renderAttachments();
    }

    function hasUploadingAttachments() {
      return uploadController?.hasUploadingAttachments() || false;
    }

    function hasFailedAttachments() {
      return uploadController?.hasFailedAttachments() || false;
    }

    function updateComposerControls() {
      uploadController?.updateComposerControls();
    }

    function renderComposerCapabilities() {
      const chips = [
        ...state.selectedChatSkills.map((name) => ({ type: 'skill', name })),
        ...state.selectedChatMcpTools.map((name) => ({ type: 'mcp', name })),
        ...(state.selectedChatWorkflow ? [{ type: 'workflow', name: state.selectedChatWorkflow }] : [])
      ];
      els.capabilityTray.classList.toggle('active', chips.length > 0);
      els.capabilityTray.innerHTML = chips.map((chip) => `
        <span class="capability-chip ${chip.type}">
          <span>${capabilityLabel(chip.type)} · ${escapeHtml(chip.name)}</span>
          <button type="button" title="移除" data-remove-capability="${escapeAttr(chip.type)}" data-name="${escapeAttr(chip.name)}">×</button>
        </span>
      `).join('');
      renderRouteHint();
    }

    function capabilityLabel(type) {
      if (type === 'skill') return 'Skill';
      if (type === 'mcp') return 'MCP';
      return 'Workflow';
    }

    async function openCapabilityPicker(mode) {
      state.capabilityPickerMode = mode;
      renderCapabilityPicker({ loading: true });
      try {
        if (mode === 'skills' && !state.skillsLoaded) await loadSkills({ showLoading: false });
        if (mode === 'mcp' && !state.mcpToolsLoaded) await loadMcpTools({ showLoading: false });
        if (mode === 'workflows' && !state.workflowsLoaded) await loadWorkflows({ showLoading: false });
        renderCapabilityPicker();
      } catch (err) {
        renderCapabilityPicker({ error: err.message });
      }
    }

    function closeCapabilityPicker() {
      state.capabilityPickerMode = null;
      renderCapabilityPicker();
    }

    function renderCapabilityPicker(status = {}) {
      if (!state.capabilityPickerMode) {
        els.capabilityPicker.hidden = true;
        els.capabilityPicker.innerHTML = '';
        return;
      }
      const isSkills = state.capabilityPickerMode === 'skills';
      const isWorkflows = state.capabilityPickerMode === 'workflows';
      const items = isWorkflows ? state.workflows : isSkills ? state.skills : composerMcpTools();
      const selected = isWorkflows
        ? (state.selectedChatWorkflow ? [state.selectedChatWorkflow] : [])
        : isSkills ? state.selectedChatSkills : state.selectedChatMcpTools;
      const title = isWorkflows ? '选择 Workflow' : isSkills ? '添加 Skills' : '添加 MCP';
      const subtitle = isWorkflows
        ? 'Workflow 是显式插件流程；选择后本轮才会进入插件。'
        : isSkills ? '选择本轮 agent loop 可参考的技能。' : '这里只显示手动添加的 MCP；Skill、内置和记忆工具在管理页查看。';
      const empty = status.loading ? '加载中' : status.error || (isWorkflows ? '暂无 Workflow 插件' : isSkills ? '暂无 Skills' : '暂无手动 MCP 工具');
      els.capabilityPicker.hidden = false;
      els.capabilityPicker.innerHTML = `
        <div class="capability-picker-panel" role="dialog" aria-modal="true" aria-label="${escapeAttr(title)}">
          <div class="capability-picker-head">
            <div class="capability-picker-title">
              <strong>${title}</strong>
              <span>${subtitle}</span>
            </div>
            <button class="secondary-btn" type="button" data-capability-close>关闭</button>
          </div>
          <div class="capability-picker-list">
            ${items.length ? items.map((item) => renderCapabilityChoice(item, state.capabilityPickerMode, selected.includes(item.name))).join('') : `<div class="empty-panel">${escapeHtml(empty)}</div>`}
          </div>
          <div class="capability-picker-foot">
            ${isWorkflows ? '<button class="secondary-btn" type="button" data-upload-workflow-plugin>上传 Workflow 插件</button><button class="secondary-btn" type="button" data-clear-workflow>不使用 Workflow</button>' : `<button class="secondary-btn" type="button" ${isSkills ? 'data-compose-add-skill' : 'data-compose-add-mcp'}>${isSkills ? '上传 Skill 插件' : '新建 MCP 工具'}</button>`}
            <button class="secondary-btn" type="button" data-compose-manage="${isWorkflows ? 'workflows' : isSkills ? 'skills' : 'tools'}">${isWorkflows ? '管理 Workflows' : isSkills ? '管理 Skills' : '管理 Tools'}</button>
            <button class="secondary-btn" type="button" data-capability-close>完成</button>
          </div>
        </div>
      `;
    }

    function composerMcpTools() {
      return state.mcpTools.filter((tool) => toolSourceType(tool) === 'manual' && tool.name !== 'jetlinks_runtime_status');
    }

    function renderCapabilityChoice(item, mode, active) {
      const name = item.name || '';
      const isSkill = mode === 'skills';
      const isWorkflow = mode === 'workflows';
      const meta = isWorkflow
        ? `${item.trigger || 'explicit'} · ${item.enabled ? 'enabled' : 'disabled'}`
        : isSkill
        ? `${item.output_kind || 'json'} · ${item.sandbox?.enabled ? `Sandbox ${item.sandbox.profile || ''}` : 'Local'}`
        : `${item.source?.type || 'manual'} · ${item.enabled ? 'enabled' : 'disabled'}`;
      return `
        <button class="capability-choice ${active ? 'active' : ''}" type="button" ${isWorkflow ? `data-chat-workflow="${escapeAttr(name)}"` : isSkill ? `data-chat-skill="${escapeAttr(name)}"` : `data-chat-mcp="${escapeAttr(name)}"`}>
          <span class="capability-choice-main">
            <strong>${escapeHtml(name)}</strong>
            <span>${escapeHtml(item.description || meta)}</span>
          </span>
          <span class="capability-choice-state">${active ? '已添加' : '添加'}</span>
        </button>
      `;
    }

    function toggleCapability(kind, name) {
      if (!name) return;
      clearSelectedAppTemplate();
      if (kind === 'workflow') {
        state.selectedChatWorkflow = state.selectedChatWorkflow === name ? null : name;
        renderComposerCapabilities();
        closeCapabilityPicker();
        return;
      }
      const list = kind === 'skill' ? state.selectedChatSkills : state.selectedChatMcpTools;
      const index = list.indexOf(name);
      if (index >= 0) list.splice(index, 1);
      else list.push(name);
      renderComposerCapabilities();
      closeCapabilityPicker();
    }

    function removeCapability(kind, name) {
      if (!name) return;
      clearSelectedAppTemplate();
      if (kind === 'workflow') {
        if (state.selectedChatWorkflow === name) state.selectedChatWorkflow = null;
        renderComposerCapabilities();
        renderCapabilityPicker();
        return;
      }
      const list = kind === 'skill' ? state.selectedChatSkills : state.selectedChatMcpTools;
      const index = list.indexOf(name);
      if (index >= 0) list.splice(index, 1);
      renderComposerCapabilities();
      renderCapabilityPicker();
    }

    function renderPanel() {
      if (state.activeTab === 'verification') {
        renderVerificationPanel();
      } else if (state.activeTab === 'spec') {
        renderSpecPanel();
      } else if (state.activeTab === 'timeline') {
        renderTimelinePanel();
      } else if (state.activeTab === 'abilities') {
        renderAbilityPanel();
      } else {
        renderArtifactPanel();
      }
    }

    function renderArtifactPanel() {
      const timeline = state.timeline.length ? `
        <section class="timeline">
          <div class="timeline-head">
            <span>执行</span>
            <span>${state.timeline.length}</span>
          </div>
          ${renderTimelineBlock()}
        </section>
      ` : '';

      if (!state.artifacts.length) {
        els.panel.innerHTML = `
          ${timeline}
          <div class="empty-panel">暂无文件输出</div>
        `;
        return;
      }
      els.panel.innerHTML = `
        ${timeline}
        <section class="panel-section">
          ${state.artifacts.map((artifact) => `
            <div class="artifact">
              <div class="artifact-name">${escapeHtml(artifact.name)}</div>
              <div class="artifact-meta">${escapeHtml(artifact.kind)} · ${escapeHtml(artifact.mime_type)} · ${formatBytes(artifact.size)}</div>
              <div class="artifact-actions">
                <button type="button" data-preview="${escapeAttr(artifact.preview_url)}" data-kind="${escapeAttr(artifact.kind)}" data-id="${safeId(artifact.path)}">预览</button>
                <button type="button" data-download="${escapeAttr(artifact.download_url)}">下载</button>
              </div>
              <div class="preview ${artifact.kind === 'image' ? 'image-preview' : ''}" id="preview-${safeId(artifact.path)}" ${artifact.kind === 'image' ? '' : 'hidden'}>
                ${artifact.kind === 'image' ? `<img src="${escapeAttr(artifact.preview_url)}" alt="${escapeAttr(artifact.name)}">` : ''}
              </div>
            </div>
          `).join('')}
        </section>
      `;
    }

    function renderVerificationPanel() {
      if (!state.verification) {
        els.panel.innerHTML = state.running
          ? '<div class="verify running"><div class="status running">校验等待中</div></div>'
          : '<div class="empty-panel">暂无校验结果</div>';
        return;
      }
      const passed = state.verification.passed;
      const checks = state.verification.checks || [];
      els.panel.innerHTML = `
        <div class="verify ${passed ? '' : 'failed'}">
          <div class="status ${passed ? '' : 'failed'}">${passed ? '校验通过' : '校验未通过'}</div>
          <div class="artifact-meta">retry: ${state.verification.retry_count || 0}</div>
        </div>
        <div class="check-list">
          ${checks.map((check) => `
            <div class="check">
              <span>${check.passed ? '✓' : '×'}</span>
              <div><strong>${escapeHtml(check.name)}</strong><br>${escapeHtml(check.detail || '')}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderSpecPanel() {
      if (!state.spec) {
        els.panel.innerHTML = '<div class="empty-panel">暂无 Spec</div>';
        return;
      }
      els.panel.innerHTML = `<div class="spec"><pre>${escapeHtml(JSON.stringify(state.spec, null, 2))}</pre></div>`;
    }

    function renderTimelinePanel() {
      els.panel.innerHTML = `
        <section class="timeline">
          <div class="timeline-head">
            <span>执行事件</span>
            <span>${state.timeline.length}</span>
          </div>
          ${renderTimelineBlock()}
        </section>
      `;
    }

    function renderAgents() {
      if (!state.agents.length) {
        els.agentList.innerHTML = '<div class="empty">暂无 Agent</div>';
        return;
      }
      els.agentList.innerHTML = state.agents.map((agent) => `
        <button class="agent-item ${agent.name === els.agent.value ? 'active' : ''}" type="button" data-agent-select="${escapeHtml(agent.name)}">
          <strong>${escapeHtml(agent.display_name || agent.name)}</strong>
          <span>${escapeHtml(agentHints[agent.name] || agent.name)}</span>
        </button>
      `).join('');
    }

    function renderSelectedAgent() {
      const agent = state.agents.find((item) => item.name === els.agent.value);
      els.activeAgentLabel.textContent = agent?.display_name || els.agent.value || 'Agent';
      document.querySelectorAll('[data-agent-select]').forEach((item) => {
        item.classList.toggle('active', item.dataset.agentSelect === els.agent.value);
      });
      renderAgents();
      renderRouteHint();
    }

    async function loadAgents() {
      const res = await fetch('/api/agents');
      const data = await res.json();
      state.agents = data.agents || [];
      els.agent.innerHTML = state.agents.map((agent) => `<option value="${escapeHtml(agent.name)}">${escapeHtml(agent.display_name || agent.name)}</option>`).join('');
      if ([...els.agent.options].some((option) => option.value === 'default')) {
        els.agent.value = 'default';
      }
      renderAgents();
      renderSelectedAgent();
    }

    async function loadAppTemplates() {
      if (els.appSummary) els.appSummary.textContent = '加载智能体模板中';
      const res = await fetch('/api/apps/templates', { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      state.appTemplates = data.templates || [];
      if (state.appFilter !== 'all' && !state.appTemplates.some((item) => (item.category || 'general') === state.appFilter)) {
        state.appFilter = 'all';
      }
      state.appTemplatesLoaded = true;
      renderAppFilterRow();
      renderAppTemplateSummary();
      renderAppTemplateList();
    }

    function renderAppFilterRow() {
      if (!els.appFilterRow) return;
      const categories = [...new Set(state.appTemplates.map((item) => item.category || 'general'))]
        .sort((a, b) => appCategoryOrder(a) - appCategoryOrder(b) || categoryLabel(a).localeCompare(categoryLabel(b), 'zh-CN'));
      const filters = ['all', ...categories];
      els.appFilterRow.innerHTML = filters.map((category) => `
        <button class="${category === state.appFilter ? 'active' : ''}" type="button" data-app-filter="${escapeAttr(category)}">${escapeHtml(category === 'all' ? '全部' : categoryLabel(category))}</button>
      `).join('');
    }

    function renderAppTemplateSummary(status = '') {
      if (!els.appSummary) return;
      const filteredCount = filteredAppTemplates().length;
      const categories = new Set(state.appTemplates.map((item) => item.category || 'general')).size;
      els.appSummary.textContent = status || `${state.appTemplates.length} 个预置模板 · ${categories} 个分类 · 当前 ${filteredCount} 个`;
    }

    function filteredAppTemplates() {
      const templates = [...state.appTemplates];
      const sorted = templates.sort((a, b) => String(a.title || a.name).localeCompare(String(b.title || b.name), 'zh-CN'));
      if (state.appFilter === 'all') return sorted;
      return sorted.filter((template) => (template.category || 'general') === state.appFilter);
    }

    function renderAppTemplateList() {
      if (!els.appTemplateList) return;
      const templates = filteredAppTemplates();
      if (!templates.length) {
        els.appTemplateList.innerHTML = '<div class="empty-panel">暂无匹配模板</div>';
        return;
      }
      els.appTemplateList.innerHTML = templates.map((template) => {
        const jsonOpen = state.selectedAppTemplateJsonName === template.name;
        return `
          <article class="app-template-card">
            <div class="app-template-head">
              <div class="app-template-icon">${escapeHtml(appTemplateIcon(template.icon))}</div>
              <div class="app-template-title">
                <strong>${escapeHtml(template.title || template.name)}</strong>
                <span>${escapeHtml(template.agent_name || 'default')} ${template.workflow ? `· ${template.workflow}` : ''}</span>
              </div>
            </div>
            <p>${escapeHtml(template.description || '')}</p>
            <div class="skill-badges">
              <span class="skill-badge sandbox">${escapeHtml(categoryLabel(template.category))}</span>
              ${(template.tags || []).slice(0, 4).map((tag) => `<span class="skill-badge">${escapeHtml(tag)}</span>`).join('')}
            </div>
            <div class="skill-file-line">Skills: ${escapeHtml((template.selected_skills || []).join(', ') || '按 Agent 默认')}</div>
            ${jsonOpen ? `<pre class="app-template-json">${escapeHtml(JSON.stringify(template, null, 2))}</pre>` : ''}
            <div class="app-template-actions">
              <button class="secondary-btn" type="button" data-app-template-json="${escapeAttr(template.name)}">${jsonOpen ? '收起 JSON' : '查看 JSON'}</button>
              <button class="secondary-btn" type="button" data-app-template-prompt="${escapeAttr(template.name)}">填入示例</button>
              <button class="secondary-btn" type="button" data-app-template-cron="${escapeAttr(template.name)}">建 Cron</button>
              <button class="primary-btn" type="button" data-app-template-use="${escapeAttr(template.name)}">使用此应用</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function appTemplateIcon(icon) {
      const icons = {
        chat: '💬',
        diagram: '▦',
        slides: '▣',
        table: '▤',
        doc: '¶',
        mindmap: '☷',
        shield: '◉',
        package: '✦'
      };
      return icons[icon] || '✦';
    }

    function categoryLabel(category) {
      const labels = {
        general: '通用',
        generation: '生成',
        vision: '视觉',
        'algorithm-training': '算法训练'
      };
      return labels[category] || category || '通用';
    }

    function appCategoryOrder(category) {
      const order = {
        general: 10,
        'algorithm-training': 20,
        vision: 30,
        generation: 40
      };
      return order[category] || 100;
    }

    function getAppTemplate(name) {
      return state.appTemplates.find((template) => template.name === name) || null;
    }

    function clearSelectedAppTemplate() {
      state.selectedAppTemplateName = null;
    }

    function applyAppTemplate(name, options = {}) {
      const template = getAppTemplate(name);
      if (!template) return;
      setAgent(template.agent_name || 'default');
      state.selectedChatSkills = [...(template.selected_skills || [])];
      state.selectedChatMcpTools = [...(template.selected_mcp_tools || [])];
      state.selectedChatWorkflow = template.workflow || null;
      state.nextAgentOverride = null;
      state.nextWorkflowOverride = null;
      state.selectedAppTemplateName = template.name;
      if (options.fillPrompt !== false && template.prompt_examples?.length) {
        els.input.value = template.prompt_examples[0];
      }
      closeCapabilityPicker();
      renderComposerCapabilities();
      renderAppTemplateSummary(`已套用：${template.title || template.name}`);
      setView('chat');
      els.input.focus();
    }

    function runtimeOptionsFromAppTemplate(template, threadId = null) {
      const runtimeOptions = {
        ...(template.runtime_options && typeof template.runtime_options === 'object' ? template.runtime_options : {}),
        app_template_name: template.name,
        model_type: 'chat',
        selected_skills: [...(template.selected_skills || [])],
        selected_mcp_tools: [...(template.selected_mcp_tools || [])]
      };
      if (threadId) runtimeOptions.thread_id = threadId;
      if (template.workflow) runtimeOptions.workflow = template.workflow;
      return runtimeOptions;
    }

    function selectedAppTemplateRuntimeOptions() {
      const template = state.selectedAppTemplateName ? getAppTemplate(state.selectedAppTemplateName) : null;
      return template?.runtime_options && typeof template.runtime_options === 'object' ? template.runtime_options : {};
    }

    function createCronFromAppTemplate(name) {
      const template = getAppTemplate(name);
      if (!template) return;
      const jobName = `app-${template.name}`.replace(/[^A-Za-z0-9_.-]/g, '-').slice(0, 120);
      state.selectedCronJobName = jobName;
      state.selectedCronJob = {
        name: jobName,
        isDraft: true,
        title: `${template.title || template.name} 定时任务`,
        description: template.description || '由应用中心模板创建的 Cron 任务。',
        enabled: true,
        schedule: '0 9 * * *',
        timezone: 'Asia/Shanghai',
        agent_name: template.agent_name || 'default',
        prompt: template.prompt_examples?.[0] || '',
        runtime_options: runtimeOptionsFromAppTemplate(template),
        last_status: 'idle',
        run_count: 0
      };
      if (!state.cronJobs.some((job) => job.name === jobName)) state.cronJobs.push(state.selectedCronJob);
      state.selectedCronRuns = [];
      state.cronPreviewRuns = [];
      setView('cron');
      renderCronList();
      renderCronSummary();
      renderCronEditor({ text: '已从应用模板生成 Cron 草稿，确认时间后保存' });
      previewSelectedCronJob().then(() => {
        renderCronEditor({ text: '已从应用模板生成 Cron 草稿，确认时间后保存' });
      }).catch((err) => {
        renderCronEditor({ type: 'error', text: err.message });
      });
    }

    async function loadSkills(options = {}) {
      if (els.skillSummary) els.skillSummary.textContent = '加载技能中';
      const res = await fetch('/api/skills', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.statusText || `HTTP ${res.status}`);
      const data = await res.json();
      state.skills = data.skills || [];
      state.skillsLoaded = true;
      if (!state.selectedSkillName && state.skills.length) {
        state.selectedSkillName = state.skills[0].name;
      }
      renderSkillList();
      if (state.selectedSkillName) {
        await loadSkillDetail(state.selectedSkillName, options);
      } else {
        renderSkillEditor();
      }
      renderSkillSummary();
    }

    async function loadSkillDetail(skillName, options = {}) {
      state.selectedSkillName = skillName;
      renderSkillList();
      if (els.skillEditor && options.showLoading !== false) {
        els.skillEditor.innerHTML = '<div class="empty-panel">加载技能配置</div>';
      }
      const res = await fetch(`/api/skills/${encodeURIComponent(skillName)}`, { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      }
      state.selectedSkill = skillDetailPayload(data);
      const packageFiles = state.selectedSkill.package_files || [];
      if (!packageFiles.some((file) => file.id === state.selectedSkillFileId)) {
        state.selectedSkillFileId = packageFiles.find((file) => file.id === 'manifest')?.id || packageFiles[0]?.id || 'manifest';
      }
      if (packageFiles.length) {
        await loadSkillPackageFile(skillName, state.selectedSkillFileId, { render: false, showLoading: false });
      } else {
        state.selectedSkillFile = null;
        state.selectedSkillFileContent = skillSourceText(state.selectedSkill);
      }
      mergeSkillSummary(data);
      renderSkillList();
      renderSkillEditor();
      renderSkillSummary();
    }

    function skillDetailPayload(data) {
      const manifest = data?.manifest || data || {};
      return {
        ...manifest,
        editable: data?.editable,
        source_path: data?.source_path,
        source_exists: data?.source_exists,
        source_text: data?.source_text,
        package_files: data?.package_files || []
      };
    }

    function mergeSkillSummary(skill) {
      if (!skill?.name) return;
      const index = state.skills.findIndex((item) => item.name === skill.name);
      const summary = {
        name: skill.name,
        description: skill.description,
        output_kind: skill.output_kind,
        generation: skill.generation,
        quality_template: skill.quality_template,
        sandbox: skill.sandbox,
        source: skill.source,
        executable: skill.executable,
        editable: skill.editable,
        source_path: skill.source_path,
        source_exists: skill.source_exists
      };
      if (index >= 0) state.skills[index] = { ...state.skills[index], ...summary };
      else state.skills.push(summary);
    }

    function renderSkillSummary() {
      if (!els.skillSummary) return;
      const sandboxCount = state.skills.filter((skill) => skill.sandbox?.enabled).length;
      const generationCount = state.skills.filter((skill) => skill.generation).length;
      const executableCount = state.skills.filter((skill) => skill.executable !== false).length;
      els.skillSummary.textContent = `${state.skills.length} 个技能 · ${executableCount} 个可执行 · ${generationCount} 个生成型 · ${sandboxCount} 个沙盒执行`;
    }

    function renderSkillList() {
      if (!els.skillList) return;
      const filtered = filteredSkills();
      if (!filtered.length) {
        els.skillList.innerHTML = '<div class="empty-panel">暂无匹配技能</div>';
        return;
      }
      const groups = groupSkills(filtered);
      els.skillList.innerHTML = groups.map((group) => `
        <section class="skill-group">
          <div class="skill-group-title">${escapeHtml(group.label)} · ${group.items.length}</div>
          ${group.items.map((skill) => `
            <button class="skill-row ${skill.name === state.selectedSkillName ? 'active' : ''}" type="button" data-skill-select="${escapeAttr(skill.name)}">
              <div class="skill-row-main">
                <strong>${escapeHtml(skill.name)}</strong>
                <span class="skill-badge">${escapeHtml(skill.output_kind || 'json')}</span>
              </div>
              <p>${escapeHtml(skill.description || '')}</p>
              <div class="skill-file-line">实体 · ${escapeHtml(displaySourcePath(skill.source_path, `config/skills/${skill.name}.json`))} · ${skill.source?.plugin_id ? `实现 · ${escapeHtml(skill.source.plugin_id)}` : '无插件实现'} · ${skill.editable ? '可编辑' : '只读'}</div>
              <div class="skill-badges">
                <span class="skill-badge ${skill.executable === false ? 'local' : 'sandbox'}">${skill.executable === false ? '未安装执行器' : '可执行'}</span>
                <span class="skill-badge ${skill.generation ? '' : 'local'}">${skill.generation ? '生成' : '判断'}</span>
                ${skill.sandbox?.enabled
                  ? `<span class="skill-badge sandbox">Sandbox · ${escapeHtml(skill.sandbox.profile || '-')}</span>`
                  : '<span class="skill-badge local">Local</span>'}
              </div>
            </button>
          `).join('')}
        </section>
      `).join('');
    }

    function filteredSkills() {
      const skills = [...state.skills].sort((a, b) => String(a.name).localeCompare(String(b.name)));
      if (state.skillFilter === 'generation') return skills.filter((skill) => skill.generation);
      if (state.skillFilter === 'sandbox') return skills.filter((skill) => skill.sandbox?.enabled);
      if (state.skillFilter === 'local') return skills.filter((skill) => !skill.sandbox?.enabled);
      return skills;
    }

    function displaySourcePath(path, fallback) {
      const text = String(path || fallback || '');
      const marker = '/config/skills/';
      const index = text.indexOf(marker);
      if (index >= 0) return `config/skills/${text.slice(index + marker.length)}`;
      const pluginMarker = '/plugins/skills/';
      const pluginIndex = text.indexOf(pluginMarker);
      if (pluginIndex >= 0) return `plugins/skills/${text.slice(pluginIndex + pluginMarker.length)}`;
      return text || fallback || '';
    }

    function groupSkills(skills) {
      const order = ['drawio', 'presentation', 'spreadsheet', 'mindmap', 'markdown', 'json'];
      const labels = {
        drawio: '图形与架构',
        presentation: '演示文稿',
        spreadsheet: '表格',
        mindmap: '思维导图',
        markdown: '文档',
        json: '识别与判断'
      };
      const map = new Map();
      skills.forEach((skill) => {
        const key = skill.output_kind || 'json';
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(skill);
      });
      return [...map.entries()]
        .sort(([a], [b]) => (order.indexOf(a) === -1 ? 99 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 99 : order.indexOf(b)))
        .map(([key, items]) => ({ key, label: labels[key] || key, items }));
    }

    function skillManifestForSave(skill) {
      const {
        editable,
        source_path,
        source_exists,
        source_text,
        package_files,
        source,
        executable,
        ...manifest
      } = skill || {};
      return manifest;
    }

    function skillSourceText(skill) {
      return skill?.source_text || `${JSON.stringify(skillManifestForSave(skill), null, 2)}\n`;
    }

    async function loadSkillPackageFile(skillName, fileId, options = {}) {
      state.selectedSkillFileId = fileId || 'manifest';
      if (els.skillEditor && options.showLoading !== false) {
        state.selectedSkillFile = null;
        state.selectedSkillFileContent = '加载文件中';
        renderSkillEditor();
      }
      const res = await fetch(`/api/skills/${encodeURIComponent(skillName)}/files/${encodeURIComponent(state.selectedSkillFileId)}`, { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      }
      state.selectedSkillFile = data.file || null;
      state.selectedSkillFileContent = typeof data.content === 'string' ? data.content : '';
      if (options.render !== false) renderSkillEditor();
    }

    function selectedPackageFile(skill) {
      const files = skill?.package_files || [];
      return state.selectedSkillFile
        || files.find((file) => file.id === state.selectedSkillFileId)
        || files.find((file) => file.id === 'manifest')
        || files[0]
        || null;
    }

    function selectedPackageFileContent(skill, file) {
      if (typeof state.selectedSkillFileContent === 'string' && state.selectedSkillFileContent) {
        return state.selectedSkillFileContent;
      }
      return file?.id === 'manifest' ? skillSourceText(skill) : '';
    }

    function renderSkillEditor(status = {}) {
      if (!els.skillEditor) return;
      const skill = state.selectedSkill;
      if (!skill) {
        els.skillEditor.innerHTML = '<div class="empty-panel">选择左侧技能</div>';
        return;
      }
      const sandbox = skill.sandbox || {};
      const packageFiles = skill.package_files || [];
      const packageFile = selectedPackageFile(skill);
      const fileContent = selectedPackageFileContent(skill, packageFile);
      const isManifestFile = (packageFile?.id || state.selectedSkillFileId) === 'manifest';
      const manifestPreview = `${JSON.stringify(skillManifestForSave(skill), null, 2)}\n`;
      const manifestConfigForm = renderSkillManifestConfigForm(skill, sandbox, packageFile);
      els.skillEditor.innerHTML = `
        <div class="skill-editor-head">
          <div class="skill-editor-title">
            <strong>${escapeHtml(skill.name)}</strong>
            <span>${escapeHtml(displaySourcePath(skill.source_path, `config/skills/${skill.name}.json`))}</span>
          </div>
          <div id="skillEditStatus" class="skill-status ${status.type || ''}">${escapeHtml(status.text || '')}</div>
        </div>
        <section class="file-editor">
          ${packageFiles.length ? `
            <div class="package-file-tabs">
              ${packageFiles.map((file) => `
                <button class="${file.id === (packageFile?.id || state.selectedSkillFileId) ? 'active' : ''}" type="button" data-skill-file="${escapeAttr(file.id)}">
                  ${escapeHtml(file.label || file.id)}
                </button>
              `).join('')}
            </div>
          ` : ''}
          <div class="file-editor-head">
            <div class="file-editor-title">
              <strong>${escapeHtml(packageFile?.label || 'manifest.json')} · ${isManifestFile ? '表单生成预览' : 'Skill 包文件'}</strong>
              <span>${escapeHtml(displaySourcePath(packageFile?.path || skill.source_path, `config/skills/${skill.name}.json`))}</span>
            </div>
            <div class="file-edit-meta">${packageFile?.exists ? '已存在' : '保存后创建文件'} · ${escapeHtml(packageFile?.language || 'text')}${isManifestFile ? ' · 由下方配置生成' : ''}</div>
          </div>
          ${isManifestFile ? `
            ${manifestConfigForm}
            <div class="field">
              <label for="skillManifestPreview">生成后的 Manifest JSON</label>
              <textarea id="skillManifestPreview" class="code manifest-preview" spellcheck="false" readonly>${escapeHtml(manifestPreview)}</textarea>
            </div>
            <div class="field">
              <label for="skillSandboxPreview">同步生成的 Sandbox YAML</label>
              <textarea id="skillSandboxPreview" class="code manifest-preview sandbox-preview" spellcheck="false" readonly>${escapeHtml(sandboxYamlPreview(skill))}</textarea>
            </div>
            <div class="skill-form-actions">
              <button class="secondary-btn" type="button" data-skill-refresh-manifest>刷新预览</button>
            </div>
          ` : `
            <div class="field">
              <textarea id="skillPackageFileContent" class="code file-code" spellcheck="false" ${packageFile?.editable === false ? 'disabled' : ''}>${escapeHtml(fileContent)}</textarea>
            </div>
            <div class="skill-form-actions">
              ${packageFile?.language === 'json' ? '<button class="secondary-btn" type="button" data-skill-format-file>格式化 JSON</button>' : ''}
              <button class="primary-btn" type="button" data-skill-save-file ${packageFile?.editable === false ? 'disabled' : ''}>保存包文件</button>
            </div>
          `}
        </section>
      `;
    }

      const routing = skill.routing || {};
      return `
        <form id="skillForm" class="skill-form">

            <div class="schema-editor-actions">
              <select data-schema-add-preset="${escapeAttr(kind)}" aria-label="${escapeAttr(title)}字段模板">

    function schemaFieldRowHtml(kind, field = {}) {
      const type = field.type || 'string';
      const itemsType = field.itemsType || 'string';
      return `
        <div class="schema-row" data-schema-row="${escapeAttr(kind)}">
          <div class="schema-row-head">
            <div class="field">
              <label>字段名</label>
              <input data-schema-field-name value="${escapeAttr(field.name || '')}" placeholder="title">
            </div>
            <div class="field">
              <label>类型</label>
              <select data-schema-field-type>
                ${['string', 'number', 'integer', 'boolean', 'array', 'object'].map((item) => `
                  <option value="${escapeAttr(item)}" ${type === item ? 'selected' : ''}>${escapeHtml(item)}</option>
                `).join('')}
              </select>
            </div>
            <div class="field">
              <label>标签</label>
              <select data-schema-field-param-kind>
                ${schemaParamKindOptionsHtml(field.paramKind || '')}
              </select>
            </div>
            <label class="check-field">
              <input type="checkbox" data-schema-field-required ${field.required ? 'checked' : ''}>
              <span>是</span>
            </label>
            <div class="field">
              <label>描述</label>
              <input data-schema-field-description value="${escapeAttr(field.description || '')}" placeholder="字段说明">
            </div>
            <div class="schema-row-actions">
              <button type="button" data-schema-toggle-advanced>高级</button>
              <button type="button" data-schema-remove-field>删除</button>
            </div>
          </div>
          <div class="schema-row-grid" hidden>
            <div class="field">
              <label>格式</label>
              <input data-schema-field-format value="${escapeAttr(field.format || '')}" placeholder="date-time / uri">
            </div>
            <div class="field">
              <label>枚举值</label>
              <textarea data-schema-field-enum>${escapeHtml(field.enumText || '')}</textarea>
            </div>
          </div>
          <div class="schema-row-grid">
            <div class="field">
              <label>默认值</label>
              <input data-schema-field-default value="${escapeAttr(field.defaultText || '')}" placeholder="可留空">
            </div>
            <div class="field">
              <label>固定值</label>
              <input data-schema-field-const value="${escapeAttr(field.constText || '')}" placeholder="可留空">
            </div>
            <div class="field">
              <label>数组元素类型</label>
              <select data-schema-field-items-type ${type === 'array' ? '' : 'disabled'}>
                ${['string', 'number', 'integer', 'boolean', 'object'].map((item) => `
                  <option value="${escapeAttr(item)}" ${itemsType === item ? 'selected' : ''}>${escapeHtml(item)}</option>
                `).join('')}
              </select>
            </div>
          </div>
        </div>
      `;
    }

    function schemaParamKindOptionsHtml(selected) {
      const normalized = normalizeSchemaParamKind(selected);
      return schemaParamKindOptions.map(([value, label]) => `
        <option value="${escapeAttr(value)}" ${normalized === value ? 'selected' : ''}>${escapeHtml(label)}</option>
      `).join('');
    }

    function schemaFieldPresetOptionsHtml(selected) {
      const current = normalizeSchemaParamKind(selected);
      return schemaParamKindOptions.map(([value, label]) => {
        let displayLabel = label;
        if (!value) displayLabel = '普通参数（手动填写）';
        else if (value === 'other') displayLabel = '其他（手动填写）';
        return `
          <option value="${escapeAttr(value)}" ${current === value ? 'selected' : ''}>${escapeHtml(displayLabel)}</option>
        `;
      }).join('');
    }

    function normalizeSchemaParamKind(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      return schemaParamKindOptions.some(([optionValue]) => optionValue === raw) ? raw : 'other';
    }

    function schemaEditorState(schema) {
      const source = schema && typeof schema === 'object' && !Array.isArray(schema) ? schema : {};
      const properties = source.properties && typeof source.properties === 'object' && !Array.isArray(source.properties)
        ? source.properties
        : {};
      const required = new Set(Array.isArray(source.required) ? source.required.filter((item) => typeof item === 'string') : []);
      const fields = Object.entries(properties).map(([name, definition]) => {
        const data = definition && typeof definition === 'object' && !Array.isArray(definition) ? definition : {};
        const items = data.items && typeof data.items === 'object' && !Array.isArray(data.items) ? data.items : {};
        const paramKind = typeof data.x_param_kind === 'string'
          ? data.x_param_kind
          : (typeof data['x-param-kind'] === 'string' ? data['x-param-kind'] : '');
        return {
          name,
          type: typeof data.type === 'string' ? data.type : 'string',
          required: required.has(name),
          description: typeof data.description === 'string' ? data.description : '',
          paramKind: normalizeSchemaParamKind(paramKind),
          format: typeof data.format === 'string' ? data.format : '',
          enumText: Array.isArray(data.enum) ? data.enum.map(schemaLiteralToText).join('\n') : '',
          defaultText: Object.prototype.hasOwnProperty.call(data, 'default') ? schemaLiteralToText(data.default) : '',
          constText: Object.prototype.hasOwnProperty.call(data, 'const') ? schemaLiteralToText(data.const) : '',
          itemsType: typeof items.type === 'string' ? items.type : 'string'
        };
      });
      return {
        type: source.type === 'object' ? 'object' : 'object',
        additionalProperties: source.additionalProperties !== false,
        fields
      };
    }

    function collectSkillForm() {
      const form = document.getElementById('skillForm');
      if (!form || !state.selectedSkill) return null;
      const formData = new FormData(form);
      const inputSchema = collectSchemaEditor('input');
      const outputSchema = collectSchemaEditor('output');
      const fallback = String(formData.get('fallback_to_local') || 'null');
      const routing = {
        summary: String(formData.get('routing_summary') || '').trim(),
        keywords: splitQualityTemplate(String(formData.get('routing_keywords') || '')),
        examples: splitQualityTemplate(String(formData.get('routing_examples') || ''))
      };
      Object.keys(routing).forEach((key) => {
        if (Array.isArray(routing[key]) ? !routing[key].length : !routing[key]) delete routing[key];
      });
      return {
        ...skillManifestForSave(state.selectedSkill),
        name: state.selectedSkill.name,
        description: String(formData.get('description') || '').trim(),
        output_kind: String(formData.get('output_kind') || '').trim() || 'json',
        generation: formData.get('generation') === 'on',
        quality_template: splitQualityTemplate(String(formData.get('quality_template') || '')),
        routing,
        execution: collectExecutionConfig(formData),
        input_schema: inputSchema,
        output_schema: outputSchema,
        sandbox: {
          enabled: formData.get('sandbox_enabled') === 'on',
          profile: nullableText(formData.get('sandbox_profile')),
          request_schema_version: String(formData.get('request_schema_version') || '').trim() || 'skill-run.v1',
          adapter_command: nullableText(formData.get('adapter_command')),
          fallback_to_local: fallback === 'null' ? null : fallback === 'true'
        }
      };
    }

    function collectExecutionConfig(formData) {
      const type = String(formData.get('execution_type') || 'custom').trim();
      const advancedText = String(formData.get('execution_advanced') || '').trim();
      const advanced = advancedText ? parseJsonField(advancedText, '执行配置高级 JSON') : {};
      if (type === 'custom') {
        return advancedText ? { ...advanced, type: 'custom' } : {};
      }
      const execution = { ...advanced, type };
      const filename = nullableText(formData.get('execution_filename'));
      const template = String(formData.get('execution_template') || '');
      if (type === 'python_script') {
        execution.script = String(formData.get('execution_script') || '').trim();
        if (!execution.script) throw new Error('Python 脚本不能为空');
      }
      if (filename) {
        if (type === 'command') execution.stdout_filename = filename;
        else execution.filename = filename;
      }
      if (type === 'template') {
        execution.template = template;
      } else if (type === 'http') {
        execution.url = String(formData.get('execution_url') || '').trim();
        execution.method = String(formData.get('execution_method') || 'POST').trim() || 'POST';
        execution.body_template = template;
      } else if (type === 'command') {
        execution.command = String(formData.get('execution_command') || '').trim();
        execution.args = splitCommandArgs(String(formData.get('execution_args') || ''));
        execution.stdin_template = template;
      }
      return pruneEmptyExecution(execution);
    }

    function executionAdvancedJson(execution = {}) {
      const clone = { ...execution };
      [
        'type',
        'script',
        'python',
        'input_mode',
        'collect_outputs',
        'timeout_seconds',
        'filename',
        'stdout_filename',
        'template',
        'url',
        'method',
        'body_template',
        'command',
        'args',
        'stdin_template'
      ].forEach((key) => delete clone[key]);
      return Object.keys(clone).length ? `${JSON.stringify(clone, null, 2)}\n` : '{}';
    }

    function splitCommandArgs(text) {
      return String(text || '').trim().split(/\s+/).filter(Boolean);
    }

    function pruneEmptyExecution(execution) {
      const next = {};
      Object.entries(execution).forEach(([key, value]) => {
        if (value == null) return;
        if (typeof value === 'string' && !value.trim()) return;
        if (Array.isArray(value) && !value.length) return;
        if (value && typeof value === 'object' && !Array.isArray(value) && !Object.keys(value).length) return;
        next[key] = value;
      });
      return next;
    }

    function updateSkillManifestPreview() {
      const textarea = document.getElementById('skillManifestPreview');
      const sandboxTextarea = document.getElementById('skillSandboxPreview');
      if (!textarea && !sandboxTextarea) return;
      try {
        const manifest = collectSkillForm();
        if (textarea) textarea.value = `${JSON.stringify(manifest, null, 2)}\n`;
        if (sandboxTextarea) sandboxTextarea.value = `${sandboxYamlFromManifest(manifest)}\n`;
        const status = document.getElementById('skillEditStatus');
        if (status) {
          status.className = 'skill-status';
          status.textContent = '配置预览已更新';
        }
      } catch (err) {
        const status = document.getElementById('skillEditStatus');
        if (status) {
          status.className = 'skill-status error';
          status.textContent = err.message;
        }
      }
    }

    function sandboxYamlPreview(skill) {
      try {
        return sandboxYamlFromManifest(skillManifestForSave(skill));
      } catch (err) {
        return `# ${err.message}`;
      }
    }

    function sandboxYamlFromManifest(manifest) {
      const sandbox = manifest?.sandbox && typeof manifest.sandbox === 'object' && !Array.isArray(manifest.sandbox)
        ? manifest.sandbox
        : {};
      const lines = ['sandbox:', `  enabled: ${sandbox.enabled ? 'true' : 'false'}`];
      lines.push(`  profile: ${yamlString(sandbox.profile)}`);
      if (typeof sandbox.request_schema_version === 'string' && sandbox.request_schema_version.trim()) {
        lines.push(`  request_schema_version: ${yamlString(sandbox.request_schema_version.trim())}`);
      }
      if (typeof sandbox.adapter_command === 'string' && sandbox.adapter_command.trim()) {
        lines.push(`  adapter_command: ${yamlString(sandbox.adapter_command.trim())}`);
      }
      if (sandbox.fallback_to_local === true) {
        lines.push('  fallback_to_local: true');
      } else if (sandbox.fallback_to_local === false) {
        lines.push('  fallback_to_local: false');
      }
      return lines.join('\n');
    }

    function yamlString(value) {
      if (value == null) return '""';
      return JSON.stringify(String(value));
    }

    function collectSchemaEditor(kind) {
      const editor = document.querySelector(`[data-schema-editor="${kind}"]`);
      if (!editor) return { type: 'object', additionalProperties: true, properties: {} };
      const properties = {};
      const required = [];
      editor.querySelectorAll('[data-schema-row]').forEach((row) => {
        const name = String(row.querySelector('[data-schema-field-name]')?.value || '').trim();
        if (!name) return;
        const type = String(row.querySelector('[data-schema-field-type]')?.value || 'string').trim() || 'string';
        const definition = { type };
        const description = String(row.querySelector('[data-schema-field-description]')?.value || '').trim();
        const paramKind = String(row.querySelector('[data-schema-field-param-kind]')?.value || '').trim();
        const format = String(row.querySelector('[data-schema-field-format]')?.value || '').trim();
        const enumText = String(row.querySelector('[data-schema-field-enum]')?.value || '').trim();
        const defaultText = String(row.querySelector('[data-schema-field-default]')?.value || '').trim();
        const constText = String(row.querySelector('[data-schema-field-const]')?.value || '').trim();
        if (description) definition.description = description;
        if (paramKind) definition.x_param_kind = paramKind;
        if (format) definition.format = format;
        if (enumText) definition.enum = splitQualityTemplate(enumText).map(schemaLiteralFromText);
        if (defaultText) definition.default = schemaLiteralFromText(defaultText);
        if (constText) definition.const = schemaLiteralFromText(constText);
        if (type === 'array') {
          const itemsType = String(row.querySelector('[data-schema-field-items-type]')?.value || 'string').trim() || 'string';
          definition.items = { type: itemsType };
        }
        properties[name] = definition;
        if (row.querySelector('[data-schema-field-required]')?.checked) required.push(name);
      });
      const schema = {
        type: 'object',
        properties,
        additionalProperties: Boolean(editor.querySelector('[data-schema-additional]')?.checked)
      };
      if (required.length) schema.required = required;
      return schema;
    }

    function schemaFieldPreset(kind, presetKind) {
      const normalized = normalizeSchemaParamKind(presetKind);
      if (!normalized || normalized === 'other') return {};
      const preset = schemaFieldPresetMap[normalized];
      if (!preset) return {};
      return {
        ...preset,
        name: uniqueSchemaFieldName(kind, preset.name || normalized)
      };
    }

    function uniqueSchemaFieldName(kind, baseName) {
      const base = String(baseName || 'field').trim() || 'field';
      const container = document.querySelector(`[data-schema-fields="${kind}"]`);
      if (!container) return base;
      const names = new Set(
        [...container.querySelectorAll('[data-schema-field-name]')]
          .map((input) => String(input.value || '').trim())
          .filter(Boolean)
      );
      if (!names.has(base)) return base;
      let index = 2;
      while (names.has(`${base}_${index}`)) index += 1;
      return `${base}_${index}`;
    }

    function addSchemaFieldRow(kind, presetKind = '') {
      const container = document.querySelector(`[data-schema-fields="${kind}"]`);
      if (!container) return;
      container.querySelector('[data-schema-empty]')?.remove();
      container.insertAdjacentHTML('beforeend', schemaFieldRowHtml(kind, schemaFieldPreset(kind, presetKind)));
      updateSkillManifestPreview();
    }

    function schemaLiteralToText(value) {
      if (value == null) return '';
      if (typeof value === 'string') return value;
      try {
        return JSON.stringify(value);
      } catch (_err) {
        return String(value);
      }
    }

    function schemaLiteralFromText(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      if (/^(true|false|null|-?\d+(\.\d+)?|\[|\{)/.test(text)) {
        try {
          return JSON.parse(text);
        } catch (_err) {
          return text;
        }
      }
      return text;
    }

    function splitQualityTemplate(value) {
      return String(value || '')
        .split(/[\n,，]/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function nullableText(value) {
      const text = String(value || '').trim();
      return text || null;
    }

    function parseJsonField(value, label) {
      try {
        const parsed = JSON.parse(value || '{}');
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
          throw new Error(`${label} 必须是 JSON 对象`);
        }
        return parsed;
      } catch (err) {
        throw new Error(`${label} 解析失败：${err.message}`);
      }
    }

    async function saveSelectedSkill() {
      if (!state.selectedSkillName) return;
      let manifest;
      try {
        manifest = collectSkillForm();
      } catch (err) {
        renderSkillEditor({ type: 'error', text: err.message });
        return;
      }
      renderSkillEditor({ text: '保存中' });
      const res = await fetch(`/api/skills/${encodeURIComponent(state.selectedSkillName)}/manifest-config`, fetchOptions({
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ config: manifest })
      }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderSkillEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      state.selectedSkill = skillDetailPayload(data);
      state.selectedSkillName = data.name || state.selectedSkill.name || state.selectedSkillName;
      if ((state.selectedSkillFileId || 'manifest') === 'manifest') {
        state.selectedSkillFileContent = skillSourceText(state.selectedSkill);
      }
      mergeSkillSummary(data);
      renderSkillList();
      renderSkillSummary();
      renderSkillEditor({ type: 'ok', text: '已保存' });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '已保存' });
    }

    function collectSkillPackageFile() {
      const textarea = document.getElementById('skillPackageFileContent');
      if (!textarea) return null;
      const fileId = state.selectedSkillFileId || selectedPackageFile(state.selectedSkill)?.id || 'manifest';
      if (!fileId) throw new Error('请选择要保存的 Skill 包文件');
      return { fileId, content: textarea.value };
    }

    async function saveSelectedSkillFile() {
      let file;
      try {
        file = collectSkillPackageFile();
      } catch (err) {
        renderSkillEditor({ type: 'error', text: err.message });
        return;
      }
      state.selectedSkillFileContent = file.content;
      renderSkillEditor({ text: '保存文件中' });
      const res = await fetch(`/api/skills/${encodeURIComponent(state.selectedSkillName)}/files/${encodeURIComponent(file.fileId)}`, fetchOptions({
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: file.content })
      }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderSkillEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      if (data.skill) {
        state.selectedSkill = skillDetailPayload(data.skill);
        state.selectedSkillName = data.skill.name || state.selectedSkillName;
        mergeSkillSummary(data.skill);
      }
      state.selectedSkillFile = data.file || state.selectedSkillFile;
      state.selectedSkillFileId = data.file?.id || file.fileId;
      state.selectedSkillFileContent = typeof data.content === 'string' ? data.content : file.content;
      renderSkillList();
      renderSkillSummary();
      renderSkillEditor({ type: 'ok', text: '文件已保存' });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '文件已保存' });
    }

    async function warmSelectedSkillEnvironment() {
      if (!state.selectedSkillName) return;
      renderSkillEditor({ text: '依赖环境预热中' });
      const res = await fetch(`/api/skills/${encodeURIComponent(state.selectedSkillName)}/environment/warm`, fetchOptions({
        method: 'POST'
      }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderSkillEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      const label = data.status === 'base' ? '无 requirements，使用基础镜像' : `依赖环境 ${data.status || 'ready'}`;
      renderSkillEditor({ type: data.status === 'failed' ? 'error' : 'ok', text: label });
    }

    function formatSelectedSkillFile() {
      const textarea = document.getElementById('skillPackageFileContent');
      if (!textarea) return;
      const packageFile = selectedPackageFile(state.selectedSkill);
      if (packageFile?.language !== 'json') return;
      try {
        const parsed = parseJsonField(textarea.value, packageFile.label || 'JSON 文件');
        textarea.value = `${JSON.stringify(parsed, null, 2)}\n`;
        state.selectedSkillFileContent = textarea.value;
        const status = document.getElementById('skillEditStatus');
        if (status) {
          status.className = 'skill-status ok';
          status.textContent = 'JSON 已格式化';
        }
      } catch (err) {
        state.selectedSkillFileContent = textarea.value;
        renderSkillEditor({ type: 'error', text: err.message });
      }
    }

    function setView(view) {
      state.view = ['chat', 'apps', 'skills', 'tools', 'workflows', 'cron'].includes(view) ? view : 'chat';
      const isChat = state.view === 'chat';
      const isApps = state.view === 'apps';
      const isSkills = state.view === 'skills';
      const isTools = state.view === 'tools';
      const isWorkflows = state.view === 'workflows';
      const isCron = state.view === 'cron';
      els.centerPane.classList.toggle('skills-mode', !isChat);
      els.intro.hidden = !isChat;
      els.skillStrip.hidden = !isChat;
      els.chatFrame.hidden = !isChat;
      els.composerWrap.hidden = !isChat;
      els.appCenter.hidden = !isApps;
      els.skillManager.hidden = !isSkills;
      els.toolsManager.hidden = !isTools;
      els.workflowManager.hidden = !isWorkflows;
      els.cronManager.hidden = !isCron;
      document.querySelectorAll('[data-view]').forEach((item) => {
        item.classList.toggle('active', item.dataset.view === state.view);
      });
      if (isApps) {
        selectInspectorTab('abilities');
        loadAppTemplates().catch((err) => {
          if (els.appTemplateList) els.appTemplateList.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
          renderAppTemplateSummary(err.message);
        });
      } else if (isSkills) {
        state.abilityMode = 'skills';
        selectInspectorTab('abilities');
        loadAbilities().catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
          els.panel.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        });
      } else if (isTools) {
        state.abilityMode = 'mcp';
        selectInspectorTab('abilities');
        loadAbilities().catch((err) => {
          renderToolEditor({ type: 'error', text: err.message });
          els.panel.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        });
      } else if (isWorkflows) {
        state.abilityMode = 'workflows';
        selectInspectorTab('abilities');
        loadWorkflows().catch((err) => {
          renderWorkflowEditor({ type: 'error', text: err.message });
          els.panel.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        });
      } else if (isCron) {
        selectInspectorTab('timeline');
        loadCronJobs().catch((err) => {
          renderCronEditor({ type: 'error', text: err.message });
        });
      }
    }

    async function loadAbilities() {
      await Promise.all([
        state.skillsLoaded ? Promise.resolve() : loadSkills({ showLoading: false }),
        state.mcpToolsLoaded ? Promise.resolve() : loadMcpTools({ showLoading: false }),
        state.workflowsLoaded ? Promise.resolve() : loadWorkflows()
      ]);
      if (state.activeTab === 'abilities') renderAbilityPanel();
    }


    async function loadCronJobs() {
      const res = await fetch('/api/cron/jobs', { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      state.cronJobs = data.jobs || [];
      state.cronLoaded = true;
      if (!state.selectedCronJobName && state.cronJobs.length) {
        state.selectedCronJobName = state.cronJobs[0].name;
      }
      if (state.selectedCronJobName) {
        state.selectedCronJob = state.cronJobs.find((job) => job.name === state.selectedCronJobName) || null;
      }
      if (state.selectedCronJobName && state.selectedCronJob) {
        await Promise.all([
          loadCronRuns(state.selectedCronJobName),
          previewSelectedCronJob()
        ]);
      } else {
        state.selectedCronRuns = [];
        state.cronPreviewRuns = [];
      }
      renderCronList();
      renderCronSummary();
      renderCronEditor();
    }

    async function loadCronRuns(jobName) {
      if (!jobName) {
        state.selectedCronRuns = [];
        return;
      }
      const res = await fetch(`/api/cron/jobs/${encodeURIComponent(jobName)}/runs?limit=20`, { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      state.selectedCronRuns = data.runs || [];
    }

    async function previewSelectedCronJob() {
      const job = state.selectedCronJob || state.cronJobs.find((item) => item.name === state.selectedCronJobName);
      if (!job?.schedule) {
        state.cronPreviewRuns = [];
        return;
      }
      const res = await fetch('/api/cron/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ schedule: job.schedule, timezone: job.timezone || 'Asia/Shanghai', count: 5 })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        state.cronPreviewRuns = [];
        throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      }
      state.cronPreviewRuns = data.runs || [];
    }

    function renderCronSummary() {
      if (!els.cronSummary) return;
      const enabledCount = state.cronJobs.filter((job) => job.enabled).length;
      const failedCount = state.cronJobs.filter((job) => job.last_status === 'failed').length;
      els.cronSummary.textContent = `${state.cronJobs.length} 个计划任务 · ${enabledCount} 个启用 · ${failedCount} 个失败`;
    }

    function renderCronList() {
      if (!els.cronList) return;
      const jobs = filteredCronJobs();
      if (!jobs.length) {
        els.cronList.innerHTML = '<div class="empty-panel">暂无匹配 Cron 任务</div>';
        return;
      }
      els.cronList.innerHTML = jobs.map((job) => `
        <button class="skill-row ${job.name === state.selectedCronJobName ? 'active' : ''}" type="button" data-cron-select="${escapeAttr(job.name)}">
          <div class="skill-row-main">
            <strong>${escapeHtml(job.name)}</strong>
            <span class="skill-badge ${job.enabled ? '' : 'local'}">${job.enabled ? 'enabled' : 'disabled'}</span>
          </div>
          <p>${escapeHtml(job.title || job.prompt || '')}</p>
          <div class="skill-badges">
            <span class="skill-badge sandbox">${escapeHtml(job.schedule || '')}</span>
            <span class="skill-badge">${escapeHtml(job.timezone || 'UTC')}</span>
            <span class="skill-badge ${job.last_status === 'failed' ? 'local' : ''}">${escapeHtml(job.last_status || 'idle')}</span>
          </div>
        </button>
      `).join('');
    }

    function filteredCronJobs() {
      const jobs = [...state.cronJobs];
      if (state.selectedCronJob && !jobs.some((job) => job.name === state.selectedCronJob.name)) {
        jobs.push(state.selectedCronJob);
      }
      const sorted = jobs.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      if (state.cronFilter === 'enabled') return sorted.filter((job) => job.enabled);
      if (state.cronFilter === 'disabled') return sorted.filter((job) => !job.enabled);
      if (state.cronFilter === 'failed') return sorted.filter((job) => job.last_status === 'failed');
      return sorted;
    }
