<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JetLinks Agent Runtime v2</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --sidebar-bg: #111317;
      --sidebar-soft: #181b20;
      --sidebar-text: #d6d9de;
      --sidebar-muted: #7d8490;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-warm: #f7f9fb;
      --line: #dfe3ea;
      --line-strong: #b8c0cc;
      --text: #181b1f;
      --muted: #68717c;
      --muted-2: #9299a3;
      --accent: #155bd4;
      --accent-strong: #0f49ad;
      --accent-soft: #edf3ff;
      --green: #13795b;
      --green-soft: #e8f7f1;
      --orange: #ad6516;
      --orange-soft: #fff5e6;
      --red: #b42318;
      --red-soft: #fff0ee;
      --black: #111317;
      --code: #0f172a;
      --sidebar-w: 252px;
      --topbar-h: 56px;
      --radius: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 999px;
      --shadow-soft: 0 16px 44px rgba(24, 27, 31, 0.08);
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--text);
      background: var(--bg);
      font-family: var(--sans);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input, select { font: inherit; }
    button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }
    [hidden] { display: none !important; }

    .app {
      min-height: 100svh;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    }

    .sidebar {
      min-height: 100svh;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: 16px;
      padding: 18px 14px 14px;
      border-right: 1px solid rgba(255, 255, 255, .07);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px 4px;
    }

    .brand-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #2563eb, #13a38b);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .brand-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .brand-title strong {
      color: #f4f5f5;
      font-size: 14px;
      line-height: 1.15;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-title span {
      color: var(--sidebar-muted);
      font-size: 11px;
      line-height: 1.1;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .06);
      color: #aeb4bd;
      transition: background 120ms, color 120ms;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, .1);
      color: #fff;
    }

    .icon-btn svg,
    .new-task svg,
    .nav svg,
    .tool-pill svg,
    .send svg,
    .small-action svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .new-task {
      min-height: 40px;
      border-radius: var(--radius-lg);
      background: #f3f4f6;
      color: #111317;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      transition: transform 120ms, background 120ms;
    }

    .new-task:hover {
      transform: translateY(-1px);
      background: #fff;
    }

    .nav {
      display: grid;
      gap: 2px;
    }

    .nav button {
      width: 100%;
      min-height: 38px;
      border-radius: var(--radius);
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--sidebar-text);
      text-align: left;
      transition: background 120ms, color 120ms;
    }

    .nav button.active,
    .nav button:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    .nav-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 640;
    }

    .nav-badge {
      margin-left: auto;
      border-radius: var(--radius-full);
      padding: 2px 7px;
      background: rgba(24, 104, 219, .24);
      color: #9fc1ff;
      font-size: 10px;
      font-weight: 760;
      white-space: nowrap;
    }

    .side-section {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
    }

    .side-title {
      padding: 0 6px;
      color: var(--sidebar-muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .side-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 4px;
      padding-right: 2px;
    }

    .agent-item {
      width: 100%;
      min-height: 52px;
      border-radius: var(--radius-lg);
      padding: 9px 10px;
      display: grid;
      gap: 4px;
      text-align: left;
      border: 1px solid transparent;
      color: #e2e5e8;
      transition: background 120ms, border-color 120ms;
    }

    .agent-item:hover,
    .agent-item.active {
      background: rgba(255, 255, 255, .065);
      border-color: rgba(255, 255, 255, .08);
    }

    .agent-item strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .agent-item span {
      color: var(--sidebar-muted);
      font-size: 11px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-foot {
      display: grid;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, .07);
      color: var(--sidebar-muted);
      font-size: 11px;
    }

    .thread-mini {
      min-width: 0;
      border-radius: var(--radius);
      padding: 8px;
      background: rgba(255, 255, 255, .045);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main {
      min-width: 0;
      min-height: 100svh;
      display: grid;
      grid-template-rows: var(--topbar-h) minmax(0, 1fr);
    }

    .topbar {
      min-width: 0;
      height: var(--topbar-h);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(246, 247, 249, .9);
      backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left,
    .topbar-right {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-left {
      color: var(--muted);
      font-size: 13px;
      font-weight: 640;
      flex-wrap: wrap;
    }

    .topbar-right {
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .topbar select,
    .topbar input {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      padding: 0 10px;
      outline: none;
    }

    .topbar input {
      width: 190px;
      min-width: 140px;
    }

    .sandbox-pill {
      min-height: 28px;
      max-width: 280px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: #3d454d;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
      transition: background 120ms, border-color 120ms, color 120ms;
    }

    .sandbox-pill:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .sandbox-pill .sandbox-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sandbox-pill.pending .status-dot {
      background: var(--muted-2);
      box-shadow: 0 0 0 3px rgba(104, 113, 124, .12);
    }

    .sandbox-pill.available .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(19, 121, 91, .12);
    }

    .sandbox-pill.unavailable .status-dot {
      background: var(--orange);
      box-shadow: 0 0 0 3px rgba(173, 101, 22, .14);
    }

    .sandbox-pill.error .status-dot {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(180, 35, 24, .12);
    }

    .ghost-btn,
    .secondary-btn {
      height: 34px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: #3d454d;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 650;
      transition: background 120ms, border-color 120ms, color 120ms;
      white-space: nowrap;
    }

    .ghost-btn:hover,
    .secondary-btn:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .workbench {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) minmax(340px, 390px);
      gap: 0;
    }

    .workbench.manager-mode {
      grid-template-columns: minmax(0, 1fr);
    }

    .center {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      padding: 22px 28px 18px;
      overflow: hidden;
    }

    .intro {
      max-width: 920px;
      width: 100%;
      margin: 0 auto 12px;
      display: grid;
      gap: 14px;
    }

    .intro-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .intro-title {
      min-width: 0;
      display: grid;
      gap: 8px;
    }

    .intro-title h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.08;
      font-weight: 780;
      letter-spacing: 0;
    }

    .intro-title p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      max-width: 640px;
    }

    .status-pill {
      min-height: 32px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(19, 121, 91, .12);
    }

    .module-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .module-tabs button {
      min-height: 34px;
      padding: 0 14px;
      border-radius: var(--radius-full);
      color: var(--muted);
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 660;
      transition: background 120ms, color 120ms, border-color 120ms, box-shadow 120ms;
    }

    .module-tabs button.active,
    .module-tabs button:hover {
      background: var(--surface);
      color: var(--text);
      border-color: var(--line);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
    }

    .skill-strip {
      max-width: 920px;
      width: 100%;
      margin: 0 auto 12px;
      display: grid;
      gap: 10px;
    }

    .mode-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .tool-pill {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      background: var(--surface);
      color: #3d454d;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 650;
      transition: background 120ms, border-color 120ms, color 120ms;
    }

    .tool-pill.active {
      border-color: rgba(24, 104, 219, .28);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .quick-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .quick-row button {
      min-height: 32px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: #3f464e;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 650;
      transition: background 120ms, border-color 120ms;
      white-space: nowrap;
    }

    .quick-row button:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .module-tabs,
    .skill-strip {
      display: none;
    }

    .chat-frame {
      min-height: 0;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
      border-top: 1px solid var(--line);
    }

    .messages {
      min-height: 0;
      overflow: auto;
      padding: 18px 2px 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 14px;
      padding: 10px 0;
      line-height: 1.58;
      animation: messageIn 150ms ease-out;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .role {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding-top: 3px;
      white-space: nowrap;
    }

    .bubble {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      background: transparent;
    }

    .message.user .bubble {
      color: #111317;
      background: #eef4ff;
      border-color: rgba(21, 91, 212, .16);
      font-weight: 560;
    }

    .message.assistant .bubble {
      background: var(--surface);
      border-color: var(--line);
    }

    .message.assistant .bubble.streaming::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 16px;
      margin-left: 3px;
      border-radius: 2px;
      background: var(--accent);
      vertical-align: -3px;
      animation: cursorBlink 900ms steps(2, start) infinite;
    }

    @keyframes cursorBlink {
      50% { opacity: 0; }
    }

    .markdown-body {
      white-space: normal;
    }

    .markdown-body.streaming-text {
      white-space: pre-wrap;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body p {
      margin: 0 0 10px;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      margin: 14px 0 8px;
      line-height: 1.25;
      color: #111317;
      font-weight: 760;
    }

    .markdown-body h1 { font-size: 22px; }
    .markdown-body h2 { font-size: 18px; }
    .markdown-body h3 { font-size: 16px; }
    .markdown-body h4 { font-size: 14px; }

    .markdown-body ul,
    .markdown-body ol {
      margin: 6px 0 12px;
      padding-left: 22px;
    }

    .markdown-body li {
      margin: 4px 0;
    }

    .markdown-body strong {
      font-weight: 760;
      color: #111317;
    }

    .markdown-body code {
      border: 1px solid rgba(15, 23, 42, .08);
      border-radius: 5px;
      background: #f3f6fb;
      color: #0f172a;
      padding: 1px 5px;
      font-family: var(--mono);
      font-size: .92em;
    }

    .markdown-body pre {
      margin: 10px 0 12px;
      padding: 12px;
      overflow: auto;
      border-radius: var(--radius);
      background: #0f172a;
      color: #e5e7eb;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .markdown-body pre code {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      font-size: inherit;
    }

    .markdown-body blockquote {
      margin: 8px 0 12px;
      padding: 8px 12px;
      border-left: 3px solid var(--accent);
      background: #f4f7fc;
      color: #47515e;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 12px;
      font-size: 13px;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--line);
      padding: 7px 9px;
      text-align: left;
      vertical-align: top;
    }

    .markdown-body th {
      background: var(--surface-soft);
      font-weight: 720;
    }

    .message.user .markdown-body {
      white-space: pre-wrap;
    }

    .composer-wrap {
      position: relative;
      z-index: 30;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding-top: 12px;
    }

    .composer {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      overflow: visible;
      transition: box-shadow 160ms, border-color 160ms;
    }

    .composer:focus-within {
      border-color: rgba(24, 104, 219, .28);
      box-shadow: 0 18px 56px rgba(24, 27, 31, .11);
    }

    .composer-capability-tray {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 14px 0;
    }

    .composer-capability-tray.active {
      display: flex;
    }

    .capability-chip {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      background: var(--surface-soft);
      color: #303842;
      padding: 4px 8px 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 720;
      max-width: 100%;
    }

    .capability-chip span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .capability-chip.skill {
      background: var(--accent-soft);
      border-color: rgba(21, 91, 212, .18);
      color: var(--accent);
    }

    .capability-chip.mcp {
      background: var(--green-soft);
      border-color: rgba(19, 121, 91, .16);
      color: var(--green);
    }

    .capability-chip button {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: inherit;
      font-size: 15px;
      line-height: 1;
    }

    .capability-picker {
      position: fixed;
      inset: 0;
      z-index: 120;
      padding: 0 24px max(24px, env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, .18);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .capability-picker-panel {
      width: min(920px, calc(100vw - 48px));
      max-height: min(520px, 72vh);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, .98);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .capability-picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .capability-picker-title {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .capability-picker-title strong {
      color: var(--text);
      font-size: 14px;
      font-weight: 780;
    }

    .capability-picker-title span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .capability-picker-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      padding: 8px;
      gap: 6px;
    }

    .capability-choice {
      width: 100%;
      min-height: 54px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      text-align: left;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 9px 10px;
      background: transparent;
      transition: background 120ms, border-color 120ms;
    }

    .capability-choice:hover,
    .capability-choice.active {
      background: var(--surface-soft);
      border-color: var(--line);
    }

    .capability-choice-main {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .capability-choice-main strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .capability-choice-main span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .capability-choice-state {
      min-width: 58px;
      min-height: 28px;
      border-radius: var(--radius-full);
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .capability-choice.active .capability-choice-state {
      background: var(--black);
      border-color: var(--black);
      color: #fff;
    }

    .capability-picker-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .composer textarea {
      width: 100%;
      min-height: 96px;
      max-height: 220px;
      border: 0;
      resize: vertical;
      outline: none;
      padding: 16px 18px 8px;
      color: var(--text);
      background: transparent;
      font-size: 15px;
      line-height: 1.58;
    }

    .composer-bar {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px 12px;
      border-top: 1px solid rgba(17, 19, 23, .06);
    }

    .composer-tools,
    .composer-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-action {
      min-height: 32px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: #3d454d;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 650;
      transition: background 120ms, border-color 120ms;
    }

    .small-action:hover {
      background: #fff;
      border-color: var(--line-strong);
    }

    .send {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--black);
      color: #fff;
      display: grid;
      place-items: center;
      transition: transform 120ms, background 120ms;
    }

    .send:hover {
      transform: translateY(-1px);
      background: #000;
    }

    .send.running {
      width: auto;
      min-width: 78px;
      padding: 0 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
    }

    .attachments {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .attachment {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      padding: 5px 9px;
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .route-hint {
      min-height: 28px;
      border-radius: var(--radius-full);
      padding: 5px 9px;
      background: var(--accent-soft);
      color: var(--accent);
      display: none;
      align-items: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 680;
    }

    .route-hint.active {
      display: inline-flex;
    }

    .inspector {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      background: var(--surface-warm);
      border-left: 1px solid var(--line);
      overflow: hidden;
    }

    .workbench.manager-mode .inspector {
      display: none;
    }

    .inspector-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .inspector-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .inspector-title strong {
      font-size: 14px;
      font-weight: 760;
    }

    .inspector-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .tab {
      height: 30px;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      color: var(--muted);
      padding: 0 11px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 120ms, border-color 120ms, color 120ms;
    }

    .tab.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(24, 104, 219, .22);
    }

    .inspector-body {
      min-height: 0;
      overflow: auto;
      padding: 16px;
    }

    .timeline {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .timeline-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .timeline-list {
      display: grid;
      gap: 0;
    }

    .step {
      position: relative;
      padding: 0 0 12px 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .step::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .step::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 14px;
      bottom: 0;
      width: 1px;
      background: var(--line);
    }

    .step:last-child {
      padding-bottom: 0;
    }

    .step:last-child::after {
      display: none;
    }

    .step-name {
      color: var(--text);
      font-weight: 720;
      margin-bottom: 3px;
    }

    .panel-section {
      display: grid;
      gap: 10px;
    }

    .artifact {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .artifact:first-child {
      padding-top: 0;
    }

    .artifact:last-child {
      border-bottom: 0;
    }

    .artifact-name {
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .artifact-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .artifact-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .artifact-actions button,
    .preview-action {
      min-height: 30px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: #3d454d;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 680;
      transition: background 120ms, border-color 120ms;
    }

    .artifact-actions button:hover,
    .preview-action:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .preview {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #f8fafc;
    }

    .preview .markdown-body {
      padding: 12px;
      background: #fff;
    }

    .preview.image-preview {
      padding: 8px;
      background: #fff;
    }

    .preview img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: var(--radius);
      background: #f8fafc;
    }

    .preview pre,
    .spec pre {
      margin: 0;
      padding: 12px;
      max-height: 320px;
      overflow: auto;
      color: var(--code);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .spec pre {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: #f8fafc;
    }

    .verify {
      margin-bottom: 14px;
      padding: 12px;
      border-radius: var(--radius-lg);
      background: var(--green-soft);
      border: 1px solid rgba(19, 121, 91, .14);
    }

    .verify.failed {
      background: var(--red-soft);
      border-color: rgba(180, 35, 24, .16);
    }

    .verify.running {
      background: var(--orange-soft);
      border-color: rgba(173, 101, 22, .18);
    }

    .status {
      font-weight: 760;
      color: var(--green);
    }

    .status.failed { color: var(--red); }
    .status.running { color: var(--orange); }

    .check-list {
      display: grid;
      gap: 8px;
    }

    .check {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .check strong {
      color: var(--text);
      font-weight: 720;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .empty-panel {
      min-height: 220px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, .46);
      line-height: 1.6;
    }

    .center.skills-mode {
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }

    .skill-manager {
      min-height: 0;
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
      overflow: hidden;
    }

    .skill-manager-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 2px 2px 14px;
      border-bottom: 1px solid var(--line);
    }

    .skill-manager-head > div:first-child {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .skill-manager-head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: 0;
    }

    .skill-manager-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .manager-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      flex: 0 0 auto;
    }

    .skill-manager-body {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(340px, 410px) minmax(0, 1fr);
      gap: 16px;
      overflow: hidden;
    }

    .skill-list-pane,
    .skill-editor-pane {
      min-height: 0;
      background: rgba(255, 255, 255, .82);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .skill-list-pane {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      box-shadow: 0 10px 28px rgba(24, 27, 31, .04);
    }

    .skill-filter-row {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      background: rgba(248, 250, 252, .88);
    }

    .skill-filter-row button {
      min-height: 28px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      color: var(--muted);
      padding: 0 9px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .skill-filter-row button.active,
    .skill-filter-row button:hover {
      background: var(--surface);
      border-color: var(--line);
      color: var(--text);
    }

    .skill-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      padding: 8px;
      gap: 8px;
    }

    .tool-note {
      margin: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(24, 104, 219, .16);
      border-radius: var(--radius);
      background: rgba(239, 246, 255, .72);
      color: #38516f;
      font-size: 12px;
      line-height: 1.55;
    }

    .tool-note strong {
      display: block;
      margin-bottom: 3px;
      color: #14233a;
      font-size: 13px;
      font-weight: 760;
    }

    .skill-group {
      display: grid;
      gap: 6px;
    }

    .skill-group-title {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 7px 8px 5px;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .skill-row {
      width: 100%;
      display: grid;
      gap: 8px;
      padding: 12px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      transition: background 140ms, border-color 140ms, transform 140ms, box-shadow 140ms;
    }

    .skill-row:hover {
      background: #fff;
      border-color: var(--line);
      box-shadow: 0 8px 20px rgba(24, 27, 31, .04);
    }

    .skill-row.active {
      background: #fff;
      border-color: rgba(21, 91, 212, .3);
      box-shadow: inset 3px 0 0 var(--accent), 0 8px 24px rgba(21, 91, 212, .07);
    }

    .skill-row-main {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .skill-row strong {
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-row p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.48;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .skill-file-line {
      color: #7c8794;
      font-size: 11px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .skill-badge {
      min-height: 22px;
      border-radius: var(--radius-full);
      padding: 3px 7px;
      background: var(--surface-soft);
      border: 1px solid rgba(223, 227, 234, .86);
      color: var(--muted);
      font-size: 10px;
      font-weight: 760;
      white-space: nowrap;
    }

    .skill-badge.kind {
      background: #111317;
      border-color: #111317;
      color: #fff;
    }

    .skill-badge.sandbox {
      background: var(--accent-soft);
      border-color: rgba(21, 91, 212, .18);
      color: var(--accent);
    }

    .skill-badge.local {
      background: var(--green-soft);
      border-color: rgba(19, 121, 91, .15);
      color: var(--green);
    }

    .skill-editor-pane {
      min-width: 0;
      overflow: auto;
      background: var(--surface);
      box-shadow: 0 10px 28px rgba(24, 27, 31, .04);
    }

    .skill-editor {
      min-width: 0;
      display: grid;
      gap: 18px;
      padding: 18px;
    }

    .skill-editor-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 2px 2px 16px;
      border-bottom: 1px solid var(--line);
    }

    .skill-editor-title {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .skill-editor-title strong {
      font-size: 18px;
      line-height: 1.2;
      font-weight: 780;
      overflow-wrap: anywhere;
    }

    .skill-editor-title span {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .skill-editor-title-main {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .skill-avatar {
      width: 38px;
      height: 38px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      background: #111317;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .skill-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .skill-status {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      min-height: 20px;
    }

    .skill-status.ok { color: var(--green); }
    .skill-status.error { color: var(--red); }

    .skill-form {
      display: grid;
      gap: 16px;
    }

    .skill-form-section {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(248, 250, 252, .56);
    }

    .skill-form-section-title {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .file-editor {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(248, 250, 252, .94), rgba(255, 255, 255, .98));
    }

    .file-editor-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .file-editor-title {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .file-editor-title strong {
      font-size: 14px;
      font-weight: 780;
      color: var(--text);
    }

    .file-editor-title span,
    .file-edit-meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .package-file-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #eef2f7;
    }

    .package-file-tabs button {
      min-height: 28px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .package-file-tabs button.active,
    .package-file-tabs button:hover {
      color: var(--text);
      border-color: rgba(184, 192, 204, .58);
      background: #fff;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .field label,
    .check-field {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      padding: 9px 10px;
      outline: none;
      font-size: 13px;
      line-height: 1.45;
    }

    .field textarea {
      min-height: 94px;
      resize: vertical;
    }

    .field textarea.code {
      min-height: 210px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      color: #162033;
      background: #f8fafc;
    }

    .field textarea.file-code {
      min-height: 330px;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: rgba(21, 91, 212, .42);
      background: #fff;
    }

    .check-field {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .check-field input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .skill-form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 2px;
    }

    .primary-btn {
      height: 34px;
      border-radius: var(--radius-full);
      background: var(--black);
      color: #fff;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 720;
      transition: background 120ms, transform 120ms;
      white-space: nowrap;
    }

    .primary-btn:hover {
      background: #000;
      transform: translateY(-1px);
    }

    .ability-panel {
      display: grid;
      gap: 14px;
    }

    .ability-head {
      display: grid;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .ability-mode {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .ability-mode button {
      min-height: 30px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .ability-mode button.active,
    .ability-mode button:hover {
      background: var(--accent-soft);
      border-color: rgba(21, 91, 212, .22);
      color: var(--accent);
    }

    .ability-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ability-list {
      display: grid;
      gap: 6px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .ability-item {
      width: 100%;
      display: grid;
      gap: 5px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .72);
      padding: 9px 10px;
    }

    .ability-item.active,
    .ability-item:hover {
      background: #fff;
      border-color: var(--line-strong);
    }

    .ability-item strong {
      font-size: 12px;
      font-weight: 780;
      overflow-wrap: anywhere;
    }

    .ability-item span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .ability-editor {
      display: grid;
      gap: 12px;
      padding-top: 2px;
    }

    .ability-editor .field-grid {
      grid-template-columns: 1fr;
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 78px minmax(0, 1fr);
      }
      .sidebar {
        padding-inline: 10px;
      }
      .brand-title,
      .nav-label,
      .nav-badge,
      .new-task span,
      .side-section,
      .side-foot {
        display: none;
      }
      .brand,
      .brand-main,
      .new-task,
      .nav button {
        justify-content: center;
      }
      .new-task {
        padding: 0;
      }
    }

    @media (max-width: 980px) {
      .workbench {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(620px, 1fr) minmax(420px, 48svh);
      }
      .workbench.manager-mode {
        grid-template-rows: minmax(0, 1fr);
      }
      .inspector {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .center {
        overflow: visible;
      }
      .main {
        min-height: auto;
      }
      .skill-manager-body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(230px, 34svh) minmax(520px, 1fr);
      }
      .workbench.manager-mode .center {
        overflow: hidden;
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        min-height: auto;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: auto;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }
      .brand-title,
      .new-task span {
        display: grid;
      }
      .nav,
      .side-section,
      .side-foot {
        display: none;
      }
      .new-task {
        min-height: 36px;
        padding: 0 12px;
      }
      .topbar {
        height: auto;
        min-height: var(--topbar-h);
        align-items: stretch;
        flex-direction: column;
        padding: 10px 12px;
      }
      .main {
        grid-template-rows: auto minmax(0, 1fr);
      }
      .topbar-left,
      .topbar-right {
        width: 100%;
      }
      .topbar-right select,
      .topbar-right input {
        flex: 1 1 calc(50% - 6px);
        min-width: 0;
      }
      .topbar-right input {
        flex-basis: 100%;
        width: 100%;
      }
      .topbar-right .ghost-btn {
        flex: 0 0 auto;
      }
      .center {
        padding: 18px 14px 16px;
      }
      .intro-head {
        display: grid;
      }
      .intro-title h1 {
        font-size: 28px;
      }
      .message {
        grid-template-columns: 54px minmax(0, 1fr);
      }
      .composer-bar {
        align-items: stretch;
        flex-direction: column;
      }
      .composer-actions {
        justify-content: space-between;
      }
      .capability-picker {
        padding: 0 12px max(12px, env(safe-area-inset-bottom));
      }
      .capability-picker-panel {
        width: calc(100vw - 24px);
        max-height: 76vh;
      }
      .skill-manager-head,
      .skill-editor-head,
      .file-editor-head {
        display: grid;
      }
      .skill-editor-title {
        display: grid;
      }
      .skill-avatar {
        width: 34px;
        height: 34px;
      }
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    const BASE_PATH = (() => {
      const marker = '/chat';
      const path = window.location.pathname || '/';
      return path === marker || path.startsWith(`${marker}/`) ? marker : '';
    })();

    function prefixedPath(path) {
      const normalized = path.startsWith('/') ? path : `/${path}`;
      return `${BASE_PATH}${normalized}`;
    }

    function apiUrl(path) {
      return prefixedPath(path);
    }

    function websocketUrl(path) {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${protocol}//${window.location.host}${prefixedPath(path)}`;
    }

    function artifactUrl(url) {
      if (!url || url === '#') return url || '#';
      if (/^(?:[a-z][a-z0-9+.-]*:)?\/\//i.test(url) || url.startsWith('data:') || url.startsWith('blob:')) {
        return url;
      }
      return BASE_PATH && url.startsWith('/') && !url.startsWith(`${BASE_PATH}/`) ? `${BASE_PATH}${url}` : url;
    }

    const skillCatalog = [
      { name: 'drawio-generation', agent: 'artifact-generator', detail: '节点、连线、泳道、分层' },

      { name: 'behavior-detection', agent: 'behavior-detector', detail: '文本判断 + 视觉证据确认' }
    ];

    const agentHints = {

      default: '通用对话'
    };

    const state = {

      timeline: [],

      workflowFilter: 'all',

      nextAgentOverride: null,
      nextWorkflowOverride: null,
      finalResultApplied: false,
      messageSeq: 0,
      messageUpdateFrame: 0,
      pendingMessageIndexes: new Set()
    };

    const els = {
      agent: document.getElementById('agent'),
      transport: document.getElementById('transport'),
      agentList: document.getElementById('agentList'),
      activeAgentLabel: document.getElementById('activeAgentLabel'),
      sandboxStatus: document.getElementById('sandboxStatus'),
      thread: document.getElementById('thread'),
      threadMini: document.getElementById('threadMini'),

      messages: document.getElementById('messages'),
      input: document.getElementById('input'),
      capabilityTray: document.getElementById('capabilityTray'),
      capabilityPicker: document.getElementById('capabilityPicker'),
      send: document.getElementById('send'),
      attach: document.getElementById('attach'),
      fileInput: document.getElementById('fileInput'),
      skillPluginInput: document.getElementById('skillPluginInput'),

      skillStrip: document.getElementById('skillStrip'),
      chatFrame: document.getElementById('chatFrame'),
      composerWrap: document.getElementById('composerWrap'),
      skillManager: document.getElementById('skillManager'),
      skillSummary: document.getElementById('skillSummary'),
      refreshSkills: document.getElementById('refreshSkills'),
      skillList: document.getElementById('skillList'),
      skillEditor: document.getElementById('skillEditor'),
      toolsManager: document.getElementById('toolsManager'),
      toolSummary: document.getElementById('toolSummary'),
      refreshTools: document.getElementById('refreshTools'),
      toolList: document.getElementById('toolList'),
      toolEditor: document.getElementById('toolEditor'),
      workflowManager: document.getElementById('workflowManager'),
      workflowSummary: document.getElementById('workflowSummary'),
      refreshWorkflows: document.getElementById('refreshWorkflows'),
      workflowList: document.getElementById('workflowList'),
      workflowEditor: document.getElementById('workflowEditor')
    };

    function ensureThread() {
      if (!els.thread.value.trim()) {
        els.thread.value = `local-${Date.now().toString(36)}`;
      }
      els.threadMini.textContent = els.thread.value.trim();
      return els.thread.value.trim();
    }

    function addMessage(role, content, options = {}) {
      state.messages.push({
        id: `msg-${++state.messageSeq}`,
        role,
        content,
        streaming: Boolean(options.streaming),
        progress: Boolean(options.progress)
      });
      renderMessages();
      return state.messages.length - 1;
    }

    function beginAssistantMessage() {
      if (state.activeAssistantIndex !== null && state.messages[state.activeAssistantIndex]) {
        return state.messages[state.activeAssistantIndex];
      }
      state.activeAssistantIndex = addMessage('assistant', '', { streaming: true });
      return state.messages[state.activeAssistantIndex];
    }

    function appendAssistantDelta(text) {
      if (!text) return;
      const message = beginAssistantMessage();
      if (message.progress) {
        message.content = '';
        message.progress = false;
      }
      message.content += text;
      scheduleMessageUpdate(state.activeAssistantIndex);
    }

    function setAssistantProgress(text) {
      if (!text) return;
      const message = beginAssistantMessage();
      if (message.content && !message.progress) return;
      message.content = text;
      message.progress = true;
      scheduleMessageUpdate(state.activeAssistantIndex);
    }

    function finishAssistantMessage(content) {
      if (state.activeAssistantIndex !== null && state.messages[state.activeAssistantIndex]) {
        const index = state.activeAssistantIndex;
        const message = state.messages[state.activeAssistantIndex];
        if (typeof content === 'string' && content) {
          message.content = content;
          message.progress = false;
        }
        else if (!message.content) message.content = '已完成，但没有返回文本内容。';
        message.streaming = false;
        state.activeAssistantIndex = null;
        scheduleMessageUpdate(index);
        return;
      }
      if (typeof content === 'string' && content) {
        addMessage('assistant', content);
      }
    }

    function addTimeline(name, detail) {
      state.timeline.push({ name, detail });
      renderPanel();
    }

    function renderMessages() {
      if (!state.messages.length) {
        els.messages.innerHTML = `
          <div class="message assistant">
            <div class="role">Agent</div>
            <div class="bubble">选择 Agent 后输入任务。生成类任务会在右侧形成文件预览，行为识别会先判断是否存在图片、视频或结构化证据。</div>
          </div>
        `;
        return;
      }
      els.messages.innerHTML = state.messages.map((message) => `
        <div id="${messageDomId(message)}" class="message ${escapeHtml(message.role)}">
          <div class="role">${escapeHtml(roleLabel(message.role))}</div>
          <div class="bubble ${message.streaming ? 'streaming' : ''}">
            ${renderMessageContent(message)}
          </div>
        </div>
      `).join('');
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function scheduleMessageUpdate(index) {
      if (index === null || index === undefined) return;
      state.pendingMessageIndexes.add(index);
      if (state.messageUpdateFrame) return;
      state.messageUpdateFrame = requestAnimationFrame(() => {
        const indexes = [...state.pendingMessageIndexes];
        state.pendingMessageIndexes.clear();
        state.messageUpdateFrame = 0;
        indexes.forEach(updateMessageNode);
      });
    }

    function updateMessageNode(index) {
      const message = state.messages[index];
      if (!message) return;
      const node = document.getElementById(messageDomId(message));
      if (!node) {
        renderMessages();
        return;
      }
      const bubble = node.querySelector('.bubble');
      if (!bubble) {
        renderMessages();
        return;
      }
      node.className = `message ${message.role}`;
      bubble.className = `bubble ${message.streaming ? 'streaming' : ''}`;
      bubble.innerHTML = renderMessageContent(message);
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function messageDomId(message) {
      return `chat-${message.id}`;
    }

    function renderTimelineBlock() {
      if (!state.timeline.length) {
        return '<div class="empty">等待任务</div>';
      }
      return `
        <div class="timeline-list">
          ${state.timeline.map((step) => `
            <div class="step">
              <div class="step-name">${escapeHtml(step.name)}</div>
              <div>${escapeHtml(step.detail || '')}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderAttachments() {
      els.attachments.innerHTML = state.files.map((file) => `
        <span class="attachment">${escapeHtml(file.name)} · ${formatBytes(file.size)}</span>
      `).join('');
    }

    function renderComposerCapabilities() {
      const chips = [
        ...state.selectedChatSkills.map((name) => ({ type: 'skill', name })),
        ...state.selectedChatMcpTools.map((name) => ({ type: 'mcp', name })),
        ...(state.selectedChatWorkflow ? [{ type: 'workflow', name: state.selectedChatWorkflow }] : [])
      ];
      els.capabilityTray.classList.toggle('active', chips.length > 0);
      els.capabilityTray.innerHTML = chips.map((chip) => `
        <span class="capability-chip ${chip.type}">
          <span>${capabilityLabel(chip.type)} · ${escapeHtml(chip.name)}</span>
          <button type="button" title="移除" data-remove-capability="${escapeAttr(chip.type)}" data-name="${escapeAttr(chip.name)}">×</button>
        </span>
      `).join('');
      renderRouteHint();
    }

    function capabilityLabel(type) {
      if (type === 'skill') return 'Skill';
      if (type === 'mcp') return 'MCP';
      return 'Workflow';
    }

    async function openCapabilityPicker(mode) {
      state.capabilityPickerMode = mode;
      renderCapabilityPicker({ loading: true });
      try {
        if (mode === 'skills' && !state.skillsLoaded) await loadSkills({ showLoading: false });
        if (mode === 'mcp' && !state.mcpToolsLoaded) await loadMcpTools({ showLoading: false });
        if (mode === 'workflows' && !state.workflowsLoaded) await loadWorkflows({ showLoading: false });
        renderCapabilityPicker();
      } catch (err) {
        renderCapabilityPicker({ error: err.message });
      }
    }

    function closeCapabilityPicker() {
      state.capabilityPickerMode = null;
      renderCapabilityPicker();
    }

    function renderCapabilityPicker(status = {}) {
      if (!state.capabilityPickerMode) {
        els.capabilityPicker.hidden = true;
        els.capabilityPicker.innerHTML = '';
        return;
      }
      const isSkills = state.capabilityPickerMode === 'skills';
      const isWorkflows = state.capabilityPickerMode === 'workflows';
      const items = isWorkflows ? state.workflows : isSkills ? state.skills : composerMcpTools();
      const selected = isWorkflows
        ? (state.selectedChatWorkflow ? [state.selectedChatWorkflow] : [])
        : isSkills ? state.selectedChatSkills : state.selectedChatMcpTools;
      const title = isWorkflows ? '选择 Workflow' : isSkills ? '添加 Skills' : '添加 MCP';
      const subtitle = isWorkflows
        ? 'Workflow 是显式插件流程；选择后本轮才会进入插件。'
        : isSkills ? '选择本轮 agent loop 可参考的技能。' : '这里只显示手动添加的 MCP；Skill、内置和记忆工具在管理页查看。';
      const empty = status.loading ? '加载中' : status.error || (isWorkflows ? '暂无 Workflow 插件' : isSkills ? '暂无 Skills' : '暂无手动 MCP 工具');
      els.capabilityPicker.hidden = false;
      els.capabilityPicker.innerHTML = `
        <div class="capability-picker-panel" role="dialog" aria-modal="true" aria-label="${escapeAttr(title)}">
          <div class="capability-picker-head">
            <div class="capability-picker-title">
              <strong>${title}</strong>
              <span>${subtitle}</span>
            </div>
            <button class="secondary-btn" type="button" data-capability-close>关闭</button>
          </div>
          <div class="capability-picker-list">
            ${items.length ? items.map((item) => renderCapabilityChoice(item, state.capabilityPickerMode, selected.includes(item.name))).join('') : `<div class="empty-panel">${escapeHtml(empty)}</div>`}
          </div>
          <div class="capability-picker-foot">
            ${isWorkflows ? '<button class="secondary-btn" type="button" data-clear-workflow>不使用 Workflow</button>' : `<button class="secondary-btn" type="button" ${isSkills ? 'data-compose-add-skill' : 'data-compose-add-mcp'}>${isSkills ? '上传 Skill 插件' : '新建 MCP 工具'}</button>`}
            <button class="secondary-btn" type="button" data-compose-manage="${isWorkflows ? 'workflows' : isSkills ? 'skills' : 'tools'}">${isWorkflows ? '管理 Workflows' : isSkills ? '管理 Skills' : '管理 Tools'}</button>
            <button class="secondary-btn" type="button" data-capability-close>完成</button>
          </div>
        </div>
      `;
    }

    function composerMcpTools() {
      return state.mcpTools.filter((tool) => toolSourceType(tool) === 'manual');
    }

    function renderCapabilityChoice(item, mode, active) {
      const name = item.name || '';
      const isSkill = mode === 'skills';
      const isWorkflow = mode === 'workflows';
      const meta = isWorkflow
        ? `${item.trigger || 'explicit'} · ${item.enabled ? 'enabled' : 'disabled'}`
        : isSkill
        ? `${item.output_kind || 'json'} · ${item.sandbox?.enabled ? `Sandbox ${item.sandbox.profile || ''}` : 'Local'}`
        : `${item.source?.type || 'manual'} · ${item.enabled ? 'enabled' : 'disabled'}`;
      return `
        <button class="capability-choice ${active ? 'active' : ''}" type="button" ${isWorkflow ? `data-chat-workflow="${escapeAttr(name)}"` : isSkill ? `data-chat-skill="${escapeAttr(name)}"` : `data-chat-mcp="${escapeAttr(name)}"`}>
          <span class="capability-choice-main">
            <strong>${escapeHtml(name)}</strong>
            <span>${escapeHtml(item.description || meta)}</span>
          </span>
          <span class="capability-choice-state">${active ? '已添加' : '添加'}</span>
        </button>
      `;
    }

    function toggleCapability(kind, name) {
      if (!name) return;
      if (kind === 'workflow') {
        state.selectedChatWorkflow = state.selectedChatWorkflow === name ? null : name;
        renderComposerCapabilities();
        closeCapabilityPicker();
        return;
      }
      const list = kind === 'skill' ? state.selectedChatSkills : state.selectedChatMcpTools;
      const index = list.indexOf(name);
      if (index >= 0) list.splice(index, 1);
      else list.push(name);
      renderComposerCapabilities();
      closeCapabilityPicker();
    }

    function removeCapability(kind, name) {
      if (!name) return;
      if (kind === 'workflow') {
        if (state.selectedChatWorkflow === name) state.selectedChatWorkflow = null;
        renderComposerCapabilities();
        renderCapabilityPicker();
        return;
      }
      const list = kind === 'skill' ? state.selectedChatSkills : state.selectedChatMcpTools;
      const index = list.indexOf(name);
      if (index >= 0) list.splice(index, 1);
      renderComposerCapabilities();
      renderCapabilityPicker();
    }

    function renderPanel() {
      if (state.activeTab === 'verification') {
        renderVerificationPanel();
      } else if (state.activeTab === 'spec') {
        renderSpecPanel();
      } else if (state.activeTab === 'timeline') {
        renderTimelinePanel();
      } else if (state.activeTab === 'abilities') {
        renderAbilityPanel();
      } else {
        renderArtifactPanel();
      }
    }

    function activateInspectorTab(tabName) {
      state.activeTab = ['artifacts', 'abilities', 'verification', 'spec', 'timeline'].includes(tabName) ? tabName : 'artifacts';
      document.querySelectorAll('.tab').forEach((item) => {
        item.classList.toggle('active', item.dataset.tab === state.activeTab);
      });
      updateNavigationState();
      renderPanel();
    }

    function openInspectorTab(tabName) {
      setView('chat');
      activateInspectorTab(tabName);
    }

    function renderArtifactPanel() {
      const timeline = state.timeline.length ? `
        <section class="timeline">
          <div class="timeline-head">
            <span>执行</span>
            <span>${state.timeline.length}</span>
          </div>
          ${renderTimelineBlock()}
        </section>
      ` : '';

      if (!state.artifacts.length) {
        els.panel.innerHTML = `
          ${timeline}
          <div class="empty-panel">暂无文件输出</div>
        `;
        return;
      }
      els.panel.innerHTML = `
        ${timeline}
        <section class="panel-section">
          ${state.artifacts.map((artifact) => `
            <div class="artifact">
              <div class="artifact-name">${escapeHtml(artifact.name)}</div>
              <div class="artifact-meta">${escapeHtml(artifact.kind)} · ${escapeHtml(artifact.mime_type)} · ${formatBytes(artifact.size)}</div>
              <div class="artifact-actions">
                <button type="button" data-preview="${escapeAttr(artifactUrl(artifact.preview_url))}" data-kind="${escapeAttr(artifact.kind)}" data-id="${safeId(artifact.path)}">预览</button>
                <button type="button" data-download="${escapeAttr(artifactUrl(artifact.download_url))}">下载</button>
              </div>
              <div class="preview ${artifact.kind === 'image' ? 'image-preview' : ''}" id="preview-${safeId(artifact.path)}" ${artifact.kind === 'image' ? '' : 'hidden'}>
                ${artifact.kind === 'image' ? `<img src="${escapeAttr(artifactUrl(artifact.preview_url))}" alt="${escapeAttr(artifact.name)}">` : ''}
              </div>
            </div>
          `).join('')}
        </section>
      `;
    }

    function renderVerificationPanel() {
      if (!state.verification) {
        els.panel.innerHTML = state.running
          ? '<div class="verify running"><div class="status running">校验等待中</div></div>'
          : '<div class="empty-panel">暂无校验结果</div>';
        return;
      }
      const passed = state.verification.passed;
      const checks = state.verification.checks || [];
      els.panel.innerHTML = `
        <div class="verify ${passed ? '' : 'failed'}">
          <div class="status ${passed ? '' : 'failed'}">${passed ? '校验通过' : '校验未通过'}</div>
          <div class="artifact-meta">retry: ${state.verification.retry_count || 0}</div>
        </div>
        <div class="check-list">
          ${checks.map((check) => `
            <div class="check">
              <span>${check.passed ? '✓' : '×'}</span>
              <div><strong>${escapeHtml(check.name)}</strong><br>${escapeHtml(check.detail || '')}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderSpecPanel() {
      if (!state.spec) {
        els.panel.innerHTML = '<div class="empty-panel">暂无 Spec</div>';
        return;
      }
      els.panel.innerHTML = `<div class="spec"><pre>${escapeHtml(JSON.stringify(state.spec, null, 2))}</pre></div>`;
    }

    function renderTimelinePanel() {
      els.panel.innerHTML = `
        <section class="timeline">
          <div class="timeline-head">
            <span>执行事件</span>
            <span>${state.timeline.length}</span>
          </div>
          ${renderTimelineBlock()}
        </section>
      `;
    }

    function renderAgents() {
      if (!state.agents.length) {
        els.agentList.innerHTML = '<div class="empty">暂无 Agent</div>';
        return;
      }
      els.agentList.innerHTML = state.agents.map((agent) => `
        <button class="agent-item ${agent.name === els.agent.value ? 'active' : ''}" type="button" data-agent-select="${escapeHtml(agent.name)}">
          <strong>${escapeHtml(agent.display_name || agent.name)}</strong>
          <span>${escapeHtml(agentHints[agent.name] || agent.name)}</span>
        </button>
      `).join('');
    }

    function renderSelectedAgent() {
      const agent = state.agents.find((item) => item.name === els.agent.value);
      els.activeAgentLabel.textContent = agent?.display_name || els.agent.value || 'Agent';
      document.querySelectorAll('[data-agent-select]').forEach((item) => {
        item.classList.toggle('active', item.dataset.agentSelect === els.agent.value);
      });
      renderAgents();
      renderRouteHint();
    }

    async function loadAgents() {
      const res = await fetch(apiUrl('/api/agents'));
      const data = await res.json();
      state.agents = data.agents || [];
      els.agent.innerHTML = state.agents.map((agent) => `<option value="${escapeHtml(agent.name)}">${escapeHtml(agent.display_name || agent.name)}</option>`).join('');
      if ([...els.agent.options].some((option) => option.value === 'default')) {
        els.agent.value = 'default';
      }
      renderAgents();
      renderSelectedAgent();
    }

    async function loadSkills(options = {}) {
      if (els.skillSummary) els.skillSummary.textContent = '加载技能中';
      const res = await fetch(apiUrl('/api/skills'), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.statusText || `HTTP ${res.status}`);
      const data = await res.json();
      state.skills = data.skills || [];
      state.skillsLoaded = true;
      if (!state.selectedSkillName && state.skills.length) {
        state.selectedSkillName = state.skills[0].name;
      }
      renderSkillList();
      if (state.selectedSkillName) {
        await loadSkillDetail(state.selectedSkillName, options);
      } else {
        renderSkillEditor();
      }
      renderSkillSummary();
    }

    async function loadSkillDetail(skillName, options = {}) {
      state.selectedSkillName = skillName;
      renderSkillList();
      if (els.skillEditor && options.showLoading !== false) {
        els.skillEditor.innerHTML = '<div class="empty-panel">加载技能配置</div>';
      }
      const res = await fetch(apiUrl(`/api/skills/${encodeURIComponent(skillName)}`), { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      }
      state.selectedSkill = skillDetailPayload(data);
      const packageFiles = state.selectedSkill.package_files || [];
      if (!packageFiles.some((file) => file.id === state.selectedSkillFileId)) {
        state.selectedSkillFileId = packageFiles.find((file) => file.id === 'manifest')?.id || packageFiles[0]?.id || 'manifest';
      }
      if (packageFiles.length) {
        await loadSkillPackageFile(skillName, state.selectedSkillFileId, { render: false, showLoading: false });
      } else {
        state.selectedSkillFile = null;
        state.selectedSkillFileContent = skillSourceText(state.selectedSkill);
      }
      mergeSkillSummary(data);
      renderSkillList();
      renderSkillEditor();
      renderSkillSummary();
    }

    function skillDetailPayload(data) {
      const manifest = data?.manifest || data || {};
      return {
        ...manifest,
        editable: data?.editable,
        source_path: data?.source_path,
        source_exists: data?.source_exists,
        source_text: data?.source_text,
        package_files: data?.package_files || []
      };
    }

    function mergeSkillSummary(skill) {
      if (!skill?.name) return;
      const index = state.skills.findIndex((item) => item.name === skill.name);
      const summary = {
        name: skill.name,
        description: skill.description,
        output_kind: skill.output_kind,
        generation: skill.generation,
        quality_template: skill.quality_template,
        sandbox: skill.sandbox,
        source: skill.source,
        executable: skill.executable,
        editable: skill.editable,
        source_path: skill.source_path,
        source_exists: skill.source_exists
      };
      if (index >= 0) state.skills[index] = { ...state.skills[index], ...summary };
      else state.skills.push(summary);
    }

    function renderSkillSummary() {
      if (!els.skillSummary) return;
      const sandboxCount = state.skills.filter((skill) => skill.sandbox?.enabled).length;
      const generationCount = state.skills.filter((skill) => skill.generation).length;
      const executableCount = state.skills.filter((skill) => skill.executable !== false).length;
      els.skillSummary.textContent = `${state.skills.length} 个技能 · ${executableCount} 个插件可执行 · ${generationCount} 个生成技能 · ${sandboxCount} 个启用沙盒`;
    }

    function renderSkillList() {
      if (!els.skillList) return;
      const filtered = filteredSkills();
      if (!filtered.length) {
        els.skillList.innerHTML = '<div class="empty-panel">暂无匹配技能</div>';
        return;
      }
      const groups = groupSkills(filtered);
      els.skillList.innerHTML = groups.map((group) => `
        <section class="skill-group">
          <div class="skill-group-title">${escapeHtml(group.label)} · ${group.items.length}</div>
          ${group.items.map((skill) => `
            <button class="skill-row ${skill.name === state.selectedSkillName ? 'active' : ''}" type="button" data-skill-select="${escapeAttr(skill.name)}">
              <div class="skill-row-main">
                <strong>${escapeHtml(skill.name)}</strong>
                <span class="skill-badge kind">${escapeHtml(skill.output_kind || 'json')}</span>
              </div>
              <p>${escapeHtml(skill.description || '')}</p>
              <div class="skill-file-line">${escapeHtml(skill.source?.plugin_id ? `插件 · ${skill.source.plugin_id}` : 'Manifest 草稿')} · ${escapeHtml(displaySourcePath(skill.source_path, `config/skills/${skill.name}.json`))} · ${skill.editable ? '可编辑' : '只读'}</div>
              <div class="skill-badges">
                <span class="skill-badge ${skill.executable === false ? 'local' : 'sandbox'}">${skill.executable === false ? '未安装 runner' : '插件可执行'}</span>
                <span class="skill-badge ${skill.generation ? '' : 'local'}">${skill.generation ? '生成' : '判断'}</span>
                ${skill.sandbox?.enabled
                  ? `<span class="skill-badge sandbox">Sandbox · ${escapeHtml(skill.sandbox.profile || '-')}</span>`
                  : '<span class="skill-badge local">Local</span>'}
              </div>
            </button>
          `).join('')}
        </section>
      `).join('');
    }

    function filteredSkills() {
      const skills = [...state.skills].sort((a, b) => String(a.name).localeCompare(String(b.name)));
      if (state.skillFilter === 'generation') return skills.filter((skill) => skill.generation);
      if (state.skillFilter === 'sandbox') return skills.filter((skill) => skill.sandbox?.enabled);
      if (state.skillFilter === 'local') return skills.filter((skill) => !skill.sandbox?.enabled);
      return skills;
    }

    function displaySourcePath(path, fallback) {
      const text = String(path || fallback || '');
      const marker = '/config/skills/';
      const index = text.indexOf(marker);
      if (index >= 0) return `config/skills/${text.slice(index + marker.length)}`;
      const pluginMarker = '/plugins/skills/';
      const pluginIndex = text.indexOf(pluginMarker);
      if (pluginIndex >= 0) return `plugins/skills/${text.slice(pluginIndex + pluginMarker.length)}`;
      return text || fallback || '';
    }

    function groupSkills(skills) {
      const order = ['drawio', 'presentation', 'spreadsheet', 'mindmap', 'markdown', 'json'];
      const labels = {
        drawio: '图形与架构',
        presentation: '演示文稿',
        spreadsheet: '表格',
        mindmap: '思维导图',
        markdown: '文档',
        json: '识别与判断'
      };
      const map = new Map();
      skills.forEach((skill) => {
        const key = skill.output_kind || 'json';
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(skill);
      });
      return [...map.entries()]
        .sort(([a], [b]) => (order.indexOf(a) === -1 ? 99 : order.indexOf(a)) - (order.indexOf(b) === -1 ? 99 : order.indexOf(b)))
        .map(([key, items]) => ({ key, label: labels[key] || key, items }));
    }

    function skillManifestForSave(skill) {
      const {
        editable,
        source_path,
        source_exists,
        source_text,
        package_files,
        source,
        executable,
        ...manifest
      } = skill || {};
      return manifest;
    }

    function skillSourceText(skill) {
      return skill?.source_text || `${JSON.stringify(skillManifestForSave(skill), null, 2)}\n`;
    }

    async function loadSkillPackageFile(skillName, fileId, options = {}) {
      state.selectedSkillFileId = fileId || 'manifest';
      if (els.skillEditor && options.showLoading !== false) {
        state.selectedSkillFile = null;
        state.selectedSkillFileContent = '加载文件中';
        renderSkillEditor();
      }
      const res = await fetch(apiUrl(`/api/skills/${encodeURIComponent(skillName)}/files/${encodeURIComponent(state.selectedSkillFileId)}`), { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      }
      state.selectedSkillFile = data.file || null;
      state.selectedSkillFileContent = typeof data.content === 'string' ? data.content : '';
      if (options.render !== false) renderSkillEditor();
    }

    function selectedPackageFile(skill) {
      const files = skill?.package_files || [];
      return state.selectedSkillFile
        || files.find((file) => file.id === state.selectedSkillFileId)
        || files.find((file) => file.id === 'manifest')
        || files[0]
        || null;
    }

    function selectedPackageFileContent(skill, file) {
      if (typeof state.selectedSkillFileContent === 'string' && state.selectedSkillFileContent) {
        return state.selectedSkillFileContent;
      }
      return file?.id === 'manifest' ? skillSourceText(skill) : '';
    }

    function renderSkillEditor(status = {}) {

        els.skillEditor.innerHTML = '<div class="empty-panel">选择左侧技能</div>';

      const packageFile = selectedPackageFile(skill);
      const fileContent = selectedPackageFileContent(skill, packageFile);

      els.skillEditor.innerHTML = `
        <div class="skill-editor-head">

        </div>

          ${packageFiles.length ? `
            <div class="package-file-tabs">
              ${packageFiles.map((file) => `
                <button class="${file.id === (packageFile?.id || state.selectedSkillFileId) ? 'active' : ''}" type="button" data-skill-file="${escapeAttr(file.id)}">
                  ${escapeHtml(file.label || file.id)}
                </button>
              `).join('')}
            </div>
          ` : ''}
          <div class="file-editor-head">
            <div class="file-editor-title">
              <strong>${escapeHtml(packageFile?.label || 'manifest.json')} · Skill 包文件</strong>
              <span>${escapeHtml(displaySourcePath(packageFile?.path || skill.source_path, `config/skills/${skill.name}.json`))}</span>
            </div>
            <div class="file-edit-meta">${packageFile?.exists ? '已存在' : '保存后创建文件'} · ${escapeHtml(packageFile?.language || 'text')}</div>
          </div>
          <div class="field">
            <textarea id="skillPackageFileContent" class="code file-code" spellcheck="false" ${packageFile?.editable === false ? 'disabled' : ''}>${escapeHtml(fileContent)}</textarea>
          </div>
          <div class="skill-form-actions">
            ${packageFile?.language === 'json' ? '<button class="secondary-btn" type="button" data-skill-format-file>格式化 JSON</button>' : ''}
            <button class="primary-btn" type="button" data-skill-save-file ${packageFile?.editable === false ? 'disabled' : ''}>保存包文件</button>
          </div>
        </section>
        <form id="skillForm" class="skill-form">
          <section class="skill-form-section">
            <h3 class="skill-form-section-title">基础信息</h3>
            <div class="field">
              <label for="skillDescription">描述</label>
              <input id="skillDescription" name="description" value="${escapeAttr(skill.description || '')}">
            </div>
            <div class="field-grid">
              <div class="field">
                <label for="skillOutputKind">输出类型</label>
                <input id="skillOutputKind" name="output_kind" value="${escapeAttr(skill.output_kind || 'json')}">
              </div>
              <label class="check-field">
                <input name="generation" type="checkbox" ${skill.generation ? 'checked' : ''}>
                <span>生成型技能</span>
              </label>
            </div>
            <div class="field">
              <label for="skillQuality">质量模板</label>
              <textarea id="skillQuality" name="quality_template">${escapeHtml((skill.quality_template || []).join('\n'))}</textarea>
            </div>
          </section>
          <section class="skill-form-section">
            <h3 class="skill-form-section-title">运行策略</h3>
            <div class="field-grid">
              <label class="check-field">
                <input name="sandbox_enabled" type="checkbox" ${sandbox.enabled ? 'checked' : ''}>
                <span>启用沙盒执行</span>
              </label>
              <div class="field">
                <label for="skillSandboxProfile">沙盒 Profile</label>
                <input id="skillSandboxProfile" name="sandbox_profile" value="${escapeAttr(sandbox.profile || '')}">
              </div>
