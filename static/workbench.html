<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JetLinks Agent Runtime v2</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --sidebar-bg: #111317;
      --sidebar-soft: #181b20;
      --sidebar-text: #d6d9de;
      --sidebar-muted: #7d8490;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-warm: #f7f9fb;
      --line: #dfe3ea;
      --line-strong: #b8c0cc;
      --text: #181b1f;
      --muted: #68717c;
      --muted-2: #9299a3;
      --accent: #155bd4;
      --accent-strong: #0f49ad;
      --accent-soft: #edf3ff;
      --green: #13795b;
      --green-soft: #e8f7f1;
      --orange: #ad6516;
      --orange-soft: #fff5e6;
      --red: #b42318;
      --red-soft: #fff0ee;
      --black: #111317;
      --code: #0f172a;
      --sidebar-w: 252px;
      --topbar-h: 56px;
      --radius: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 999px;
      --shadow-soft: 0 16px 44px rgba(24, 27, 31, 0.08);
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      color: var(--text);
      background: var(--bg);
      font-family: var(--sans);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input, select { font: inherit; }
    button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }
    [hidden] { display: none !important; }

    .app {
      min-height: 100svh;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    }

    .sidebar {
      min-height: 100svh;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: 16px;
      padding: 18px 14px 14px;
      border-right: 1px solid rgba(255, 255, 255, .07);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px 4px;
    }

    .brand-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #2563eb, #13a38b);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .brand-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .brand-title strong {
      color: #f4f5f5;
      font-size: 14px;
      line-height: 1.15;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-title span {
      color: var(--sidebar-muted);
      font-size: 11px;
      line-height: 1.1;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .06);
      color: #aeb4bd;
      transition: background 120ms, color 120ms;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, .1);
      color: #fff;
    }

    .icon-btn svg,
    .new-task svg,
    .nav svg,
    .tool-pill svg,
    .send svg,
    .small-action svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .new-task {
      min-height: 40px;
      border-radius: var(--radius-lg);
      background: #f3f4f6;
      color: #111317;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      transition: transform 120ms, background 120ms;
    }

    .new-task:hover {
      transform: translateY(-1px);
      background: #fff;
    }

    .nav {
      display: grid;
      gap: 2px;
    }

    .nav button,
    .nav a {
      width: 100%;
      min-height: 38px;
      border-radius: var(--radius);
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--sidebar-text);
      text-align: left;
      text-decoration: none;
      transition: background 120ms, color 120ms;
    }

    .nav button.active,
    .nav button:hover,
    .nav a:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    .nav-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 640;
    }

    .nav-badge {
      margin-left: auto;
      border-radius: var(--radius-full);
      padding: 2px 7px;
      background: rgba(24, 104, 219, .24);
      color: #9fc1ff;
      font-size: 10px;
      font-weight: 760;
      white-space: nowrap;
    }

    .side-section {
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
    }

    .side-title {
      padding: 0 6px;
      color: var(--sidebar-muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .side-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 4px;
      padding-right: 2px;
    }

    .agent-item {
      width: 100%;
      min-height: 52px;
      border-radius: var(--radius-lg);
      padding: 9px 10px;
      display: grid;
      gap: 4px;
      text-align: left;
      border: 1px solid transparent;
      color: #e2e5e8;
      transition: background 120ms, border-color 120ms;
    }

    .agent-item:hover,
    .agent-item.active {
      background: rgba(255, 255, 255, .065);
      border-color: rgba(255, 255, 255, .08);
    }

    .agent-item strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .agent-item span {
      color: var(--sidebar-muted);
      font-size: 11px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-foot {
      display: grid;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, .07);
      color: var(--sidebar-muted);
      font-size: 11px;
    }

    .thread-mini {
      min-width: 0;
      border-radius: var(--radius);
      padding: 8px;
      background: rgba(255, 255, 255, .045);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .admin-token-panel {
      display: grid;
      gap: 7px;
    }

    .admin-token-panel label {
      color: var(--sidebar-muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .02em;
    }

    .admin-token-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 5px;
    }

    .admin-token-row input {
      min-width: 0;
      height: 30px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .055);
      color: #fff;
      padding: 0 8px;
      outline: none;
      font-size: 11px;
    }

    .admin-token-row button {
      height: 30px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .07);
      color: #d6d9de;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 720;
    }

    .admin-token-row button:hover {
      background: rgba(255, 255, 255, .11);
      color: #fff;
    }

    .admin-token-status {
      min-height: 15px;
      color: var(--sidebar-muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .admin-token-status.ok { color: #9ddfc7; }
    .admin-token-status.error { color: #ffb4aa; }

    .main {
      min-width: 0;
      min-height: 100svh;
      display: grid;
      grid-template-rows: var(--topbar-h) minmax(0, 1fr);
    }

    .topbar {
      min-width: 0;
      height: var(--topbar-h);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(246, 247, 249, .9);
      backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left,
    .topbar-right {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-left {
      color: var(--muted);
      font-size: 13px;
      font-weight: 640;
      flex-wrap: wrap;
    }

    .topbar-right {
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .topbar select,
    .topbar input {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      padding: 0 10px;
      outline: none;
    }

    .topbar input {
      width: 190px;
      min-width: 140px;
    }

    .sandbox-pill {
      min-height: 28px;
      max-width: 280px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: #3d454d;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
      transition: background 120ms, border-color 120ms, color 120ms;
    }

    .sandbox-pill:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .sandbox-pill .sandbox-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sandbox-pill.pending .status-dot {
      background: var(--muted-2);
      box-shadow: 0 0 0 3px rgba(104, 113, 124, .12);
    }

    .sandbox-pill.available .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(19, 121, 91, .12);
    }

    .sandbox-pill.unavailable .status-dot {
      background: var(--orange);
      box-shadow: 0 0 0 3px rgba(173, 101, 22, .14);
    }

    .sandbox-pill.error .status-dot {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(180, 35, 24, .12);
    }

    .ghost-btn,
    .secondary-btn {
      height: 34px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: #3d454d;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 650;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms, border-color 120ms, color 120ms;
      white-space: nowrap;
      cursor: pointer;
    }

    .ghost-btn:hover,
    .secondary-btn:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .upload-file-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      background: var(--surface);
      color: #3d454d;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
      overflow: hidden;
    }

    .upload-file-button.primary {
      background: var(--black);
      border-color: var(--black);
      color: #fff;
      font-weight: 760;
    }

    .upload-file-button:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .upload-file-button.primary:hover {
      background: #000;
      border-color: #000;
    }

    .upload-file-button input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: 100px;
    }

    .skill-local-install {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 280px;
    }

    .skill-local-install input {
      width: min(320px, 34vw);
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      background: var(--surface);
      color: #2f363d;
      padding: 0 12px;
      font-size: 12px;
    }

    .skill-drop-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 220px;
      padding: 0 14px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-full);
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      transition: background 120ms, border-color 120ms, color 120ms, box-shadow 120ms;
      user-select: none;
    }

    .skill-drop-zone.active {
      background: var(--accent-soft);
      border-color: rgba(21, 91, 212, .28);
      color: var(--accent);
      box-shadow: 0 0 0 3px rgba(21, 91, 212, .08);
    }

    .workbench {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) minmax(340px, 390px);
      gap: 0;
    }

    .center {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      padding: 22px 28px 18px;
      overflow: hidden;
    }

    .intro {
      max-width: 920px;
      width: 100%;
      margin: 0 auto 12px;
      display: grid;
      gap: 14px;
    }

    .intro-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .intro-title {
      min-width: 0;
      display: grid;
      gap: 8px;
    }

    .intro-title h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.08;
      font-weight: 780;
      letter-spacing: 0;
    }

    .intro-title p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      max-width: 640px;
    }

    .status-pill {
      min-height: 32px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(19, 121, 91, .12);
    }

    .module-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .module-tabs button {
      min-height: 34px;
      padding: 0 14px;
      border-radius: var(--radius-full);
      color: var(--muted);
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 660;
      transition: background 120ms, color 120ms, border-color 120ms, box-shadow 120ms;
    }

    .module-tabs button.active,
    .module-tabs button:hover {
      background: var(--surface);
      color: var(--text);
      border-color: var(--line);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
    }

    .skill-strip {
      max-width: 920px;
      width: 100%;
      margin: 0 auto 12px;
      display: grid;
      gap: 10px;
    }

    .mode-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .tool-pill {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      background: var(--surface);
      color: #3d454d;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 650;
      transition: background 120ms, border-color 120ms, color 120ms;
    }

    .tool-pill input {
      margin: 0;
      accent-color: var(--accent);
    }

    .tool-pill.active {
      border-color: rgba(24, 104, 219, .28);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .quick-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .quick-row button {
      min-height: 32px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: #3f464e;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 650;
      transition: background 120ms, border-color 120ms;
      white-space: nowrap;
    }

    .quick-row button:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .module-tabs,
    .skill-strip {
      display: none;
    }

    .chat-frame {
      min-height: 0;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
      border-top: 1px solid var(--line);
    }

    .messages {
      min-height: 0;
      overflow: auto;
      padding: 18px 2px 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 14px;
      padding: 10px 0;
      line-height: 1.58;
      animation: messageIn 150ms ease-out;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .role {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding-top: 3px;
      white-space: nowrap;
    }

    .bubble {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      background: transparent;
    }

    .message.user .bubble {
      color: #111317;
      background: #eef4ff;
      border-color: rgba(21, 91, 212, .16);
      font-weight: 560;
    }

    .message.assistant .bubble {
      background: var(--surface);
      border-color: var(--line);
    }

    .message.assistant .bubble.streaming::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 16px;
      margin-left: 3px;
      border-radius: 2px;
      background: var(--accent);
      vertical-align: -3px;
      animation: cursorBlink 900ms steps(2, start) infinite;
    }

    @keyframes cursorBlink {
      50% { opacity: 0; }
    }

    .markdown-body {
      white-space: normal;
    }

    .markdown-body.streaming-text {
      white-space: pre-wrap;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body p {
      margin: 0 0 10px;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      margin: 14px 0 8px;
      line-height: 1.25;
      color: #111317;
      font-weight: 760;
    }

    .markdown-body h1 { font-size: 22px; }
    .markdown-body h2 { font-size: 18px; }
    .markdown-body h3 { font-size: 16px; }
    .markdown-body h4 { font-size: 14px; }

    .markdown-body ul,
    .markdown-body ol {
      margin: 6px 0 12px;
      padding-left: 22px;
    }

    .markdown-body li {
      margin: 4px 0;
    }

    .markdown-body strong {
      font-weight: 760;
      color: #111317;
    }

    .markdown-body code {
      border: 1px solid rgba(15, 23, 42, .08);
      border-radius: 5px;
      background: #f3f6fb;
      color: #0f172a;
      padding: 1px 5px;
      font-family: var(--mono);
      font-size: .92em;
    }

    .markdown-body pre {
      margin: 10px 0 12px;
      padding: 12px;
      overflow: auto;
      border-radius: var(--radius);
      background: #0f172a;
      color: #e5e7eb;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .markdown-body pre code {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      font-size: inherit;
    }

    .markdown-body blockquote {
      margin: 8px 0 12px;
      padding: 8px 12px;
      border-left: 3px solid var(--accent);
      background: #f4f7fc;
      color: #47515e;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 12px;
      font-size: 13px;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--line);
      padding: 7px 9px;
      text-align: left;
      vertical-align: top;
    }

    .markdown-body th {
      background: var(--surface-soft);
      font-weight: 720;
    }

    .message.user .markdown-body {
      white-space: pre-wrap;
    }

    .composer-wrap {
      position: relative;
      z-index: 30;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding-top: 12px;
    }

    .chat-frame.drag-active,
    .composer-wrap.drag-active .composer {
      border-color: rgba(21, 91, 212, .42);
      box-shadow: 0 0 0 3px rgba(21, 91, 212, .1);
    }

    .composer {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      overflow: visible;
      transition: box-shadow 160ms, border-color 160ms;
    }

    .composer:focus-within {
      border-color: rgba(24, 104, 219, .28);
      box-shadow: 0 18px 56px rgba(24, 27, 31, .11);
    }

    .composer-capability-tray {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 14px 0;
    }

    .composer-capability-tray.active {
      display: flex;
    }

    .capability-chip {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      background: var(--surface-soft);
      color: #303842;
      padding: 4px 8px 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 720;
      max-width: 100%;
    }

    .capability-chip span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .capability-chip.skill {
      background: var(--accent-soft);
      border-color: rgba(21, 91, 212, .18);
      color: var(--accent);
    }

    .capability-chip.mcp {
      background: var(--green-soft);
      border-color: rgba(19, 121, 91, .16);
      color: var(--green);
    }

    .capability-chip button {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: inherit;
      font-size: 15px;
      line-height: 1;
    }

    .capability-picker {
      position: fixed;
      inset: 0;
      z-index: 120;
      padding: 0 24px max(24px, env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, .18);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .capability-picker-panel {
      width: min(920px, calc(100vw - 48px));
      max-height: min(520px, 72vh);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, .98);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .capability-picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .capability-picker-title {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .capability-picker-title strong {
      color: var(--text);
      font-size: 14px;
      font-weight: 780;
    }

    .capability-picker-title span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .capability-picker-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      padding: 8px;
      gap: 6px;
    }

    .capability-choice {
      width: 100%;
      min-height: 54px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      text-align: left;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 9px 10px;
      background: transparent;
      transition: background 120ms, border-color 120ms;
    }

    .capability-choice:hover,
    .capability-choice.active {
      background: var(--surface-soft);
      border-color: var(--line);
    }

    .capability-choice-main {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .capability-choice-main strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .capability-choice-main span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .capability-choice-state {
      min-width: 58px;
      min-height: 28px;
      border-radius: var(--radius-full);
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .capability-choice.active .capability-choice-state {
      background: var(--black);
      border-color: var(--black);
      color: #fff;
    }

    .capability-picker-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .composer textarea {
      width: 100%;
      min-height: 96px;
      max-height: 220px;
      border: 0;
      resize: vertical;
      outline: none;
      padding: 16px 18px 8px;
      color: var(--text);
      background: transparent;
      font-size: 15px;
      line-height: 1.58;
    }

    .composer-bar {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px 12px;
      border-top: 1px solid rgba(17, 19, 23, .06);
    }

    .composer-tools,
    .composer-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-action {
      min-height: 32px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: #3d454d;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 650;
      transition: background 120ms, border-color 120ms;
    }

    .small-action:hover {
      background: #fff;
      border-color: var(--line-strong);
    }

    .toggle-action {
      cursor: pointer;
      user-select: none;
    }

    .toggle-action input {
      margin: 0;
      accent-color: var(--accent);
    }

    .toggle-action:has(input:checked) {
      border-color: rgba(24, 104, 219, .28);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .send {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--black);
      color: #fff;
      display: grid;
      place-items: center;
      transition: transform 120ms, background 120ms;
    }

    .send:hover {
      transform: translateY(-1px);
      background: #000;
    }

    .send.running {
      width: auto;
      min-width: 78px;
      padding: 0 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
    }

    .attachments {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .attachment {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      padding: 5px 9px;
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attachment.uploading {
      border-color: rgba(21, 91, 212, .28);
      background: var(--accent-soft);
    }

    .attachment.error {
      border-color: rgba(185, 28, 28, .28);
      background: rgba(254, 226, 226, .65);
      color: var(--red);
    }

    .attachment button {
      width: 18px;
      height: 18px;
      margin-left: 6px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      line-height: 18px;
    }

    .attachment button:hover {
      background: rgba(15, 23, 42, .08);
    }

    .required-input-panel {
      margin: 0;
      border: 1px solid rgba(21, 91, 212, .22);
      background: var(--accent-soft);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #244266;
    }

    .required-input-message .bubble {
      border-color: rgba(21, 91, 212, .22);
      background: transparent;
      padding: 0;
    }

    .required-input-panel.active {
      display: flex;
    }

    .required-input-text {
      min-width: 0;
      display: grid;
      gap: 3px;
      font-size: 12px;
      line-height: 1.4;
    }

    .required-input-title {
      color: var(--text);
      font-weight: 760;
    }

    .required-input-detail {
      color: var(--muted);
    }

    .required-input-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .required-input-actions button {
      min-height: 30px;
      border-radius: var(--radius-full);
      padding: 0 11px;
      font-size: 12px;
      font-weight: 720;
      border: 1px solid rgba(21, 91, 212, .24);
      background: #fff;
      color: var(--accent);
    }

    .required-input-actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .route-hint {
      min-height: 28px;
      border-radius: var(--radius-full);
      padding: 5px 9px;
      background: var(--accent-soft);
      color: var(--accent);
      display: none;
      align-items: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 680;
    }

    .route-hint.active {
      display: inline-flex;
    }

    .inspector {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      background: var(--surface-warm);
      border-left: 1px solid var(--line);
      overflow: hidden;
    }

    .inspector-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .inspector-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .inspector-title strong {
      font-size: 14px;
      font-weight: 760;
    }

    .inspector-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .tab {
      height: 30px;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      color: var(--muted);
      padding: 0 11px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 120ms, border-color 120ms, color 120ms;
    }

    .tab.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: rgba(24, 104, 219, .22);
    }

    .inspector-body {
      min-height: 0;
      overflow: auto;
      padding: 16px;
    }

    .timeline {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .timeline-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .timeline-list {
      display: grid;
      gap: 0;
    }

    .step {
      position: relative;
      padding: 0 0 12px 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .step::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .step::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 14px;
      bottom: 0;
      width: 1px;
      background: var(--line);
    }

    .step:last-child {
      padding-bottom: 0;
    }

    .step:last-child::after {
      display: none;
    }

    .step-name {
      color: var(--text);
      font-weight: 720;
      margin-bottom: 3px;
    }

    .panel-section {
      display: grid;
      gap: 10px;
    }

    .artifact {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .artifact:first-child {
      padding-top: 0;
    }

    .artifact:last-child {
      border-bottom: 0;
    }

    .artifact-name {
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .artifact-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .artifact-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .artifact-actions button,
    .preview-action {
      min-height: 30px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: #3d454d;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 680;
      transition: background 120ms, border-color 120ms;
    }

    .artifact-actions button:hover,
    .preview-action:hover {
      background: var(--surface-soft);
      border-color: var(--line-strong);
    }

    .preview {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #f8fafc;
    }

    .preview .markdown-body {
      padding: 12px;
      background: #fff;
    }

    .preview.image-preview {
      padding: 8px;
      background: #fff;
    }

    .preview img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: var(--radius);
      background: #f8fafc;
    }

    .preview pre,
    .spec pre {
      margin: 0;
      padding: 12px;
      max-height: 320px;
      overflow: auto;
      color: var(--code);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .spec pre {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: #f8fafc;
    }

    .verify {
      margin-bottom: 14px;
      padding: 12px;
      border-radius: var(--radius-lg);
      background: var(--green-soft);
      border: 1px solid rgba(19, 121, 91, .14);
    }

    .verify.failed {
      background: var(--red-soft);
      border-color: rgba(180, 35, 24, .16);
    }

    .verify.running {
      background: var(--orange-soft);
      border-color: rgba(173, 101, 22, .18);
    }

    .status {
      font-weight: 760;
      color: var(--green);
    }

    .status.failed { color: var(--red); }
    .status.running { color: var(--orange); }

    .check-list {
      display: grid;
      gap: 8px;
    }

    .check {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .check strong {
      color: var(--text);
      font-weight: 720;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .empty-panel {
      min-height: 220px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, .46);
      line-height: 1.6;
    }

    .center.skills-mode {
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }

    .skill-manager {
      min-height: 0;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      overflow: hidden;
    }

    .skill-manager-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .skill-manager-head h2 {
      margin: 0 0 5px;
      font-size: 26px;
      line-height: 1.1;
      font-weight: 780;
    }

    .skill-manager-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .manager-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .skill-manager-body {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 18px;
      overflow: hidden;
    }

    .app-template-board {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .58);
      overflow: hidden;
    }

    .app-template-list {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      align-content: start;
      gap: 12px;
    }

    .app-template-card {
      min-width: 0;
      display: grid;
      gap: 12px;
      text-align: left;
      padding: 14px;
      border: 1px solid rgba(223, 227, 234, .88);
      border-radius: var(--radius-lg);
      background: #fff;
      box-shadow: 0 10px 28px rgba(17, 19, 23, .045);
      transition: border-color 120ms, transform 120ms, box-shadow 120ms;
    }

    .app-template-card:hover {
      transform: translateY(-1px);
      border-color: rgba(21, 91, 212, .26);
      box-shadow: 0 16px 34px rgba(17, 19, 23, .07);
    }

    .app-template-head {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .app-template-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
    }

    .app-template-title {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .app-template-title strong {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 780;
      color: var(--text);
    }

    .app-template-title span,
    .app-template-card p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .app-template-card p {
      margin: 0;
      min-height: 34px;
    }

    .app-template-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .app-template-json {
      max-height: 320px;
      overflow: auto;
      margin: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--code);
      color: #e5eefb;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.55;
      white-space: pre;
    }

    .skill-list-pane,
    .skill-editor-pane {
      min-height: 0;
      background: rgba(255, 255, 255, .62);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .skill-list-pane {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .skill-filter-row {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .skill-filter-row button {
      min-height: 30px;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      color: var(--muted);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .skill-filter-row button.active,
    .skill-filter-row button:hover {
      background: var(--surface);
      border-color: var(--line);
      color: var(--text);
    }

    .skill-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      align-content: start;
    }

    .skill-group {
      padding: 12px 0 4px;
    }

    .skill-group-title {
      padding: 0 14px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
      text-transform: uppercase;
    }

    .skill-row {
      width: 100%;
      display: grid;
      gap: 6px;
      padding: 11px 14px;
      text-align: left;
      border-top: 1px solid rgba(223, 227, 234, .72);
      transition: background 120ms;
    }

    .skill-row:hover,
    .skill-row.active {
      background: #fff;
    }

    .skill-row-main {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .skill-row strong {
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-row p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .skill-file-line {
      color: var(--muted-2);
      font-size: 11px;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .skill-badge {
      min-height: 22px;
      border-radius: var(--radius-full);
      padding: 3px 7px;
      background: var(--surface-soft);
      border: 1px solid rgba(223, 227, 234, .86);
      color: var(--muted);
      font-size: 10px;
      font-weight: 760;
      white-space: nowrap;
    }

    .skill-badge.sandbox {
      background: var(--accent-soft);
      border-color: rgba(21, 91, 212, .18);
      color: var(--accent);
    }

    .skill-badge.local {
      background: var(--green-soft);
      border-color: rgba(19, 121, 91, .15);
      color: var(--green);
    }

    .skill-editor-pane {
      min-width: 0;
      overflow: auto;
      background: var(--surface);
    }

    .skill-editor {
      min-width: 0;
      display: grid;
      gap: 16px;
      padding: 16px;
    }

    .skill-editor-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .skill-editor-title {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .skill-editor-title strong {
      font-size: 18px;
      line-height: 1.2;
      font-weight: 780;
      overflow-wrap: anywhere;
    }

    .skill-editor-title span {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .skill-status {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      min-height: 20px;
    }

    .skill-status.ok { color: var(--green); }
    .skill-status.error { color: var(--red); }

    .skill-form {
      display: grid;
      gap: 14px;
    }

    .file-editor {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(246, 248, 251, .78);
    }

    .file-editor-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .file-editor-title {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .file-editor-title strong {
      font-size: 13px;
      font-weight: 780;
      color: var(--text);
    }

    .file-editor-title span,
    .file-edit-meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .cron-run-list,
    .cron-preview-list {
      display: grid;
      gap: 7px;
    }

    .cron-run-row,
    .cron-preview-row {
      display: grid;
      gap: 4px;
      padding: 8px 9px;
      border: 1px solid rgba(223, 227, 234, .78);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .62);
    }

    .cron-run-row-main,
    .cron-preview-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      font-size: 12px;
      font-weight: 720;
    }

    .cron-run-row-meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .package-file-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .package-file-tabs button {
      min-height: 30px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .package-file-tabs button.active,
    .package-file-tabs button:hover {
      color: var(--accent);
      border-color: rgba(21, 91, 212, .22);
      background: var(--accent-soft);
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .field label,
    .check-field {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--text);
      padding: 9px 10px;
      outline: none;
      font-size: 13px;
      line-height: 1.45;
    }

    .field textarea {
      min-height: 94px;
      resize: vertical;
    }

    .field textarea.code {
      min-height: 210px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
    }

    .field textarea.file-code {
      min-height: 360px;
    }

    .field textarea.manifest-preview {
      min-height: 260px;
      background: #f8fafc;
    }

    .schema-editor {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafc;
    }

    .schema-editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .schema-editor-title {
      display: grid;
      gap: 3px;
    }

    .schema-editor-title strong {
      font-size: 15px;
      font-weight: 780;
    }

    .schema-editor-title span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .schema-editor-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .schema-root {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
      padding: 10px;
      border: 1px solid rgba(223, 227, 234, .72);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .74);
    }

    .schema-list {
      display: grid;
      gap: 0;
      overflow: hidden;
      border: 1px solid rgba(223, 227, 234, .86);
      border-radius: var(--radius);
      background: #fff;
    }

    .schema-list-head {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) 132px 150px 72px minmax(180px, 1.2fr) 96px;
      gap: 8px;
      padding: 8px 10px;
      background: #eef2f7;
      color: var(--muted);
      font-size: 11px;
      font-weight: 780;
      border-bottom: 1px solid rgba(223, 227, 234, .86);
    }

    .schema-row {
      display: grid;
      gap: 0;
      border-bottom: 1px solid rgba(223, 227, 234, .72);
      background: #fff;
    }

    .schema-row:last-child {
      border-bottom: 0;
    }

    .schema-row-head {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) 132px 150px 72px minmax(180px, 1.2fr) 96px;
      gap: 8px;
      align-items: center;
      padding: 10px;
    }

    .schema-row-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(180px, 1fr);
      gap: 8px;
      padding: 0 10px 10px;
      background: #fbfdff;
    }

    .schema-row-grid .field {
      gap: 4px;
    }

    .schema-row-head .field {
      gap: 0;
    }

    .schema-row-head .field label {
      display: none;
    }

    .schema-row-grid .field input,
    .schema-row-grid .field textarea,
    .schema-row-grid .field select,
    .schema-row-head .field input,
    .schema-row-head .field select {
      padding: 7px 8px;
      font-size: 12px;
    }

    .schema-row-grid .field textarea {
      min-height: 58px;
    }

    .schema-row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
    }

    .schema-row .check-field {
      min-height: 32px;
      font-size: 11px;
      justify-content: center;
      padding: 0;
    }

    .schema-row button[data-schema-remove-field],
    .schema-row button[data-schema-toggle-advanced] {
      height: 30px;
      padding: 0 9px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .schema-row button[data-schema-remove-field] {
      color: var(--red);
      border-color: rgba(196, 52, 52, .18);
      background: rgba(196, 52, 52, .06);
    }

    .schema-row-actions {
      justify-content: flex-end;
    }

    .schema-root .check-field {
      justify-content: flex-end;
      min-height: 32px;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: rgba(21, 91, 212, .42);
      background: #fff;
    }

    .check-field {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 0 2px;
    }

    .check-field input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .skill-form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 2px;
    }

    .primary-btn {
      height: 34px;
      border-radius: var(--radius-full);
      background: var(--black);
      color: #fff;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 720;
      transition: background 120ms, transform 120ms;
      white-space: nowrap;
    }

    .primary-btn:hover {
      background: #000;
      transform: translateY(-1px);
    }

    .ability-panel {
      display: grid;
      gap: 14px;
    }

    .ability-head {
      display: grid;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .ability-mode {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .ability-mode button {
      min-height: 30px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .ability-mode button.active,
    .ability-mode button:hover {
      background: var(--accent-soft);
      border-color: rgba(21, 91, 212, .22);
      color: var(--accent);
    }

    .ability-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ability-list {
      display: grid;
      gap: 6px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .ability-item {
      width: 100%;
      display: grid;
      gap: 5px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .72);
      padding: 9px 10px;
    }

    .ability-item.active,
    .ability-item:hover {
      background: #fff;
      border-color: var(--line-strong);
    }

    .ability-item strong {
      font-size: 12px;
      font-weight: 780;
      overflow-wrap: anywhere;
    }

    .ability-item span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .ability-editor {
      display: grid;
      gap: 12px;
      padding-top: 2px;
    }

    .ability-editor .field-grid {
      grid-template-columns: 1fr;
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 78px minmax(0, 1fr);
      }
      .sidebar {
        padding-inline: 10px;
      }
      .brand-title,
      .nav-label,
      .nav-badge,
      .new-task span,
      .side-section,
      .side-foot {
        display: none;
      }
      .brand,
      .brand-main,
      .new-task,
      .nav button {
        justify-content: center;
      }
      .new-task {
        padding: 0;
      }
    }

    @media (max-width: 980px) {
      .workbench {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(620px, 1fr) minmax(420px, 48svh);
      }
      .inspector {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .center {
        overflow: visible;
      }
      .main {
        min-height: auto;
      }
      .skill-manager-body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(230px, 34svh) minmax(520px, 1fr);
      }
      .schema-list-head {
        display: none;
      }
      .schema-row-head,
      .schema-row-grid,
      .schema-root {
        grid-template-columns: 1fr;
      }
      .schema-row-head .field label {
        display: block;
      }
      .schema-row .check-field {
        justify-content: flex-start;
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        min-height: auto;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: auto;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }
      .brand-title,
      .new-task span {
        display: grid;
      }
      .nav,
      .side-section,
      .side-foot {
        display: none;
      }
      .new-task {
        min-height: 36px;
        padding: 0 12px;
      }
      .topbar {
        height: auto;
        min-height: var(--topbar-h);
        align-items: stretch;
        flex-direction: column;
        padding: 10px 12px;
      }
      .topbar-left,
      .topbar-right {
        width: 100%;
      }
      .topbar-right select,
      .topbar-right input {
        flex: 1 1 140px;
        min-width: 0;
      }
      .center {
        padding: 18px 14px 16px;
      }
      .intro-head {
        display: grid;
      }
      .intro-title h1 {
        font-size: 28px;
      }
      .message {
        grid-template-columns: 54px minmax(0, 1fr);
      }
      .composer-bar {
        align-items: stretch;
        flex-direction: column;
      }
      .composer-actions {
        justify-content: space-between;
      }
      .capability-picker {
        padding: 0 12px max(12px, env(safe-area-inset-bottom));
      }
      .capability-picker-panel {
        width: calc(100vw - 24px);
        max-height: 76vh;
      }
      .skill-manager-head,
      .skill-editor-head,
      .file-editor-head {
        display: grid;
      }
      .field-grid {
        grid-template-columns: 1fr;
      }
    }

    .file-input-proxy {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-main">
          <div class="brand-mark">JL</div>
          <div class="brand-title">
            <strong>JetLinks Agent</strong>
            <span>Runtime v2</span>
          </div>
        </div>
        <button class="icon-btn" type="button" title="折叠">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
      </div>

      <button id="newThread" class="new-task" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span>新建任务</span>
      </button>

      <nav class="nav" aria-label="主导航">
        <button class="active" type="button" data-view="chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>
          <span class="nav-label">进入聊天</span>
        </button>
        <button type="button" data-view="apps">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4z"></path><path d="M13 4h7v7h-7z"></path><path d="M4 13h7v7H4z"></path><path d="M13 13h7v7h-7z"></path></svg>
          <span class="nav-label">应用中心</span>
        </button>
        <button type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15l3-3 3 2 5-6"></path></svg>
          <span class="nav-label">运行详情</span>
        </button>
        <button type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span class="nav-label">评估</span>
          <span class="nav-badge">v2</span>
        </button>
        <button type="button" data-view="skills">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20"></path><path d="M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1"></path></svg>
          <span class="nav-label">Skills 技能</span>
        </button>
        <button type="button" data-view="tools">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l3 3-7 7H7v-3z"></path><path d="M16 5l3 3"></path><path d="M4 20h16"></path></svg>
          <span class="nav-label">Tools 工具</span>
        </button>
        <button type="button" data-view="workflows">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h7v7H4z"></path><path d="M13 11h7v7h-7z"></path><path d="M11 9l2 2"></path></svg>
          <span class="nav-label">Workflows 插件</span>
        </button>
        <button type="button" data-view="cron">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span class="nav-label">Cron 计划</span>
        </button>
        <a href="/static/api-docs.html" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h11v18H6a2 2 0 0 1-2-1.5z"></path><path d="M8 7h5M8 11h5M8 15h4"></path></svg>
          <span class="nav-label">接口文档</span>
        </a>
      </nav>

      <section class="side-section">
        <div class="side-title">Agents</div>
        <div id="agentList" class="side-list"></div>
      </section>

      <div class="side-foot">
        <div class="admin-token-panel">
          <label for="adminToken">Admin Token</label>
          <div class="admin-token-row">
            <input id="adminToken" type="password" placeholder="RUNTIME_API_TOKEN" autocomplete="off">
            <button id="saveAdminToken" type="button">保存</button>
            <button id="clearAdminToken" type="button">清除</button>
          </div>
          <div id="adminTokenStatus" class="admin-token-status">未设置时仅可使用未加锁环境</div>
        </div>
        <div>当前线程</div>
        <div id="threadMini" class="thread-mini">local</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span id="activeAgentLabel">default</span>
          <button id="sandboxStatus" class="sandbox-pill pending" type="button" title="刷新沙盒状态">
            <span class="status-dot"></span>
            <span class="sandbox-label">Sandbox 检测中</span>
          </button>
        </div>
        <div class="topbar-right">
          <select id="agent" aria-label="Agent"></select>
          <select id="transport" aria-label="Transport">
            <option value="acp-ws" selected>ACP WS 优先</option>
            <option value="sse">SSE 备用</option>
          </select>
          <input id="thread" type="text" placeholder="thread id" aria-label="Thread ID">
          <button id="refresh" class="ghost-btn" type="button">刷新输出</button>
        </div>
      </header>

      <section class="workbench">
        <section id="centerPane" class="center">
          <div id="intro" class="intro">
            <div class="intro-head">
              <div class="intro-title">
                <h1>JetLinks Agent</h1>
                <p>中间处理对话与任务，右侧同步显示图片、产物文件、Spec 和校验结果。</p>
              </div>
              <div id="runStatus" class="status-pill">
                <span class="status-dot"></span>
                <span>Ready</span>
              </div>
            </div>
            <div class="module-tabs" aria-label="功能分类">
              <button class="active" type="button" data-view="chat">智能体</button>
              <button type="button" data-view="skills">技能</button>
              <button type="button" data-view="workflows">Workflow</button>
              <button type="button" data-view="apps">应用</button>
              <button type="button" data-view="cron">计划</button>
            </div>
          </div>

          <div id="skillStrip" class="skill-strip">
            <div class="mode-row">
              <button class="tool-pill" type="button" data-view="skills">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"></path></svg>
                <span>技能</span>
              </button>
              <button class="tool-pill active" type="button" data-agent-select="default">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path></svg>
                <span>智能体</span>
              </button>

    };

    uploadController = window.createWorkbenchUploadController({
      state,
      els,
      config: {
        maxUploadBytes: MAX_CHAT_UPLOAD_BYTES,
        uploadConcurrency: CHAT_UPLOAD_CONCURRENCY,
        uploadTimeoutMs: CHAT_UPLOAD_TIMEOUT_MS
      },

        addTimeline,
        ensureThread,
        finishAssistantMessage
      },
