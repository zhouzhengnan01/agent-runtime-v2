              <div class="field">
                <label for="skillRequestSchema">请求协议</label>
                <input id="skillRequestSchema" name="request_schema_version" value="${escapeAttr(sandbox.request_schema_version || 'skill-run.v1')}">

                <label for="skillFallback">失败回退</label>
                <select id="skillFallback" name="fallback_to_local">
                  <option value="true" ${sandbox.fallback_to_local === true ? 'selected' : ''}>true</option>
                  <option value="false" ${sandbox.fallback_to_local === false ? 'selected' : ''}>false</option>
                  <option value="null" ${sandbox.fallback_to_local == null ? 'selected' : ''}>null</option>
                </select>
              </div>

              <label for="skillAdapterCommand">Adapter Command</label>
              <input id="skillAdapterCommand" name="adapter_command" value="${escapeAttr(sandbox.adapter_command || '')}">
            </div>
          </section>

            <h3 class="skill-form-section-title">Schema</h3>

              <div class="field">
                <label for="skillInputSchema">Input Schema</label>
                <textarea id="skillInputSchema" class="code" name="input_schema">${escapeHtml(JSON.stringify(skill.input_schema || {}, null, 2))}</textarea>
              </div>
              <div class="field">
                <label for="skillOutputSchema">Output Schema</label>
                <textarea id="skillOutputSchema" class="code" name="output_schema">${escapeHtml(JSON.stringify(skill.output_schema || {}, null, 2))}</textarea>
              </div>
            </div>
          </section>

            <button class="primary-btn" type="button" data-skill-save>保存</button>
          </div>
        </form>
      `;
    }

    function collectSkillForm() {
      const form = document.getElementById('skillForm');
      if (!form || !state.selectedSkill) return null;
      const formData = new FormData(form);
      const inputSchema = parseJsonField(String(formData.get('input_schema') || '{}'), 'Input Schema');
      const outputSchema = parseJsonField(String(formData.get('output_schema') || '{}'), 'Output Schema');
      const fallback = String(formData.get('fallback_to_local') || 'null');
      return {
        ...skillManifestForSave(state.selectedSkill),
        name: state.selectedSkill.name,
        description: String(formData.get('description') || '').trim(),
        output_kind: String(formData.get('output_kind') || '').trim() || 'json',
        generation: formData.get('generation') === 'on',
        quality_template: splitQualityTemplate(String(formData.get('quality_template') || '')),
        input_schema: inputSchema,
        output_schema: outputSchema,
        sandbox: {
          enabled: formData.get('sandbox_enabled') === 'on',
          profile: nullableText(formData.get('sandbox_profile')),
          request_schema_version: String(formData.get('request_schema_version') || '').trim() || 'skill-run.v1',
          adapter_command: nullableText(formData.get('adapter_command')),
          fallback_to_local: fallback === 'null' ? null : fallback === 'true'
        }
      };
    }

    function splitQualityTemplate(value) {
      return String(value || '')
        .split(/[\n,，]/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function splitLines(value) {
      return String(value || '')
        .split('\n')
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function nullableText(value) {
      const text = String(value || '').trim();
      return text || null;
    }

    function parseJsonField(value, label) {
      try {
        const parsed = JSON.parse(value || '{}');
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
          throw new Error(`${label} 必须是 JSON 对象`);
        }
        return parsed;
      } catch (err) {
        throw new Error(`${label} 解析失败：${err.message}`);
      }
    }

    async function saveSelectedSkill() {
      if (!state.selectedSkillName) return;
      let manifest;
      try {
        manifest = collectSkillForm();
      } catch (err) {
        renderSkillEditor({ type: 'error', text: err.message });
        return;
      }
      renderSkillEditor({ text: '保存中' });
      const res = await fetch(apiUrl(`/api/skills/${encodeURIComponent(state.selectedSkillName)}`), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(manifest)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderSkillEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      state.selectedSkill = skillDetailPayload(data);
      state.selectedSkillName = data.name || state.selectedSkill.name || state.selectedSkillName;
      mergeSkillSummary(data);
      renderSkillList();
      renderSkillSummary();
      renderSkillEditor({ type: 'ok', text: '已保存' });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '已保存' });
    }

    function collectSkillPackageFile() {
      const textarea = document.getElementById('skillPackageFileContent');
      if (!textarea) return null;
      const fileId = state.selectedSkillFileId || selectedPackageFile(state.selectedSkill)?.id || 'manifest';
      if (!fileId) throw new Error('请选择要保存的 Skill 包文件');
      return { fileId, content: textarea.value };
    }

    async function saveSelectedSkillFile() {
      let file;
      try {
        file = collectSkillPackageFile();
      } catch (err) {
        renderSkillEditor({ type: 'error', text: err.message });
        return;
      }
      state.selectedSkillFileContent = file.content;
      renderSkillEditor({ text: '保存文件中' });
      const res = await fetch(apiUrl(`/api/skills/${encodeURIComponent(state.selectedSkillName)}/files/${encodeURIComponent(file.fileId)}`), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: file.content })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderSkillEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      if (data.skill) {
        state.selectedSkill = skillDetailPayload(data.skill);
        state.selectedSkillName = data.skill.name || state.selectedSkillName;
        mergeSkillSummary(data.skill);
      }
      state.selectedSkillFile = data.file || state.selectedSkillFile;
      state.selectedSkillFileId = data.file?.id || file.fileId;
      state.selectedSkillFileContent = typeof data.content === 'string' ? data.content : file.content;
      renderSkillList();
      renderSkillSummary();
      renderSkillEditor({ type: 'ok', text: '文件已保存' });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '文件已保存' });
    }

    function formatSelectedSkillFile() {
      const textarea = document.getElementById('skillPackageFileContent');
      if (!textarea) return;
      const packageFile = selectedPackageFile(state.selectedSkill);
      if (packageFile?.language !== 'json') return;
      try {
        const parsed = parseJsonField(textarea.value, packageFile.label || 'JSON 文件');
        textarea.value = `${JSON.stringify(parsed, null, 2)}\n`;
        state.selectedSkillFileContent = textarea.value;
        const status = document.getElementById('skillEditStatus');
        if (status) {
          status.className = 'skill-status ok';
          status.textContent = 'JSON 已格式化';
        }
      } catch (err) {
        state.selectedSkillFileContent = textarea.value;
        renderSkillEditor({ type: 'error', text: err.message });
      }
    }

    function updateNavigationState() {
      let inspectorShortcutActive = false;
      document.querySelectorAll('[data-inspector-tab]').forEach((item) => {
        const isActive = state.view === 'chat' && item.dataset.inspectorTab === state.activeTab;
        item.classList.toggle('active', isActive);
        inspectorShortcutActive = inspectorShortcutActive || isActive;
      });
      document.querySelectorAll('[data-view]').forEach((item) => {
        item.classList.toggle('active', item.dataset.view === state.view && !inspectorShortcutActive);
      });
    }

    function setView(view) {
      state.view = ['chat', 'skills', 'tools', 'workflows'].includes(view) ? view : 'chat';
      const isChat = state.view === 'chat';
      const isSkills = state.view === 'skills';
      const isTools = state.view === 'tools';
      const isWorkflows = state.view === 'workflows';
      els.workbench?.classList.toggle('manager-mode', !isChat);
      els.centerPane.classList.toggle('skills-mode', !isChat);
      els.intro.hidden = !isChat;
      els.skillStrip.hidden = !isChat;
      els.chatFrame.hidden = !isChat;
      els.composerWrap.hidden = !isChat;
      els.skillManager.hidden = !isSkills;
      els.toolsManager.hidden = !isTools;
      els.workflowManager.hidden = !isWorkflows;
      els.refresh.hidden = !isChat;
      updateNavigationState();
      if (isSkills) {
        state.activeTab = 'abilities';
        state.abilityMode = 'skills';
        document.querySelectorAll('.tab').forEach((item) => item.classList.toggle('active', item.dataset.tab === 'abilities'));
        renderPanel();
        loadAbilities().catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
          els.panel.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        });
      } else if (isTools) {
        state.activeTab = 'abilities';
        state.abilityMode = 'mcp';
        document.querySelectorAll('.tab').forEach((item) => item.classList.toggle('active', item.dataset.tab === 'abilities'));
        renderPanel();
        loadAbilities().catch((err) => {
          renderToolEditor({ type: 'error', text: err.message });
          els.panel.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        });
      } else if (isWorkflows) {
        state.activeTab = 'abilities';
        state.abilityMode = 'workflows';
        document.querySelectorAll('.tab').forEach((item) => item.classList.toggle('active', item.dataset.tab === 'abilities'));
        renderPanel();
        loadWorkflows().catch((err) => {
          renderWorkflowEditor({ type: 'error', text: err.message });
          els.panel.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        });
      }
    }

    async function loadAbilities() {
      await Promise.all([
        state.skillsLoaded ? Promise.resolve() : loadSkills({ showLoading: false }),
        state.mcpToolsLoaded ? Promise.resolve() : loadMcpTools({ showLoading: false }),
        state.workflowsLoaded ? Promise.resolve() : loadWorkflows()
      ]);
      if (state.activeTab === 'abilities') renderAbilityPanel();
    }

    async function loadWorkflows() {
      const res = await fetch(apiUrl('/api/workflows'), { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      state.workflows = data.workflows || [];
      state.workflowsLoaded = true;
      if (!state.selectedWorkflowName && state.workflows.length) {
        state.selectedWorkflowName = state.workflows[0].name;
      }
      renderWorkflowList();
      renderWorkflowSummary();
      renderWorkflowEditor();
      if (state.activeTab === 'abilities') renderAbilityPanel();
    }

    async function loadMcpTools() {
      const res = await fetch(apiUrl('/api/mcp/tools'), { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      state.mcpTools = data.tools || [];
      state.mcpToolsLoaded = true;
      if (state.selectedMcpToolName && !state.mcpTools.some((tool) => tool.name === state.selectedMcpToolName)) {
        state.selectedMcpToolName = null;
        state.selectedMcpTool = null;
      }
      if (!state.selectedMcpToolName && state.mcpTools.length) {
        state.selectedMcpToolName = state.mcpTools[0].name;
      }
      if (state.selectedMcpToolName) {
        state.selectedMcpTool = state.mcpTools.find((tool) => tool.name === state.selectedMcpToolName) || null;
      }
      renderToolList();
      renderToolSummary();
      renderToolEditor();
    }

    function renderToolSummary() {
      if (!els.toolSummary) return;
      const enabledCount = state.mcpTools.filter((tool) => tool.enabled).length;
      els.toolSummary.textContent = `${state.mcpTools.length} 个手动 MCP 配置 · ${enabledCount} 个启用。Skill、本地文件和记忆是 agent loop 内置能力，不算手动 MCP。`;
    }

    function renderToolList() {
      if (!els.toolList) return;
      const tools = filteredMcpTools();
      if (!tools.length) {
        els.toolList.innerHTML = `
          <div class="tool-note">
            <strong>这里现在只显示你手动配置的 MCP 工具</strong>
            Skill、本地文件、记忆等能力由 agent runtime 内置注册，不是你接入的外部 MCP Server。
          </div>
          <div class="empty-panel">${state.mcpTools.length ? '暂无匹配 MCP 工具' : '暂无手动 MCP 工具'}</div>
        `;
        return;
      }
      const groups = groupMcpTools(tools);
      els.toolList.innerHTML = groups.map((group) => `
        <section class="skill-group">
          <div class="skill-group-title">${escapeHtml(group.label)} · ${group.items.length}</div>
          ${group.items.map((tool) => `
            <button class="skill-row ${tool.name === state.selectedMcpToolName ? 'active' : ''}" type="button" data-tool-select="${escapeAttr(tool.name)}">
              <div class="skill-row-main">
                <strong>${escapeHtml(tool.name)}</strong>
                <span class="skill-badge ${tool.enabled ? '' : 'local'}">${tool.enabled ? 'enabled' : 'disabled'}</span>
              </div>
              <p>${escapeHtml(tool.description || '')}</p>
              <div class="skill-badges">
                <span class="skill-badge ${toolSourceType(tool) === 'skill' ? 'sandbox' : ''}">${escapeHtml(toolSourceLabel(tool))}</span>
                ${tool.editable === false ? '<span class="skill-badge local">只读</span>' : '<span class="skill-badge">可编辑</span>'}
              </div>
            </button>
          `).join('')}
        </section>
      `).join('');
    }

    function filteredMcpTools() {
      const tools = [...state.mcpTools];
      if (state.selectedMcpTool && !tools.some((tool) => tool.name === state.selectedMcpTool.name)) {
        tools.push(state.selectedMcpTool);
      }
      const sorted = tools.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      if (state.toolFilter === 'enabled') return sorted.filter((tool) => tool.enabled);
      if (state.toolFilter === 'disabled') return sorted.filter((tool) => !tool.enabled);
      return sorted;
    }

    function groupMcpTools(tools) {
      const labels = {
        manual: '手动 MCP 工具'
      };
      const map = new Map();
      tools.forEach((tool) => {
        const key = toolSourceType(tool);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(tool);
      });
      return [...map.entries()].map(([key, items]) => ({ key, label: labels[key] || key, items }));
    }

    function toolSourceType(tool) {
      return tool?.source?.type || 'manual';
    }

    function toolSourceLabel(tool) {
      const labels = {
        manual: '手动 MCP'
      };
      return labels[toolSourceType(tool)] || toolSourceType(tool);
    }

    function renderWorkflowSummary() {
      if (!els.workflowSummary) return;
      els.workflowSummary.textContent = `${state.workflows.length} 个注册插件 · 默认不自动触发 · 仅显式选择时运行`;
    }

    function renderWorkflowList() {
      if (!els.workflowList) return;
      const workflows = filteredWorkflows();
      if (!workflows.length) {
        els.workflowList.innerHTML = '<div class="empty-panel">暂无匹配 Workflow</div>';
        return;
      }
      els.workflowList.innerHTML = workflows.map((workflow) => `
        <button class="skill-row ${workflow.name === state.selectedWorkflowName ? 'active' : ''}" type="button" data-workflow-select-row="${escapeAttr(workflow.name)}">
          <div class="skill-row-main">
            <strong>${escapeHtml(workflow.name)}</strong>
            <span class="skill-badge sandbox">explicit</span>
          </div>
          <p>${escapeHtml(workflow.description || '')}</p>
          <div class="skill-badges">
            <span class="skill-badge local">plugin</span>
            <span class="skill-badge">${escapeHtml(workflow.enabled ? 'enabled' : 'disabled')}</span>
          </div>
        </button>
      `).join('');
    }

    function filteredWorkflows() {
      const sorted = [...state.workflows].sort((a, b) => String(a.name).localeCompare(String(b.name)));
      if (state.workflowFilter === 'artifact') return sorted.filter((workflow) => workflow.name.includes('artifact'));
      if (state.workflowFilter === 'evidence') return sorted.filter((workflow) => workflow.name.includes('evidence'));
      return sorted;
    }

    function renderWorkflowEditor(status = {}) {
      if (!els.workflowEditor) return;
      const workflow = state.workflows.find((item) => item.name === state.selectedWorkflowName);
      if (!workflow) {
        els.workflowEditor.innerHTML = '<div class="empty-panel">选择左侧 Workflow 插件</div>';
        return;
      }
      els.workflowEditor.innerHTML = `
        <div class="skill-editor-head">
          <div class="skill-editor-title">
            <strong>${escapeHtml(workflow.name)}</strong>
            <span>WorkflowRegistry builtin plugin</span>
          </div>
          <div class="skill-status ${status.type || ''}">${escapeHtml(status.text || '')}</div>
        </div>
        <section class="file-editor">
          <div class="file-editor-head">
            <div class="file-editor-title">
              <strong>触发方式</strong>
              <span>Workflow 不参与默认路由；只有请求显式带 runtime_options.workflow 才会运行。</span>
            </div>

    function mcpToolForSave(tool) {
      const { editable, ...payload } = tool || {};
      return payload;
    }

    function mcpToolSourceText(tool) {
      return `${JSON.stringify(mcpToolForSave(tool), null, 2)}\n`;
    }

    function mcpToolSourceKind(tool) {
      return tool?.source?.type === 'mcp_stdio' ? 'mcp_stdio' : 'manual';
    }

    function mcpSourceFromForm(formData) {
      const sourceType = String(formData.get('source_type') || 'manual').trim();
      if (sourceType === 'mcp_stdio') {
        return {
          type: 'mcp_stdio',
          server: String(formData.get('server') || '').trim(),
          command: String(formData.get('command') || '').trim(),
          args: splitLines(String(formData.get('args') || '')),
          server_tool: String(formData.get('server_tool') || '').trim(),
          cwd: String(formData.get('cwd') || '').trim() || '.',
          timeout_seconds: Number.parseInt(String(formData.get('timeout_seconds') || '20'), 10) || 20
        };
      }
      return { type: 'manual', response_template: String(formData.get('response_template') || '').trim() };
    }

    async function uploadSkillPlugin(file) {
      if (!file) return;
      const formData = new FormData();
      formData.append('file', file);
      renderSkillEditor({ type: '', text: '正在上传 Skill 插件...' });
      const res = await fetch(apiUrl('/api/skills/plugins'), {
        method: 'POST',
        body: formData
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderSkillEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      const names = data.plugin?.skills || [];
      state.skillsLoaded = false;
      state.mcpToolsLoaded = false;
      await Promise.all([loadSkills({ showLoading: false }), loadMcpTools({ showLoading: false })]);
      if (names.length) {
        state.selectedSkillName = names[0];
        await loadSkillDetail(names[0], { showLoading: false });
      }
      renderSkillEditor({ type: 'ok', text: `插件已安装：${data.plugin?.id || file.name}` });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: `插件已安装：${data.plugin?.id || file.name}` });
    }

    async function saveAbilitySkill() {
      const form = document.getElementById('abilitySkillForm');
      if (!form) return;
      let manifest;
      try {
        const formData = new FormData(form);
        const name = String(formData.get('name') || '').trim();
        manifest = {
          name,
          description: String(formData.get('description') || '').trim(),
          output_kind: String(formData.get('output_kind') || 'json').trim() || 'json',
          generation: formData.get('generation') === 'on',
          quality_template: splitQualityTemplate(String(formData.get('quality_template') || '')),
          input_schema: parseJsonField(String(formData.get('input_schema') || '{}'), 'Input Schema'),
          output_schema: parseJsonField(String(formData.get('output_schema') || '{}'), 'Output Schema'),
          sandbox: {
            enabled: formData.get('sandbox_enabled') === 'on',
            profile: nullableText(formData.get('sandbox_profile')),
            request_schema_version: 'skill-run.v1',
            fallback_to_local: true
          }
        };
        if (!name) throw new Error('技能名称不能为空');
      } catch (err) {
        renderAbilityPanel({ type: 'error', text: err.message });
        return;
      }
      const res = await fetch(apiUrl(`/api/skills/${encodeURIComponent(manifest.name)}`), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(manifest)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderAbilityPanel({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      state.selectedSkillName = data.name;
      state.selectedSkill = skillDetailPayload(data);
      mergeSkillSummary(data);
      renderSkillList();
      renderSkillSummary();
      renderSkillEditor({ type: 'ok', text: '技能已保存' });
      renderAbilityPanel({ type: 'ok', text: '技能已保存' });
    }

    async function saveAbilityMcpTool() {
      const form = document.getElementById('abilityMcpForm');
      if (!form) return;
      let tool;
      try {
        const formData = new FormData(form);
        const name = String(formData.get('name') || state.selectedMcpToolName || '').trim();
        if (!name) throw new Error('MCP 工具名称不能为空');
        tool = {
          name,
          title: String(formData.get('title') || name).trim(),
          description: String(formData.get('description') || '').trim(),
          enabled: formData.get('enabled') === 'on',
          input_schema: parseJsonField(String(formData.get('input_schema') || '{}'), 'Input Schema'),
          output_schema: parseJsonField(String(formData.get('output_schema') || '{}'), 'Output Schema'),
          source: mcpSourceFromForm(formData)
        };
      } catch (err) {
        renderAbilityPanel({ type: 'error', text: err.message });
        return;
      }
      const res = await fetch(apiUrl(`/api/mcp/tools/${encodeURIComponent(tool.name)}`), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(tool)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderAbilityPanel({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      state.selectedMcpToolName = data.name;
      state.selectedMcpTool = data;
      const index = state.mcpTools.findIndex((item) => item.name === data.name);
      if (index >= 0) state.mcpTools[index] = data;
      else state.mcpTools.push(data);
      renderToolList();
      renderToolSummary();
      renderToolEditor({ type: 'ok', text: 'MCP 工具已保存' });
      renderAbilityPanel({ type: 'ok', text: 'MCP 工具已保存' });
    }

    function collectToolForm() {
      const form = document.getElementById('toolForm');
      if (!form) return null;
      const formData = new FormData(form);
      const name = String(formData.get('name') || state.selectedMcpToolName || '').trim();
      if (!name) throw new Error('MCP 工具名称不能为空');
      return {
        name,
        title: String(formData.get('title') || name).trim(),
        description: String(formData.get('description') || '').trim(),
        enabled: formData.get('enabled') === 'on',
        input_schema: parseJsonField(String(formData.get('input_schema') || '{}'), 'Input Schema'),
        output_schema: parseJsonField(String(formData.get('output_schema') || '{}'), 'Output Schema'),
        source: mcpSourceFromForm(formData)
      };

        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },

      });

    async function loadSandboxStatus() {
      renderSandboxStatus({
        provider: 'local',
        available: false,
        configured: true,
        message: 'Checking sandbox status.'
      }, true);
      try {
        const res = await fetch(apiUrl('/api/sandbox/status'), { cache: 'no-store' });
        if (!res.ok) throw new Error(res.statusText || `HTTP ${res.status}`);
        state.sandboxStatus = await res.json();
      } catch (err) {
        state.sandboxStatus = {
          provider: 'local',
          available: false,
          configured: false,
          message: `沙盒状态获取失败：${err.message}`
        };
      }
      renderSandboxStatus(state.sandboxStatus);
    }

    function renderSandboxStatus(status, pending = false) {
      if (!els.sandboxStatus) return;
      const label = sandboxStatusLabel(status, pending);
      const statusClass = pending
        ? 'pending'
        : status.available ? 'available' : status.configured === false ? 'error' : 'unavailable';
      els.sandboxStatus.className = `sandbox-pill ${statusClass}`;
      els.sandboxStatus.innerHTML = `
        <span class="status-dot"></span>
        <span class="sandbox-label">${escapeHtml(label)}</span>
      `;
      const details = [status.message || '']
        .concat(status.routing_mode === 'selective' ? ['策略：仅配置的技能按需进入沙盒'] : [])
        .concat(status.executor_enabled ? ['执行器：已启用'] : ['执行器：未启用，仅展示策略'])
        .concat(status.sandboxed_skills?.length ? [`沙盒技能：${status.sandboxed_skills.join(', ')}`] : [])
        .concat(Object.keys(status.skill_profiles || {}).length ? [`技能 Profile：${Object.entries(status.skill_profiles).map(([skill, profile]) => `${skill}->${profile}`).join(', ')}`] : [])
        .concat(status.policy_error ? [`配置问题：${status.policy_error}`] : [])
        .concat(status.server_url ? [`Server: ${status.server_url}`] : [])
        .concat(status.image ? [`Image: ${status.image}`] : []);
      els.sandboxStatus.title = details.filter(Boolean).join('\n') || '刷新沙盒状态';
    }

    function sandboxStatusLabel(status, pending) {
      if (pending) return 'Sandbox 检测中';
      if (status.provider === 'opensandbox') {
        return status.available ? 'OpenSandbox 按需已连' : 'OpenSandbox 按需未连';
      }
      if (status.configured === false) return 'Sandbox 配置异常';
      return 'Sandbox 按需本地';
    }

    function sandboxPolicyText(data) {
      const profile = data.profile_name ? `profile: ${data.profile_name}` : '未配置 profile';
      if (data.use_sandbox) {
        return `${profile} · ${data.provider || 'opensandbox'} · ${data.profile?.image || ''}`;
      }
      if (data.eligible) {
        return `${profile} · 本地执行 · ${data.reason || ''}`;
      }
      return `本地执行 · ${data.reason || '未命中沙盒策略'}`;
    }

    function selectedCapabilityContext() {
      const lines = [];
      if (state.selectedChatSkills.length) lines.push(`Selected Skills: ${state.selectedChatSkills.join(', ')}`);
      if (state.selectedChatMcpTools.length) lines.push(`Selected MCP Tools: ${state.selectedChatMcpTools.join(', ')}`);
      return lines.length ? `\n\n[Workbench selected capabilities]\n${lines.join('\n')}` : '';
    }

    function applyCapabilityContext(messages) {
      const context = selectedCapabilityContext();
      if (!context) return messages;
      const copy = messages.map((message) => ({ ...message }));
      for (let index = copy.length - 1; index >= 0; index -= 1) {
        if (copy[index].role === 'user') {
          copy[index].content += context;
          break;
        }
      }
      return copy;
    }

    function agentFromSelectedCapabilities() {
      if (state.selectedChatSkills.includes('behavior-detection')) return 'behavior-detector';
      const generationSkill = state.selectedChatSkills.some((name) => /drawio|pptx|excel|xmind|markdown|deliverables|export|generation|rendering/.test(name));
      return generationSkill ? 'artifact-generator' : null;
    }

    async function send() {
      const content = els.input.value.trim();
      if (!content || state.running) return;
      els.input.value = '';
      addMessage('user', content);
      const outboundMessages = applyCapabilityContext(state.messages
        .filter((message) => !message.streaming)
        .map(({ role, content }) => ({ role, content })));
      beginAssistantMessage();
      const requestAgent = state.nextAgentOverride || agentFromSelectedCapabilities() || els.agent.value;
      const requestWorkflow = state.nextWorkflowOverride || state.selectedChatWorkflow;
      state.timeline = [];
      state.artifacts = [];
      state.verification = null;
      state.spec = null;
      state.finalResultApplied = false;
      state.running = true;
      setBusy(true);
      renderPanel();

      try {
        const threadId = ensureThread();
        const attachments = await Promise.all(state.files.map(fileToAttachment));
        if (els.transport.value === 'acp-ws') {
          try {
            await sendViaAcpWs(requestAgent, content, threadId, attachments, outboundMessages, requestWorkflow);
          } catch (err) {
            if (!shouldFallbackToSse(err)) throw err;
            addTimeline('连接降级', 'ACP WS 已断开，切换 SSE');
            setAssistantProgress('WebSocket 断开，正在切换 SSE 通道…');
            if (state.activeAssistantIndex !== null && state.messages[state.activeAssistantIndex]) {
              state.messages[state.activeAssistantIndex].content = '';
              state.messages[state.activeAssistantIndex].progress = true;
            }
            await sendViaSse(requestAgent, threadId, attachments, outboundMessages, requestWorkflow);
          }
          return;
        }
        await sendViaSse(requestAgent, threadId, attachments, outboundMessages, requestWorkflow);
      } catch (err) {
        finishAssistantMessage(`请求失败：${err.message}`);
      } finally {
        if (state.activeAssistantIndex !== null) finishAssistantMessage();
        state.nextAgentOverride = null;
        state.nextWorkflowOverride = null;
        state.running = false;
        state.files = [];
        setBusy(false);
        renderAttachments();
        renderRouteHint();
        renderPanel();
      }
    }

    function shouldFallbackToSse(error) {
      const message = String(error?.message || '');
      return message.includes('code 1012') || message.includes('ACP WS 连接已关闭') || message.includes('ACP WS 连接异常');
    }

    function buildRuntimeOptions(threadId, workflow) {
      const runtimeOptions = {
        thread_id: threadId,
        selected_skills: [...state.selectedChatSkills],
        selected_mcp_tools: [...state.selectedChatMcpTools]
      };
      if (workflow) runtimeOptions.workflow = workflow;
      return runtimeOptions;
    }

    function buildAcpRuntimeOptions(threadId, workflow) {
      const runtimeOptions = {
        threadId,
        selectedSkills: [...state.selectedChatSkills],
        selectedMcpTools: [...state.selectedChatMcpTools]
      };
      if (workflow) runtimeOptions.workflow = workflow;
      return runtimeOptions;
    }

    async function sendViaSse(agentName, threadId, attachments, messages, workflow) {
      const runtimeOptions = buildRuntimeOptions(threadId, workflow);
      const res = await fetch(apiUrl(`/api/agents/${agentName}/runs/stream`), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages,
          attachments,
          runtime_options: runtimeOptions
        })
      });
      if (!res.ok || !res.body) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || res.statusText);
      }
      await readEventStream(res.body);
    }

    async function sendViaAcpWs(agentName, content, threadId, attachments, messages, workflow) {
      const ws = await openAcpSocket();
      const pending = new Map();
      let closeExpected = false;

      const rejectPending = (error) => {
        pending.forEach((request) => request.reject(error));
        pending.clear();
      };

      ws.onmessage = (message) => {
        let packet;
        try {
          packet = JSON.parse(message.data);
        } catch {
          rejectPending(new Error('ACP WS 返回了无法解析的消息'));
          ws.close();
          return;
        }
        if (packet.method === 'session/update') {
          handleAcpUpdate(packet.params);
          return;
        }
        if (packet.id != null && pending.has(packet.id)) {
          const request = pending.get(packet.id);
          pending.delete(packet.id);
          if (packet.error) request.reject(new Error(packet.error.message || 'ACP WS error'));
          else request.resolve(packet.result);
        }
      };
      ws.onerror = () => rejectPending(new Error('ACP WS 连接异常'));
      ws.onclose = (event) => {
        if (!pending.size) return;
        const detail = event.reason || `code ${event.code}`;
        const prefix = closeExpected ? 'ACP WS 请求未完成' : 'ACP WS 连接已关闭';
        rejectPending(new Error(`${prefix}：${detail}`));
      };

      const rpc = (method, params = {}) => {
        if (ws.readyState !== WebSocket.OPEN) {
          return Promise.reject(new Error('ACP WS 未连接'));
        }
        const id = ++state.rpcId;
        const payload = { jsonrpc: '2.0', id, method, params };
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          try {
            ws.send(JSON.stringify(payload));
          } catch (err) {
            pending.delete(id);
            reject(err);
          }
        });
      };

      try {
        await rpc('initialize', {
          protocolVersion: 1,
          clientInfo: { name: 'jetlinks-workbench', version: '0.1.0' }
        });
        const session = await rpc('new_session', {
          cwd: '/',
          agentName: agentName,
          threadId
        });
        const runtimeOptions = buildAcpRuntimeOptions(threadId, workflow);
        const promptResult = await rpc('prompt', {
          sessionId: session.sessionId,
          agentName: agentName,
          threadId,
          prompt: [{ type: 'text', text: content }],
          messages,
          attachments,
          runtimeOptions
        });
        if (promptResult?.result && !state.finalResultApplied) {
          applyFinalResult(promptResult.result);
        }
      } finally {
        closeExpected = true;
        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
          ws.close();
        }
      }
    }

    function openAcpSocket() {
      const url = websocketUrl('/api/acp/ws');
      return new Promise((resolve, reject) => {
        const ws = new WebSocket(url, 'acp.v1');
        let settled = false;
        const fail = (message) => {
          if (settled) return;
          settled = true;
          reject(new Error(message));
        };
        ws.onopen = () => {
          settled = true;
          resolve(ws);
        };
        ws.onerror = () => fail('ACP WS 连接失败');
        ws.onclose = (event) => fail(`ACP WS 连接关闭：${event.reason || `code ${event.code}`}`);
      });
    }

    function handleAcpUpdate(params) {
      const event = params?.update?._meta?.jetlinksRuntimeEvent;
      if (event) handleEvent(event);
    }

    async function readEventStream(body) {
      const reader = body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split('\n\n');
        buffer = frames.pop() || '';
        for (const frame of frames) {
          const event = parseSseFrame(frame);
          if (event) handleEvent(event);
        }
      }
      if (buffer.trim()) {
        const event = parseSseFrame(buffer);
        if (event) handleEvent(event);
      }
    }

    function parseSseFrame(frame) {
      const dataLines = frame.split('\n').filter((line) => line.startsWith('data:'));
      if (!dataLines.length) return null;
      const raw = dataLines.map((line) => line.slice(5).trimStart()).join('\n');
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function handleEvent(event) {
      const data = event.data || {};
      switch (event.type) {
        case 'run.started':
          setAssistantProgress('任务已启动，正在准备上下文…');
          addTimeline('启动', `${data.workflow || 'workflow'} · ${data.thread_id || ''}`);
          break;
        case 'spec.started':
          setAssistantProgress('正在理解需求并选择可用技能…');
          addTimeline('理解需求', `${data.allowed_skills?.length || 0} 个可用技能`);
          break;
        case 'direct_skill.started':
          setAssistantProgress('已锁定显式选择的 Skill，正在规划执行参数…');
          addTimeline('显式 Skill', data.skill_name || '');
          break;
        case 'spec.planner.started':
          setAssistantProgress('正在调用大模型规划图结构…');
          addTimeline('大模型规划', data.skill_name || '');
          break;
        case 'spec.planner.completed':
          setAssistantProgress('规划完成，正在整理结构化 Spec…');
          addTimeline('规划完成', data.enabled ? `${data.model || 'LLM'} · ${data.mode || ''}` : `本地兜底 · ${data.reason || ''}`);
          break;
        case 'spec.planner.failed':
          addTimeline('规划降级', data.error || 'fallback');
          break;
        case 'spec.completed':
          state.spec = data.spec || null;
          addTimeline('生成 Spec', data.skill_name || '');
          renderPanel();
          break;
        case 'skill.selected':
          addTimeline('选择技能', data.skill?.name || '');
          break;
        case 'sandbox.policy':
          addTimeline('沙盒策略', sandboxPolicyText(data));
          break;
        case 'sandbox.started':
          addTimeline('沙盒启动', `${data.profile_name || ''} · ${data.image || ''}`);
          break;
        case 'sandbox.completed':
          addTimeline('沙盒完成', `${data.output_count || 0} 个输出`);
          break;
        case 'sandbox.failed':
          addTimeline('沙盒失败', data.error || 'failed');
          break;
        case 'sandbox.fallback':
          addTimeline('沙盒降级', data.reason || 'fallback to local');
          break;
        case 'skill.started':
          setAssistantProgress('正在生成 Draw.io 源文件和 PNG 预览…');
          addTimeline('执行技能', `${data.skill_name || ''} · attempt ${data.attempt || 0}`);
          break;
        case 'skill.completed':
          addTimeline('技能完成', `${data.output_count || 0} 个输出`);
          break;
        case 'artifact.created':
          upsertArtifact(data.artifact);
          addTimeline('生成文件', data.artifact?.name || '');
          renderPanel();
          break;
        case 'preview.ready':
          upsertArtifact(data.artifact);
          renderPanel();
          break;
        case 'verifier.started':
          setAssistantProgress('正在校验生成文件…');
          addTimeline('开始校验', `retry ${data.retry_count || 0}`);
          break;
        case 'verifier.completed':
          state.verification = data.verification || null;
          addTimeline('校验完成', state.verification?.passed ? '通过' : '未通过');
          renderPanel();
          break;
        case 'retry.started':
          addTimeline('自动重试', (data.failed_checks || []).join(', '));
          break;
        case 'agent.message.delta':
          appendAssistantDelta(eventText(data));
          break;
        case 'agent.message':
          finishAssistantMessage(eventText(data));
          break;
        case 'run.completed':
          addTimeline('完成', 'completed');
          if (!state.finalResultApplied) applyFinalResult(data.result);
          break;
        case 'run.failed':
          addTimeline('失败', data.error || 'failed');
          if (data.result && !state.finalResultApplied) applyFinalResult(data.result);
          else if (data.error) finishAssistantMessage(`执行失败：${data.error}`);
          break;
      }
    }

    function eventText(data) {
      return data?.text || data?.message || '';
    }

    function applyFinalResult(result) {
      if (!result) return;
      state.finalResultApplied = true;
      if (result.reply) {
        const last = state.messages[state.messages.length - 1];
        if (!(last && last.role === 'assistant' && last.content === result.reply)) {
          finishAssistantMessage(result.reply);
        }
      }
      state.artifacts = result.artifacts || state.artifacts;
      state.verification = result.verification || state.verification;
      state.spec = result.spec || state.spec;
      renderPanel();
    }

    function upsertArtifact(artifact) {
      if (!artifact) return;
      const idx = state.artifacts.findIndex((item) => item.path === artifact.path);
      if (idx >= 0) state.artifacts[idx] = artifact;
      else state.artifacts.push(artifact);
    }

    async function refreshArtifacts() {
      const threadId = ensureThread();
      const res = await fetch(apiUrl(`/api/artifacts/${threadId}`));
      const data = await res.json();
      state.artifacts = data.artifacts || [];
      renderPanel();
    }

    async function preview(url, kind, target) {
      target.hidden = false;
      if (kind === 'image') {
        target.classList.add('image-preview');
        target.innerHTML = `<img src="${escapeAttr(url)}" alt="预览图">`;
        return;
      }
      target.classList.remove('image-preview');
      if (!['text', 'markdown'].includes(kind)) {
        target.innerHTML = '<pre>该文件为二进制产物，请下载后查看。</pre>';
        return;
      }
      const res = await fetch(artifactUrl(url));
      const text = await res.text();
      const clipped = text.slice(0, 24000);
      target.innerHTML = kind === 'markdown'
        ? `<div class="markdown-body">${renderMarkdown(clipped)}</div>`
        : `<pre>${escapeHtml(clipped)}</pre>`;
    }

    async function fileToAttachment(file) {
      const dataBase64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      return {
        name: file.name,
        mime_type: file.type || null,
        data_base64: dataBase64,
        metadata: { size: file.size }
      };
    }

    function setBusy(busy) {
      els.send.disabled = busy;
      els.attach.disabled = busy;
      els.send.classList.toggle('running', busy);
      els.send.innerHTML = busy
        ? '运行中'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>';
      els.runStatus.innerHTML = busy
        ? '<span class="status-dot" style="background: var(--orange); box-shadow: 0 0 0 3px rgba(173,101,22,.14);"></span><span>Running</span>'
        : '<span class="status-dot"></span><span>Ready</span>';
    }

    function setAgent(agentName) {
      if (!agentName) return;
      if ([...els.agent.options].some((option) => option.value === agentName)) {
        els.agent.value = agentName;
      }
      state.nextAgentOverride = null;
      state.nextWorkflowOverride = null;
      renderSelectedAgent();
    }

    function setNextAgentOverride(agentName, workflowName = null) {
      state.nextAgentOverride = agentName && agentName !== els.agent.value ? agentName : null;
      state.nextWorkflowOverride = workflowName || null;
      renderRouteHint();
    }

    function renderRouteHint() {
      if (!els.routeHint) return;
      const capabilityParts = [];
      if (state.selectedChatSkills.length) capabilityParts.push(`Skill ${state.selectedChatSkills.length}`);
      if (state.selectedChatMcpTools.length) capabilityParts.push(`MCP ${state.selectedChatMcpTools.length}`);
      const selectedWorkflow = state.nextWorkflowOverride || state.selectedChatWorkflow;
      if (selectedWorkflow) capabilityParts.push(`Workflow ${selectedWorkflow}`);
      if (capabilityParts.length) {
        els.routeHint.textContent = `能力：${capabilityParts.join(' · ')}`;
        els.routeHint.classList.add('active');
        return;
      }
      if (!state.nextAgentOverride) {
        els.routeHint.classList.remove('active');
        els.routeHint.textContent = '';
        return;
      }
      const agent = state.agents.find((item) => item.name === state.nextAgentOverride);
      els.routeHint.textContent = `本次：${agent?.display_name || state.nextAgentOverride}`;
      els.routeHint.classList.add('active');
    }

    function roleLabel(role) {
      if (role === 'user') return '你';
      if (role === 'assistant') return 'Agent';
      return role;
    }

    function renderMessageContent(message) {
      if (message.role === 'assistant') {
        if (message.streaming) {
          return `<div class="markdown-body streaming-text">${escapeHtml(message.content || '')}</div>`;
        }
        return `<div class="markdown-body">${renderMarkdown(message.content || '')}</div>`;
      }
      return `<div class="markdown-body">${escapeHtml(message.content || '')}</div>`;
    }

    function renderMarkdown(value) {
      const lines = String(value || '').replace(/\r\n/g, '\n').split('\n');
      const html = [];
      let paragraph = [];
      let listType = null;
      let inCode = false;
      let codeLines = [];

      const closeList = () => {
        if (listType) {
          html.push(`</${listType}>`);
          listType = null;
        }
      };
      const openList = (type) => {
        if (listType !== type) {
          closeList();
          html.push(`<${type}>`);
          listType = type;
        }
      };
      const flushParagraph = () => {
        if (!paragraph.length) return;
        html.push(`<p>${renderInlineMarkdown(paragraph.join(' '))}</p>`);
        paragraph = [];
      };
      const flushCode = () => {
        html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        codeLines = [];
      };

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        const trimmed = line.trim();

        if (trimmed.startsWith('```')) {
          if (inCode) {
            flushCode();
            inCode = false;
          } else {
            flushParagraph();
            closeList();
            inCode = true;
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        if (!trimmed) {
          flushParagraph();
          closeList();
          continue;
        }

        if (isTableRow(line) && isTableSeparator(lines[index + 1] || '')) {
          flushParagraph();
          closeList();
          const headers = splitTableRow(line);
          index += 2;
          const rows = [];
          while (index < lines.length && isTableRow(lines[index])) {
            rows.push(splitTableRow(lines[index]));
            index += 1;
          }
          index -= 1;
          html.push(renderMarkdownTable(headers, rows));
          continue;
        }

        const heading = /^(#{1,4})\s+(.+)$/.exec(trimmed);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const bullet = /^[-*]\s+(.+)$/.exec(trimmed);
        if (bullet) {
          flushParagraph();
          openList('ul');
          html.push(`<li>${renderInlineMarkdown(bullet[1])}</li>`);
          continue;
        }

        const ordered = /^\d+\.\s+(.+)$/.exec(trimmed);
        if (ordered) {
          flushParagraph();
          openList('ol');
          html.push(`<li>${renderInlineMarkdown(ordered[1])}</li>`);
          continue;
        }

        const quote = /^>\s?(.+)$/.exec(trimmed);
        if (quote) {
          flushParagraph();
          closeList();
          html.push(`<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`);
          continue;
        }

        paragraph.push(line);
      }

      if (inCode) flushCode();
      flushParagraph();
      closeList();
      return html.join('');
    }

    function renderInlineMarkdown(value) {
      return String(value || '').split(/(`[^`]*`)/g).map((part) => {
        if (part.startsWith('`') && part.endsWith('`')) {
          return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
        }
        let html = escapeHtml(part);
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_match, label, url) => {
          return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        });
        return html;
      }).join('');
    }

    function isTableRow(line) {
      return /^\s*\|.+\|\s*$/.test(line);
    }

    function isTableSeparator(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    }

    function splitTableRow(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim());
    }

    function renderMarkdownTable(headers, rows) {
      return `
        <table>
          <thead><tr>${headers.map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.map((row) => `<tr>${headers.map((_cell, index) => `<td>${renderInlineMarkdown(row[index] || '')}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("'", '&#39;');
    }

    function safeId(value) {
      return btoa(unescape(encodeURIComponent(value))).replaceAll('=', '');
    }

    function formatBytes(value) {
      const size = Number(value || 0);
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
      return `${(size / 1024 / 1024).toFixed(1)} MB`;
    }

    els.send.addEventListener('click', send);
    els.input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        send();
      }
    });
    els.attach.addEventListener('click', () => els.fileInput.click());
    els.fileInput.addEventListener('change', () => {
      state.files = [...els.fileInput.files];
      renderAttachments();
    });
    els.skillPluginInput.addEventListener('change', () => {
      const file = els.skillPluginInput.files?.[0];
      uploadSkillPlugin(file).catch((err) => {
        renderSkillEditor({ type: 'error', text: err.message });
      });
    });
    els.newThread.addEventListener('click', () => {
      els.thread.value = `local-${Date.now().toString(36)}`;
      els.threadMini.textContent = els.thread.value;
      state.messages = [];
      state.timeline = [];
      state.artifacts = [];
      state.verification = null;
      state.spec = null;
      state.files = [];
      state.selectedChatSkills = [];
      state.selectedChatMcpTools = [];
      state.selectedChatWorkflow = null;
      state.nextAgentOverride = null;
      state.nextWorkflowOverride = null;
      closeCapabilityPicker();
      state.activeAssistantIndex = null;
      state.finalResultApplied = false;
      if (state.messageUpdateFrame) {
        cancelAnimationFrame(state.messageUpdateFrame);
        state.messageUpdateFrame = 0;
      }
      state.pendingMessageIndexes.clear();
      els.fileInput.value = '';
      renderMessages();
      renderAttachments();
      renderComposerCapabilities();
      renderPanel();
    });
    els.thread.addEventListener('input', ensureThread);
    els.agent.addEventListener('change', renderSelectedAgent);
    els.refresh.addEventListener('click', refreshArtifacts);
    els.refreshTop.addEventListener('click', refreshArtifacts);
    els.sandboxStatus.addEventListener('click', loadSandboxStatus);
    els.refreshSkills.addEventListener('click', () => {
      state.skillsLoaded = false;
      loadSkills({ showLoading: false }).catch((err) => {
        renderSkillEditor({ type: 'error', text: err.message });
      });
    });
    els.refreshTools.addEventListener('click', () => {
      state.mcpToolsLoaded = false;
      loadMcpTools({ showLoading: false }).catch((err) => {
        renderToolEditor({ type: 'error', text: err.message });
      });
    });
    els.refreshWorkflows.addEventListener('click', () => {
      state.workflowsLoaded = false;
      loadWorkflows().catch((err) => {
        renderWorkflowEditor({ type: 'error', text: err.message });
      });
    });
    els.skillEditor.addEventListener('click', (event) => {
      const packageFileButton = event.target.closest('[data-skill-file]');
      if (packageFileButton && state.selectedSkillName) {
        loadSkillPackageFile(state.selectedSkillName, packageFileButton.dataset.skillFile, { showLoading: true }).catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
        return;
      }
      if (event.target.closest('[data-skill-save-file]')) {
        saveSelectedSkillFile();
        return;
      }
      if (event.target.closest('[data-skill-format-file]')) {
        formatSelectedSkillFile();
        return;
      }
      const saveButton = event.target.closest('[data-skill-save]');
      if (saveButton) {
        saveSelectedSkill();
        return;
      }
      const resetButton = event.target.closest('[data-skill-reset]');
      if (resetButton && state.selectedSkillName) {
        loadSkillDetail(state.selectedSkillName).catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
      }
    });
    els.toolEditor.addEventListener('click', (event) => {
      if (event.target.closest('[data-tool-save-file]')) {
        saveSelectedToolFile();
        return;
      }
      if (event.target.closest('[data-tool-format-file]')) {
        formatSelectedToolFile();
        return;
      }
      if (event.target.closest('[data-tool-save]')) {
        saveSelectedTool();
        return;
      }
      if (event.target.closest('[data-tool-reset]')) {
        loadMcpTools({ showLoading: false }).catch((err) => {
          renderToolEditor({ type: 'error', text: err.message });
        });
        return;
      }
      if (event.target.closest('[data-open-tool-skill]')) {
        const skillName = state.selectedMcpTool?.source?.skill_name || state.selectedMcpToolName;
        setView('skills');
        loadSkillDetail(skillName, { showLoading: false }).catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
      }
    });

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        activateInspectorTab(tab.dataset.tab);
      });
    });

    document.querySelectorAll('[data-view]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        if ((button.dataset.view || 'chat') === 'chat') {
          openInspectorTab('artifacts');
          return;
        }
        setView(button.dataset.view || 'chat');
      });
    });

    document.body.addEventListener('click', (event) => {
      if (event.target === els.capabilityPicker) {
        closeCapabilityPicker();
        return;
      }
      const capabilityOpenButton = event.target.closest('[data-capability-open]');
      if (capabilityOpenButton) {
        openCapabilityPicker(capabilityOpenButton.dataset.capabilityOpen || 'skills');
        return;
      }
      if (event.target.closest('[data-capability-close]')) {
        closeCapabilityPicker();
        return;
      }
      const removeCapabilityButton = event.target.closest('[data-remove-capability]');
      if (removeCapabilityButton) {
        removeCapability(removeCapabilityButton.dataset.removeCapability, removeCapabilityButton.dataset.name || '');
        return;
      }
      const chatSkillButton = event.target.closest('[data-chat-skill]');
      if (chatSkillButton) {
        toggleCapability('skill', chatSkillButton.dataset.chatSkill || '');
        return;
      }
      const chatMcpButton = event.target.closest('[data-chat-mcp]');
      if (chatMcpButton) {
        toggleCapability('mcp', chatMcpButton.dataset.chatMcp || '');
        return;
      }
      const chatWorkflowButton = event.target.closest('[data-chat-workflow]');
      if (chatWorkflowButton) {
        toggleCapability('workflow', chatWorkflowButton.dataset.chatWorkflow || '');
        return;
      }
      if (event.target.closest('[data-clear-workflow]')) {
        state.selectedChatWorkflow = null;
        renderComposerCapabilities();
        renderCapabilityPicker();
        return;
      }
      if (event.target.closest('[data-compose-add-skill]')) {
        closeCapabilityPicker();
        setView('skills');
        openSkillPluginUpload();
        return;
      }
      if (event.target.closest('[data-compose-add-mcp]')) {
        closeCapabilityPicker();
        addMcpToolDraft();
        setView('tools');
        return;
      }
      const composeManageButton = event.target.closest('[data-compose-manage]');
      if (composeManageButton) {
        closeCapabilityPicker();
        setView(composeManageButton.dataset.composeManage || 'chat');
        return;
      }
      const inspectorButton = event.target.closest('[data-inspector-tab]');
      if (inspectorButton) {
        openInspectorTab(inspectorButton.dataset.inspectorTab || 'artifacts');
        return;
      }
      const viewButton = event.target.closest('[data-view]');
      if (viewButton) {
        if ((viewButton.dataset.view || 'chat') === 'chat') {
          openInspectorTab('artifacts');
          return;
        }
        setView(viewButton.dataset.view || 'chat');
        return;
      }
      const skillFilterButton = event.target.closest('[data-skill-filter]');
      if (skillFilterButton) {
        state.skillFilter = skillFilterButton.dataset.skillFilter || 'all';
        document.querySelectorAll('[data-skill-filter]').forEach((item) => {
          item.classList.toggle('active', item.dataset.skillFilter === state.skillFilter);
        });
        renderSkillList();
        return;
      }
      const toolFilterButton = event.target.closest('[data-tool-filter]');
      if (toolFilterButton) {
        state.toolFilter = toolFilterButton.dataset.toolFilter || 'all';
        document.querySelectorAll('[data-tool-filter]').forEach((item) => {
          item.classList.toggle('active', item.dataset.toolFilter === state.toolFilter);
        });
        renderToolList();
        return;
      }
      const workflowFilterButton = event.target.closest('[data-workflow-filter]');
      if (workflowFilterButton) {
        state.workflowFilter = workflowFilterButton.dataset.workflowFilter || 'all';
        document.querySelectorAll('[data-workflow-filter]').forEach((item) => {
          item.classList.toggle('active', item.dataset.workflowFilter === state.workflowFilter);
        });
        renderWorkflowList();
        return;
      }
      const skillButton = event.target.closest('[data-skill-select]');
      if (skillButton) {
        loadSkillDetail(skillButton.dataset.skillSelect).catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
        return;
      }
      const toolButton = event.target.closest('[data-tool-select]');
      if (toolButton) {
        state.selectedMcpToolName = toolButton.dataset.toolSelect;
        state.selectedMcpTool = filteredMcpTools().find((tool) => tool.name === state.selectedMcpToolName)
          || state.mcpTools.find((tool) => tool.name === state.selectedMcpToolName)
          || null;
        renderToolList();
        renderToolEditor();
        return;
      }
      const workflowButton = event.target.closest('[data-workflow-select-row]');
      if (workflowButton) {
        state.selectedWorkflowName = workflowButton.dataset.workflowSelectRow;
        renderWorkflowList();
        renderWorkflowEditor();
        return;
      }
      const useWorkflowButton = event.target.closest('[data-workflow-use]');
      if (useWorkflowButton) {
        state.selectedChatWorkflow = useWorkflowButton.dataset.workflowUse || null;
        state.nextWorkflowOverride = null;
        renderComposerCapabilities();
        renderWorkflowEditor({ type: 'ok', text: '本轮将使用该 Workflow' });
        if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '本轮将使用该 Workflow' });
        setView('chat');
        return;
      }
      if (event.target.closest('[data-workflow-clear]')) {
        state.selectedChatWorkflow = null;
        state.nextWorkflowOverride = null;
        renderComposerCapabilities();
        renderWorkflowEditor({ type: 'ok', text: '本轮不使用 Workflow' });
        if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '本轮不使用 Workflow' });
        return;
      }
      const abilityModeButton = event.target.closest('[data-ability-mode]');
      if (abilityModeButton) {
        state.abilityMode = abilityModeButton.dataset.abilityMode || 'skills';
        renderAbilityPanel();
        return;
      }
      const abilitySkillButton = event.target.closest('[data-ability-skill]');
      if (abilitySkillButton) {
        state.selectedSkillName = abilitySkillButton.dataset.abilitySkill;
        state.selectedSkill = state.skills.find((skill) => skill.name === state.selectedSkillName) || null;
        renderAbilityPanel();
        loadSkillDetail(state.selectedSkillName, { showLoading: false }).catch((err) => {
          renderAbilityPanel({ type: 'error', text: err.message });
        });
        return;
      }
      const abilityMcpButton = event.target.closest('[data-ability-mcp]');
      if (abilityMcpButton) {
        state.selectedMcpToolName = abilityMcpButton.dataset.abilityMcp;
        state.selectedMcpTool = state.mcpTools.find((tool) => tool.name === state.selectedMcpToolName) || null;
        renderAbilityPanel();
        return;
      }
      const abilityWorkflowButton = event.target.closest('[data-ability-workflow]');
      if (abilityWorkflowButton) {
        state.selectedWorkflowName = abilityWorkflowButton.dataset.abilityWorkflow;
        renderWorkflowList();
        renderWorkflowEditor();
        renderAbilityPanel();
        return;
      }
      if (event.target.closest('[data-upload-skill-plugin]')) {
        setView('skills');
        openSkillPluginUpload();
        return;
      }
      if (event.target.closest('[data-add-mcp-tool]')) {
        addMcpToolDraft();
        return;
      }
      if (event.target.closest('[data-refresh-abilities]')) {
        state.skillsLoaded = false;
        state.mcpToolsLoaded = false;
        state.workflowsLoaded = false;
        loadAbilities().catch((err) => {
          els.panel.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        });
        return;
      }
      if (event.target.closest('[data-ability-save-skill]')) {
        saveAbilitySkill();
        return;
      }
      if (event.target.closest('[data-ability-save-mcp]')) {
        saveAbilityMcpTool();
        return;
      }
      const promptButton = event.target.closest('[data-prompt]');
      if (promptButton) {
        els.input.value = promptButton.dataset.prompt;
        setNextAgentOverride(promptButton.dataset.agentSelect || null);
        els.input.focus();
        return;
      }
      const agentButton = event.target.closest('[data-agent-select]');
      if (agentButton) {
        if (agentButton.dataset.workflowSelect) {
          setNextAgentOverride(agentButton.dataset.agentSelect || null, agentButton.dataset.workflowSelect);
          els.input.focus();
        } else {
          setAgent(agentButton.dataset.agentSelect);
        }
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.capabilityPickerMode) {
        closeCapabilityPicker();
      }
    });

    els.panel.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.download) {
        window.open(artifactUrl(button.dataset.download), '_blank');
        return;
      }
      if (button.dataset.preview) {
        const container = document.getElementById(`preview-${button.dataset.id}`);
        preview(artifactUrl(button.dataset.preview), button.dataset.kind, container);
      }
    });

    loadAgents();
    loadSandboxStatus();
    ensureThread();
    renderMessages();
    renderAttachments();
    renderComposerCapabilities();
    renderPanel();
    const initialView = new URLSearchParams(window.location.search).get('view');
    if (['skills', 'tools', 'workflows'].includes(initialView)) {
      setView(initialView);
    }
  </script>
</body>
</html>
