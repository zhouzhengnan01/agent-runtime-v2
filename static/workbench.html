    function collectCronForm() {
      const form = document.getElementById('cronForm');
      if (!form) return null;
      const formData = new FormData(form);
      const name = String(formData.get('name') || '').trim();
      if (!name) throw new Error('Cron 名称不能为空');
      const runtimeOptions = parseJsonField(String(formData.get('runtime_options') || '{}'), 'Runtime Options');
      return {
        name,
        job: {
          title: String(formData.get('title') || '').trim(),
          description: String(formData.get('description') || '').trim(),
          enabled: formData.get('enabled') === 'on',
          schedule: String(formData.get('schedule') || '').trim(),
          timezone: String(formData.get('timezone') || '').trim() || 'Asia/Shanghai',
          agent_name: String(formData.get('agent_name') || '').trim() || 'default',
          prompt: String(formData.get('prompt') || '').trim(),
          runtime_options: runtimeOptions
        }
      };
    }

    async function saveCronJob() {
      let payload;
      try {
        payload = collectCronForm();
      } catch (err) {
        renderCronEditor({ type: 'error', text: err.message });
        return;
      }
      renderCronEditor({ text: '保存中' });
      const res = await fetch(`/api/cron/jobs/${encodeURIComponent(payload.name)}`, fetchOptions({
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload.job)
      }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderCronEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      state.selectedCronJobName = data.name;
      state.selectedCronJob = data;
      const index = state.cronJobs.findIndex((job) => job.name === data.name);
      if (index >= 0) state.cronJobs[index] = data;
      else state.cronJobs.push(data);
      try {
        await Promise.all([
          loadCronRuns(data.name),
          previewSelectedCronJob()
        ]);
        renderCronList();
        renderCronSummary();
        renderCronEditor({ type: 'ok', text: 'Cron 计划已保存' });
      } catch (err) {
        renderCronList();
        renderCronSummary();
        renderCronEditor({ type: 'error', text: err.message });
      }
    }

    async function runCronJobNow() {
      const name = state.selectedCronJobName;
      if (!name) return;
      if (state.selectedCronJob?.isDraft) {
        renderCronEditor({ type: 'error', text: '请先保存 Cron 计划后再运行' });
        return;
      }
      renderCronEditor({ text: '正在运行 Cron 任务' });
      const res = await fetch(`/api/cron/jobs/${encodeURIComponent(name)}/run`, fetchOptions({ method: 'POST' }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderCronEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      state.selectedCronJob = data.job;
      state.selectedCronJobName = data.job?.name || name;
      const index = state.cronJobs.findIndex((job) => job.name === state.selectedCronJobName);
      if (index >= 0) state.cronJobs[index] = data.job;
      try {
        await Promise.all([
          loadCronRuns(state.selectedCronJobName),
          previewSelectedCronJob()
        ]);
        renderCronList();
        renderCronSummary();
        renderCronEditor({ type: data.error ? 'error' : 'ok', text: data.error || 'Cron 任务已运行' });
      } catch (err) {
        renderCronList();
        renderCronSummary();
        renderCronEditor({ type: 'error', text: err.message });
      }
    }

    async function deleteCronJob() {
      const name = state.selectedCronJobName;
      if (!name) return;
      if (state.selectedCronJob?.isDraft) {
        state.cronJobs = state.cronJobs.filter((job) => job.name !== name);
        state.selectedCronJobName = state.cronJobs[0]?.name || null;
        state.selectedCronJob = state.cronJobs[0] || null;
        state.selectedCronRuns = [];
        state.cronPreviewRuns = [];
        renderCronList();
        renderCronSummary();
        renderCronEditor({ type: 'ok', text: '未保存的 Cron 计划已移除' });
        return;
      }
      const res = await fetch(`/api/cron/jobs/${encodeURIComponent(name)}`, fetchOptions({ method: 'DELETE' }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        renderCronEditor({ type: 'error', text: data.detail || res.statusText || `HTTP ${res.status}` });
        return;
      }
      state.cronJobs = state.cronJobs.filter((job) => job.name !== name);
      state.selectedCronJobName = state.cronJobs[0]?.name || null;
      state.selectedCronJob = state.cronJobs[0] || null;
      state.selectedCronRuns = [];
      state.cronPreviewRuns = [];
      renderCronList();
      renderCronSummary();
      renderCronEditor({ type: 'ok', text: 'Cron 计划已删除' });
    }

    async function refreshCronRuns() {
      if (!state.selectedCronJobName || state.selectedCronJob?.isDraft) return;
      try {
        await loadCronRuns(state.selectedCronJobName);
        renderCronEditor({ type: 'ok', text: '运行历史已刷新' });
      } catch (err) {
        renderCronEditor({ type: 'error', text: err.message });
      }
    }

    async function refreshCronPreviewFromForm() {
      let payload;
      try {
        payload = collectCronForm();
      } catch (err) {
        renderCronEditor({ type: 'error', text: err.message });
        return;
      }
      const previousJob = state.selectedCronJob;
      state.selectedCronJob = {
        ...(previousJob || {}),
        ...payload.job,
        name: payload.name,
        isDraft: previousJob?.isDraft || false
      };
      try {
        await previewSelectedCronJob();
        renderCronEditor({ type: 'ok', text: '触发预览已刷新' });
      } catch (err) {
        renderCronEditor({ type: 'error', text: err.message });
      }
    }

    function formatDateTime(value) {
      if (!value) return '';
      try {
        return new Date(value).toLocaleString();
      } catch {
        return String(value);
      }
    }

    async function loadWorkflows() {
      const res = await fetch('/api/workflows', { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      state.workflows = data.workflows || [];
      state.workflowsLoaded = true;
      if (!state.selectedWorkflowName && state.workflows.length) {
        state.selectedWorkflowName = state.workflows[0].name;
      }
      renderWorkflowList();
      renderWorkflowSummary();
      renderWorkflowEditor();
      if (state.activeTab === 'abilities') renderAbilityPanel();
    }

    async function loadMcpTools() {
      const res = await fetch('/api/mcp/tools', { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.statusText || `HTTP ${res.status}`);
      state.mcpTools = data.tools || [];
      state.mcpToolsLoaded = true;
      if (!state.selectedMcpToolName && state.mcpTools.length) {
        state.selectedMcpToolName = state.mcpTools[0].name;
      }
      if (state.selectedMcpToolName) {
        state.selectedMcpTool = state.mcpTools.find((tool) => tool.name === state.selectedMcpToolName) || null;

      renderToolList();
      renderToolSummary();
      renderToolEditor();

      const manualCount = state.mcpTools.filter((tool) => toolSourceType(tool) === 'manual').length;
      const localCount = state.mcpTools.filter((tool) => toolSourceType(tool) === 'local').length;
      const memoryCount = state.mcpTools.filter((tool) => toolSourceType(tool) === 'memory').length;
      const enabledCount = state.mcpTools.filter((tool) => tool.enabled).length;
      els.toolSummary.textContent = `${state.mcpTools.length} 个 MCP 工具 · ${manualCount} 个手动 · ${localCount} 个本地 · ${memoryCount} 个记忆 · ${enabledCount} 个启用`;

        els.toolList.innerHTML = '<div class="empty-panel">暂无匹配工具</div>';
        return;
      }
      const groups = groupMcpTools(tools);

        <section class="skill-group">
          <div class="skill-group-title">${escapeHtml(group.label)} · ${group.items.length}</div>

            <button class="skill-row ${tool.name === state.selectedMcpToolName ? 'active' : ''}" type="button" data-tool-select="${escapeAttr(tool.name)}">
              <div class="skill-row-main">

              </div>
              <p>${escapeHtml(tool.description || '')}</p>

                <span class="skill-badge ${toolSourceType(tool) === 'skill' ? 'sandbox' : ''}">${escapeHtml(toolSourceLabel(tool))}</span>

              </div>
            </button>
          `).join('')}
        </section>
      `).join('');

    function filteredMcpTools() {
      const tools = [...state.mcpTools];
      if (state.selectedMcpTool && !tools.some((tool) => tool.name === state.selectedMcpTool.name)) {
        tools.push(state.selectedMcpTool);
      }
      const sorted = tools.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      if (state.toolFilter === 'manual') return sorted.filter((tool) => toolSourceType(tool) === 'manual');
      if (state.toolFilter === 'enabled') return sorted.filter((tool) => tool.enabled);
      if (state.toolFilter === 'disabled') return sorted.filter((tool) => !tool.enabled);
      return sorted;
    }

    function groupMcpTools(tools) {
      const labels = {
        manual: '手动 MCP 工具',
        local: '内置本地工具',
        memory: '记忆工具'
      };
      const map = new Map();
      tools.forEach((tool) => {
        const key = toolSourceType(tool);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(tool);
      });
      return [...map.entries()].map(([key, items]) => ({ key, label: labels[key] || key, items }));
    }

    function toolSourceType(tool) {
      return tool?.source?.type || 'manual';
    }

    function toolSourceLabel(tool) {
      const labels = {
        manual: 'Manual MCP',
        local: '内置本地',
        memory: '记忆工具'
      };
      return labels[toolSourceType(tool)] || toolSourceType(tool);
    }

    function openSkillPluginUpload() {
      const input = document.createElement('input');

      input.tabIndex = -1;
      input.setAttribute('aria-hidden', 'true');
      let cleaned = false;
      const cleanup = () => {
        if (cleaned) return;
        cleaned = true;
        input.remove();
      };
      input.addEventListener('change', () => {
        const file = input.files?.[0];
        uploadSkillPlugin(file)
          .catch((err) => {
            renderSkillEditor({ type: 'error', text: err.message });
          })
          .finally(cleanup);
      });
      input.addEventListener('cancel', cleanup);
      document.body.appendChild(input);
      input.click();
      setTimeout(() => {
        if (!input.files?.length) cleanup();
      }, 120000);
    }

        formData.append('file', file);

        const res = await fetch('/api/skills/plugins', fetchOptions({

        if (!res.ok) {

        await handleSkillPluginInstalled(data.plugin, file.name);

    async function handleSkillPluginInstalled(plugin, fallbackName) {
      const names = plugin?.skills || [];
      const successText = `插件已安装：${plugin?.id || fallbackName}，参数标签已按规范归一`;
      renderSkillEditor({ type: 'ok', text: `${successText}，正在刷新列表...` });
      state.skillsLoaded = false;
      state.mcpToolsLoaded = false;
      try {
        await retryAsync(() => Promise.all([loadSkills({ showLoading: false }), loadMcpTools({ showLoading: false })]), {
          retries: 4,
          delayMs: 450
        });
      } catch (err) {
        renderSkillEditor({ type: 'error', text: `${successText}，但刷新列表失败：${err.message}` });
        return;
      }
      if (names.length) {
        state.selectedSkillName = names[0];
        await retryAsync(() => loadSkillDetail(names[0], { showLoading: false }), { retries: 4, delayMs: 450 });
      }
      renderSkillEditor({ type: 'ok', text: successText });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: successText });
      warmSkillEnvironments(names, successText);
    }

    async function warmSkillEnvironments(names, successText) {
      const skills = Array.isArray(names) ? names.filter(Boolean) : [];
      if (!skills.length) return;
      const results = [];
      for (const name of skills) {
        try {
          const res = await fetch(`/api/skills/${encodeURIComponent(name)}/environment/warm`, fetchOptions({ method: 'POST' }));
          const data = await res.json().catch(() => ({}));
          results.push({ name, ok: res.ok, data, message: data.detail || data.message || res.statusText || '' });
        } catch (err) {
          results.push({ name, ok: false, message: err.message });
        }
      }
      const failed = results.filter((item) => !item.ok || item.data?.status === 'failed');
      if (failed.length) {
        renderSkillEditor({ type: 'error', text: `${successText}，依赖预热未完成：${failed.map((item) => `${item.name}: ${item.message || item.data?.message || 'failed'}`).join('；')}` });
        if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'error', text: '依赖预热未完成，可稍后在技能环境中重试' });
        return;
      }
      renderSkillEditor({ type: 'ok', text: `${successText}，依赖环境已就绪` });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '依赖环境已就绪' });
    }

    async function uploadWorkflowPlugin(file) {
      if (!file) return;

      formData.append('file', file);
      renderWorkflowEditor({ type: '', text: '正在上传 Workflow 插件...' });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: '', text: '正在上传 Workflow 插件...' });
      const res = await fetch('/api/workflows/plugins', fetchOptions({
        method: 'POST',
        body: formData
      }));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const message = data.detail || res.statusText || `HTTP ${res.status}`;
        renderWorkflowEditor({ type: 'error', text: message });
        if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'error', text: message });
        return;
      }
      const names = data.plugin?.workflows || [];
      const successText = `Workflow 插件已安装：${data.plugin?.id || file.name}`;
      renderWorkflowEditor({ type: 'ok', text: `${successText}，正在刷新列表...` });
      state.workflowsLoaded = false;
      try {
        await retryAsync(() => loadWorkflows(), { retries: 4, delayMs: 450 });
      } catch (err) {
        renderWorkflowEditor({ type: 'error', text: `${successText}，但刷新列表失败：${err.message}` });
        if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'error', text: `${successText}，但刷新列表失败：${err.message}` });
        return;
      }
      if (names.length) {
        state.selectedWorkflowName = names[0];
      }
      renderWorkflowList();
      renderWorkflowEditor({ type: 'ok', text: successText });
      if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: successText });
    }

    async function retryAsync(action, options = {}) {
      const retries = Number(options.retries || 3);
      const delayMs = Number(options.delayMs || 300);
      let lastError;
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        try {
          return await action();
        } catch (err) {
          lastError = err;
          if (attempt >= retries) break;
          await new Promise((resolve) => setTimeout(resolve, delayMs * (attempt + 1)));
        }
      }
      throw lastError;
    }

    function applyCapabilityContext(messages) {
      const context = selectedCapabilityContext();
      if (!context) return messages;
      const copy = messages.map((message) => ({ ...message }));
      for (let index = copy.length - 1; index >= 0; index -= 1) {
        if (copy[index].role === 'user') {
          copy[index].content += context;
          break;
        }
      }
      return copy;
    }

    async function send() {
      const content = els.input.value.trim();
      if (!content || state.running) return;
      if (hasUploadingAttachments()) {
        addTimeline('附件上传中', '上传完成后即可发送');
        return;
      }
      if (hasFailedAttachments()) {
        addTimeline('附件上传失败', '请移除失败附件后重试');
        return;
      }
      els.input.value = '';
      addMessage('user', content);
      const outboundMessages = applyCapabilityContext(state.messages
        .filter((message) => !message.streaming)
        .map(({ role, content }) => ({ role, content })));
      beginAssistantMessage();
      if (state.pendingAutoContinueStatus) {
        setAssistantProgress(state.pendingAutoContinueStatus);
        state.pendingAutoContinueStatus = '';
      }
      const requestAgent = state.nextAgentOverride || agentFromSelectedCapabilities() || els.agent.value;
      const requestWorkflow = state.nextWorkflowOverride || state.selectedChatWorkflow;
      state.timeline = [];
      state.artifacts = [];
      state.verification = null;
      state.spec = null;
      state.finalResultApplied = false;
      state.running = true;
      hideRequiredInputPanel();
      setBusy(true);
      renderInspectorTabs();
      renderPanel();

      try {
        const threadId = ensureThread();
        const attachments = await attachmentsForRequest();
        if (els.transport.value === 'acp-ws') {
          try {
            await sendViaAcpWs(requestAgent, content, threadId, attachments, outboundMessages, requestWorkflow);
          } catch (err) {
            if (!shouldFallbackToSse(err)) throw err;
            addTimeline('连接降级', 'ACP WS 已断开，切换 SSE');
            setAssistantProgress('WebSocket 断开，正在切换 SSE 通道…');
            if (state.activeAssistantIndex !== null && state.messages[state.activeAssistantIndex]) {
              state.messages[state.activeAssistantIndex].content = '';
              state.messages[state.activeAssistantIndex].progress = true;
            }
            await sendViaSse(requestAgent, threadId, attachments, outboundMessages, requestWorkflow);
          }
          return;
        }
        await sendViaSse(requestAgent, threadId, attachments, outboundMessages, requestWorkflow);
      } catch (err) {
        finishAssistantMessage(`请求失败：${err.message}`);
      } finally {
        if (state.activeAssistantIndex !== null) finishAssistantMessage();
        state.nextAgentOverride = null;
        state.nextWorkflowOverride = null;
        state.running = false;
        state.files = [];
        setBusy(false);
        renderAttachments();
        renderRouteHint();
        await refreshArtifacts().catch((error) => addTimeline('刷新文件失败', error.message || String(error)));
        renderPanel();
      }
    }

    function shouldFallbackToSse(error) {
      const message = String(error?.message || '');
      return message.includes('code 1012') || message.includes('ACP WS 连接已关闭') || message.includes('ACP WS 连接异常');
    }

    function permissionOptionId(options, preferAllow) {
      if (!Array.isArray(options) || !options.length) return null;
      const selected = preferAllow
        ? options.find((item) => {
            const label = String(item?.name || '').toLowerCase();
            const kind = String(item?.optionId || item?.id || '').toLowerCase();
            return label.includes('allow') || label.includes('approve') || kind.includes('allow');
          }) || options[0]
        : options[0];
      return selected?.id || selected?.optionId || selected?.name || null;
    }

    function buildRuntimeOptions(threadId, workflow) {
      const runtimeOptions = {
        ...selectedAppTemplateRuntimeOptions(),
        thread_id: threadId,
        selected_skills: [...state.selectedChatSkills],

      if (state.selectedAppTemplateName) {

        runtimeOptions.model_type = 'chat';
      }
      if (state.yoloExecution) {
        runtimeOptions.mode = 'yolo';
        runtimeOptions.config_options = { max_tool_rounds: 16 };
      } else if (state.deepExecution) {
        runtimeOptions.mode = 'autonomous';

    function buildAcpRuntimeOptions(threadId, workflow) {

    async function sendViaSse(agentName, threadId, attachments, messages, workflow) {
      const runtimeOptions = buildRuntimeOptions(threadId, workflow);
      const res = await fetch(`/api/agents/${agentName}/runs/stream`, fetchOptions({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages,
          attachments,
          runtime_options: runtimeOptions
        })
      }));
      if (!res.ok || !res.body) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || res.statusText);
      }
      await readEventStream(res.body);
    }

    async function sendViaAcpWs(agentName, content, threadId, attachments, messages, workflow) {
      const ws = await openAcpSocket();
      const pending = new Map();
      let closeExpected = false;

      const rejectPending = (error) => {
        pending.forEach((request) => request.reject(error));
        pending.clear();
      };

      ws.onmessage = (message) => {
        let packet;
        try {
          packet = JSON.parse(message.data);
        } catch {
          rejectPending(new Error('ACP WS 返回了无法解析的消息'));
          ws.close();
          return;
        }
        if (packet.method === 'session/update') {
          handleAcpUpdate(packet.params, rpc);
          return;
        }
        if (packet.id != null && pending.has(packet.id)) {
          const request = pending.get(packet.id);
          pending.delete(packet.id);
          if (packet.error) request.reject(new Error(packet.error.message || 'ACP WS error'));
          else request.resolve(packet.result);
        }
      };
      ws.onerror = () => rejectPending(new Error('ACP WS 连接异常'));
      ws.onclose = (event) => {
        if (!pending.size) return;
        const detail = event.reason || `code ${event.code}`;
        const prefix = closeExpected ? 'ACP WS 请求未完成' : 'ACP WS 连接已关闭';
        rejectPending(new Error(`${prefix}：${detail}`));
      };

      const rpc = (method, params = {}) => {
        if (ws.readyState !== WebSocket.OPEN) {
          return Promise.reject(new Error('ACP WS 未连接'));
        }
        const id = ++state.rpcId;
        const payload = { jsonrpc: '2.0', id, method, params };
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          try {
            ws.send(JSON.stringify(payload));
          } catch (err) {
            pending.delete(id);
            reject(err);
          }
        });
      };

      try {
        const runtimeOptions = buildAcpRuntimeOptions(threadId, workflow);
        await rpc('initialize', {
          protocolVersion: 1,
          clientInfo: { name: 'jetlinks-workbench', version: '0.1.0' }
        });
        const session = await rpc('new_session', {
          cwd: '/',
          agentName: agentName,
          threadId,
          runtimeOptions
        });
        const promptResult = await rpc('prompt', {
          sessionId: session.sessionId,
          agentName: agentName,
          threadId,
          prompt: [{ type: 'text', text: content }],
          messages,
          attachments,
          runtimeOptions
        });
        if (promptResult?.result && !state.finalResultApplied) {
          applyFinalResult(promptResult.result);
        }
      } finally {
        closeExpected = true;
        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
          ws.close();
        }
      }
    }

    function openAcpSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${window.location.host}${acpUrl('/api/acp/ws')}`;
      return new Promise((resolve, reject) => {
        const ws = new WebSocket(url, 'acp.v1');
        let settled = false;
        const fail = (message) => {
          if (settled) return;
          settled = true;
          reject(new Error(message));
        };
        ws.onopen = () => {
          settled = true;
          resolve(ws);
        };
        ws.onerror = () => fail('ACP WS 连接失败');
        ws.onclose = (event) => fail(`ACP WS 连接关闭：${event.reason || `code ${event.code}`}`);
      });
    }

    function handleAcpUpdate(params, rpc = null) {
      const update = params?.update || {};
      if (update.sessionUpdate === 'permission_request' && rpc) {
        handlePermissionRequest(params.sessionId, update.permissionRequest, rpc);
      }
      const event = params?.update?._meta?.jetlinksRuntimeEvent;
      if (event) handleEvent(event);
    }

    async function handlePermissionRequest(sessionId, request, rpc) {
      if (state.yoloExecution) {
        const options = Array.isArray(request?.options) ? request.options : [];
        const selected = permissionOptionId(options, true);
        await rpc('session/request_permission', {
          sessionId,
          permissionRequestId: request?.id,
          approved: true,
          ...(selected ? { selectedOptionId: selected } : {})
        });
        addTimeline('权限确认', selected ? `已选择 ${selected}` : '已批准');
        return;
      }
      const title = request?.title || 'Permission request';
      const description = request?.description || '';
      const options = Array.isArray(request?.options) ? request.options : [];
      const approved = window.confirm(`${title}${description ? `\n\n${description}` : ''}`);
      const selected = approved ? permissionOptionId(options, false) : null;
      try {
        await rpc('session/request_permission', {
          sessionId,
          permissionRequestId: request?.id,
          approved,
          ...(selected ? { selectedOptionId: selected } : {})
        });
        addTimeline('权限确认', approved ? (selected ? `已选择 ${selected}` : '已批准') : '已拒绝');
      } catch (error) {
        addTimeline('权限确认失败', String(error.message || error));
      }
    }

    async function readEventStream(body) {
      const reader = body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split('\n\n');
        buffer = frames.pop() || '';
        for (const frame of frames) {
          const event = parseSseFrame(frame);
          if (event) handleEvent(event);
        }
      }
      if (buffer.trim()) {
        const event = parseSseFrame(buffer);
        if (event) handleEvent(event);
      }
    }

    function parseSseFrame(frame) {
      const dataLines = frame.split('\n').filter((line) => line.startsWith('data:'));
      if (!dataLines.length) return null;
      const raw = dataLines.map((line) => line.slice(5).trimStart()).join('\n');
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function handleEvent(event) {
      const data = event.data || {};
      switch (event.type) {
        case 'run.started':
          setAssistantProgress('任务已启动，正在准备上下文…');
          addTimeline('启动', `${data.workflow || 'workflow'} · ${data.thread_id || ''}`);
          break;
        case 'context.compacted':
          setAssistantProgress('上下文较长，正在压缩后继续执行…');
          addTimeline('压缩上下文', runtimeRoundText(data));
          break;
        case 'llm.request.started':
          setAssistantProgress(`正在调用模型${runtimeRoundText(data)}…`);
          addTimeline('模型请求', llmRequestText(data));
          break;
        case 'llm.request.completed':
          setAssistantProgress(llmCompletedProgressText(data));
          addTimeline('模型响应', llmCompletedText(data));
          break;
        case 'tool.calls.started':
          setAssistantProgress(toolCallsProgressText(data));
          addTimeline('准备工具', toolCallsText(data));
          break;
        case 'tool.started':
          setAssistantProgress(toolProgressText(data.tool_name));
          addTimeline('调用工具', data.tool_name || '');
          break;
        case 'tool.completed':
          setAssistantProgress(toolCompletedProgressText(data));
          addTimeline('工具完成', toolCompletedText(data));
          break;
        case 'tool.failed':
          setAssistantProgress(toolFailedProgressText(data));
          addTimeline('工具失败', toolFailedText(data));
          break;
        case 'spec.started':
          setAssistantProgress('正在理解需求并选择可用技能…');
          addTimeline('理解需求', `${data.allowed_skills?.length || 0} 个可用技能`);
          break;
        case 'spec.planner.started':
          setAssistantProgress('正在调用大模型规划图结构…');
          addTimeline('大模型规划', data.skill_name || '');
          break;
        case 'spec.planner.completed':
          setAssistantProgress('规划完成，正在整理结构化 Spec…');
          addTimeline('规划完成', data.enabled ? `${data.model || 'LLM'} · ${data.mode || ''}` : `本地兜底 · ${data.reason || ''}`);
          break;
        case 'spec.planner.failed':
          addTimeline('规划降级', data.error || 'fallback');
          break;
        case 'spec.completed':
          state.spec = data.spec || null;
          addTimeline('生成 Spec', data.skill_name || '');
          break;
        case 'skill.selected':
          addTimeline('选择技能', data.skill?.name || '');
          break;
        case 'sandbox.policy':
          addTimeline('沙盒策略', sandboxPolicyText(data));
          break;
        case 'sandbox.started':
          addTimeline('沙盒启动', `${data.profile_name || ''} · ${data.image || ''}`);
          break;
        case 'sandbox.completed':
          addTimeline('沙盒完成', `${data.output_count || 0} 个输出`);
          break;
        case 'sandbox.failed':
          addTimeline('沙盒失败', data.error || 'failed');
          break;
        case 'sandbox.fallback':
          addTimeline('沙盒降级', data.reason || 'fallback to local');
          break;
        case 'skill.started':
          setAssistantProgress(skillProgressText(data.skill_name));
          addTimeline('执行技能', `${data.skill_name || ''} · attempt ${data.attempt || 0}`);
          break;
        case 'skill.completed':
          addTimeline('技能完成', `${data.output_count || 0} 个输出`);
          break;
        case 'artifact.created':
          upsertArtifact(data.artifact);
          addTimeline('生成文件', data.artifact?.name || '');
          if (state.activeTab === 'artifacts') renderPanel();
          break;
        case 'preview.ready':
          upsertArtifact(data.artifact);
          renderInspectorTabs();
          schedulePanelUpdate();
          break;
        case 'verifier.started':
          setAssistantProgress('正在校验生成文件…');
          addTimeline('开始校验', `retry ${data.retry_count || 0}`);
          break;
        case 'verifier.completed':
          state.verification = data.verification || null;
          addTimeline('校验完成', state.verification?.passed ? '通过' : '未通过');
          break;
        case 'retry.started':
          addTimeline('自动重试', (data.failed_checks || []).join(', '));
          break;
        case 'agent.message.delta':
          appendAssistantDelta(eventText(data));
          break;
        case 'agent.message':
          finishAssistantMessage(eventText(data));
          break;
        case 'run.completed':
          addTimeline('完成', 'completed');
          if (!state.finalResultApplied) applyFinalResult(data.result);
          break;
        case 'run.failed':
          addTimeline('失败', data.error || 'failed');
          if (data.result && !state.finalResultApplied) applyFinalResult(data.result);
          else if (data.error) finishAssistantMessage(`执行失败：${data.error}`);
          break;
      }
    }

    function eventText(data) {
      return data?.text || data?.message || '';
    }

    function runtimeRoundText(data) {
      const round = Number(data?.round || 0);
      return round > 0 ? `第 ${round} 轮` : '';
    }

    function compactListText(items, fallback = '') {
      if (!Array.isArray(items) || !items.length) return fallback;
      return items
        .map((item) => typeof item === 'string' ? item : (item?.name || item?.tool_name || item?.id || ''))
        .filter(Boolean)
        .slice(0, 4)
        .join('、');
    }

    function llmRequestText(data) {
      const round = runtimeRoundText(data);
      const tools = compactListText(data?.tools);
      const count = Number(data?.tool_count || 0);
      return [round, count ? `${count} 个工具可用` : '', tools].filter(Boolean).join(' · ');
    }

    function llmCompletedProgressText(data) {
      const callCount = Number(data?.tool_call_count || 0);
      if (callCount > 0) return `模型已选择 ${callCount} 个工具，正在执行…`;
      return '模型已返回结果，正在整理回复…';
    }

    function llmCompletedText(data) {
      const parts = [runtimeRoundText(data)];
      if (data?.finish_reason) parts.push(String(data.finish_reason));
      if (Number(data?.tool_call_count || 0) > 0) parts.push(`${data.tool_call_count} 个工具调用`);
      if (Number(data?.duration_ms || 0) > 0) parts.push(`${data.duration_ms}ms`);
      return parts.filter(Boolean).join(' · ');
    }

    function toolCallsProgressText(data) {
      const count = Array.isArray(data?.tool_calls) ? data.tool_calls.length : 0;
      return count ? `正在执行 ${count} 个工具…` : '正在执行工具…';
    }

    function toolCallsText(data) {
      const tools = compactListText(data?.tool_calls);
      return [runtimeRoundText(data), tools].filter(Boolean).join(' · ');
    }

    function toolProgressText(toolName) {
      if (toolName === 'skill_run') return '正在执行 Skill…';
      if (toolName === 'local_read_file' || toolName === 'present_files') return '正在读取当前会话文件…';
      if (toolName === 'artifact_read' || toolName === 'artifact_list') return '正在读取当前会话产物…';
      if (toolName === 'artifact_write' || toolName === 'artifact_patch') return '正在写入当前会话产物…';
      return toolName ? `正在调用工具 ${toolName}…` : '正在调用工具…';
    }

    function toolCompletedProgressText(data) {
      const toolName = data?.tool_name || '工具';
      return `${toolName} 执行完成，正在继续分析…`;
    }

    function toolCompletedText(data) {
      const parts = [data?.tool_name || ''];
      if (Number(data?.duration_ms || 0) > 0) parts.push(`${data.duration_ms}ms`);
      const artifacts = data?.structured_content?.artifacts;
      if (Array.isArray(artifacts) && artifacts.length) parts.push(`${artifacts.length} 个产物`);
      return parts.filter(Boolean).join(' · ');
    }

    function toolFailedProgressText(data) {
      const toolName = data?.tool_name || '工具';
      return `${toolName} 调用失败，正在等待模型恢复或返回错误…`;
    }

    function toolFailedText(data) {
      const parts = [data?.tool_name || ''];
      if (data?.error_code) parts.push(String(data.error_code));
      if (Number(data?.duration_ms || 0) > 0) parts.push(`${data.duration_ms}ms`);
      return parts.filter(Boolean).join(' · ');
    }

    function skillProgressText(skillName) {
      if (skillName === 'data-auto-annotation') return '正在调用图像标注服务生成 COCO JSON…';
      if (skillName === 'drawio-generation') return '正在生成 Draw.io 源文件和 PNG 预览…';
      if (skillName === 'pptx-generation') return '正在生成 PPTX 文件…';
      if (skillName === 'excel-generation') return '正在生成 Excel 文件…';
      if (skillName === 'xmind-generation') return '正在生成 XMind 文件…';
      if (skillName === 'markdown-rendering') return '正在生成 Markdown 文档…';
      return '正在执行技能…';
    }

    function applyFinalResult(result) {
      if (!result) return;
      state.finalResultApplied = true;
      if (result.reply) {
        const last = state.messages[state.messages.length - 1];
        if (!(last && last.role === 'assistant' && last.content === result.reply)) {
          finishAssistantMessage(result.reply);
        }
      }
      state.artifacts = result.artifacts || state.artifacts;
      state.verification = result.verification || state.verification;
      state.spec = result.spec || state.spec;
      maybePromptForRequiredInputs(result);
      renderInspectorTabs();
      schedulePanelUpdate();
    }

    function maybePromptForRequiredInputs(result) {
      const meta = result?.metadata || {};
      if (!meta.requires_input || !Array.isArray(meta.required_inputs) || !meta.required_inputs.length) return;
      const fileInputs = meta.required_inputs.filter((item) => requiredInputUsesFile(item));
      if (!fileInputs.length || !els.requiredInputFile) return;
      const accept = [...new Set(fileInputs.map((item) => item.accept || acceptForRequiredInputType(item.type)).filter(Boolean))].join(',');
      const label = fileInputs.map((item) => requiredInputLabel(item.type)).join('、');
      state.requiredInputAccept = accept || '*/*';
      state.requiredInputLabel = label || '文件';
      els.requiredInputFile.accept = state.requiredInputAccept === '*/*' ? '' : state.requiredInputAccept;
      els.requiredInputFile.value = '';
      addTimeline('等待补充输入', `${label || '文件'} · ${state.requiredInputAccept}`);
      showRequiredInputPanel(state.requiredInputLabel, state.requiredInputAccept, fileInputs);
    }

    function showRequiredInputPanel(label, accept, inputs) {
      if (!els.requiredInputPanel) return;
      const reasons = inputs
        .map((item) => item.reason)
        .filter(Boolean)
        .slice(0, 2)
        .join('；');
      els.requiredInputTitle.textContent = `需要上传${label || '文件'}`;
      els.requiredInputDetail.textContent = `${accept || '*/*'}${reasons ? ` · ${reasons}` : ''}`;
      const container = ensureRequiredInputMessageNode();
      const bubble = container.querySelector('.bubble');
      if (bubble && els.requiredInputPanel.parentElement !== bubble) {
        bubble.appendChild(els.requiredInputPanel);
      }
      els.requiredInputPanel.classList.add('active');
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    function hideRequiredInputPanel() {
      els.requiredInputPanel?.classList.remove('active');
      document.getElementById('requiredInputMessage')?.remove();

    function ensureRequiredInputMessageNode() {
      let node = document.getElementById('requiredInputMessage');
      if (node) return node;
      node = document.createElement('div');
      node.id = 'requiredInputMessage';
      node.className = 'message assistant required-input-message';
      node.innerHTML = '<div class="role">Agent</div><div class="bubble"></div>';
      els.messages.appendChild(node);
      return node;
    }

    function requiredInputUsesFile(item) {
      return ['file', 'image', 'video', 'audio', 'dataset', 'model', 'model_config'].includes(String(item?.type || 'file'));
    }

    function acceptForRequiredInputType(type) {
      if (type === 'image') return 'image/*';
      if (type === 'video') return 'video/*';
      if (type === 'audio') return 'audio/*';
      if (type === 'dataset') return '.zip,.tar,.tar.gz,.csv,.json,.jsonl,.parquet,.yaml,.yml';
      if (type === 'model') return '.onnx,.pt,.pth,.bin,.safetensors,.gguf,.pkl,.joblib';
      if (type === 'model_config') return '.json,.yaml,.yml,.toml';
      return '*/*';
    }

    function requiredInputLabel(type) {
      if (type === 'image') return '图片';
      if (type === 'video') return '视频';
      if (type === 'audio') return '音频';
      if (type === 'dataset') return '数据集';
      if (type === 'model') return '模型文件';
      if (type === 'model_config') return '模型配置';
      return '文件';
    }

    function upsertArtifact(artifact) {
      if (!artifact) return;
      const idx = state.artifacts.findIndex((item) => item.path === artifact.path);
      if (idx >= 0) state.artifacts[idx] = artifact;
      else state.artifacts.push(artifact);
      renderInspectorTabs();
    }

    async function refreshArtifacts() {
      const threadId = ensureThread();
      const res = await fetch(`/api/artifacts/${encodeURIComponent(threadId)}`, fetchOptions({ cache: 'no-store' }));
      const data = await res.json();
      if (ensureThread() !== threadId) return;
      state.artifacts = data.artifacts || [];
      renderInspectorTabs();
      renderPanel();
    }

    async function preview(url, kind, target) {
      target.hidden = false;
      if (kind === 'image') {
        target.classList.add('image-preview');
        target.innerHTML = `<img src="${escapeAttr(url)}" alt="预览图">`;
        return;
      }
      target.classList.remove('image-preview');
      if (!['text', 'markdown'].includes(kind)) {
        target.innerHTML = '<pre>该文件为二进制产物，请下载后查看。</pre>';
        return;
      }
      const res = await fetch(url);
      const text = await res.text();
      const clipped = text.slice(0, 24000);
      target.innerHTML = kind === 'markdown'
        ? `<div class="markdown-body">${renderMarkdown(clipped)}</div>`
        : `<pre>${escapeHtml(clipped)}</pre>`;

    function renderMessageContent(message) {
      if (message.role === 'assistant') {
        if (message.streaming) {
          return `<div class="markdown-body streaming-text">${escapeHtml(message.content || '')}</div>`;
        }
        return `<div class="markdown-body">${renderMarkdown(message.content || '')}</div>`;
      }
      return `<div class="markdown-body">${escapeHtml(message.content || '')}</div>`;
    }

    function renderMarkdown(value) {
      const lines = String(value || '').replace(/\r\n/g, '\n').split('\n');
      const html = [];
      let paragraph = [];
      let listType = null;
      let inCode = false;
      let codeLines = [];

      const closeList = () => {
        if (listType) {
          html.push(`</${listType}>`);
          listType = null;
        }
      };
      const openList = (type) => {
        if (listType !== type) {
          closeList();
          html.push(`<${type}>`);
          listType = type;
        }
      };
      const flushParagraph = () => {
        if (!paragraph.length) return;
        html.push(`<p>${renderInlineMarkdown(paragraph.join(' '))}</p>`);
        paragraph = [];
      };
      const flushCode = () => {
        html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        codeLines = [];
      };

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        const trimmed = line.trim();

        if (trimmed.startsWith('```')) {
          if (inCode) {
            flushCode();
            inCode = false;
          } else {
            flushParagraph();
            closeList();
            inCode = true;
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        if (!trimmed) {
          flushParagraph();
          closeList();
          continue;
        }

        if (isTableRow(line) && isTableSeparator(lines[index + 1] || '')) {
          flushParagraph();
          closeList();
          const headers = splitTableRow(line);
          index += 2;
          const rows = [];
          while (index < lines.length && isTableRow(lines[index])) {
            rows.push(splitTableRow(lines[index]));
            index += 1;
          }
          index -= 1;
          html.push(renderMarkdownTable(headers, rows));
          continue;
        }

        const heading = /^(#{1,4})\s+(.+)$/.exec(trimmed);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const bullet = /^[-*]\s+(.+)$/.exec(trimmed);
        if (bullet) {
          flushParagraph();
          openList('ul');
          html.push(`<li>${renderInlineMarkdown(bullet[1])}</li>`);
          continue;
        }

        const ordered = /^\d+\.\s+(.+)$/.exec(trimmed);
        if (ordered) {
          flushParagraph();
          openList('ol');
          html.push(`<li>${renderInlineMarkdown(ordered[1])}</li>`);
          continue;
        }

        const quote = /^>\s?(.+)$/.exec(trimmed);
        if (quote) {
          flushParagraph();
          closeList();
          html.push(`<blockquote>${renderInlineMarkdown(quote[1])}</blockquote>`);
          continue;
        }

        paragraph.push(line);
      }

      if (inCode) flushCode();
      flushParagraph();
      closeList();
      return html.join('');
    }

    function renderInlineMarkdown(value) {
      return String(value || '').split(/(`[^`]*`)/g).map((part) => {
        if (part.startsWith('`') && part.endsWith('`')) {
          return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
        }
        let html = escapeHtml(part);
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_match, label, url) => {
          return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        });
        return html;
      }).join('');
    }

    function isTableRow(line) {
      return /^\s*\|.+\|\s*$/.test(line);
    }

    function isTableSeparator(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    }

    function splitTableRow(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim());
    }

    function renderMarkdownTable(headers, rows) {
      return `
        <table>
          <thead><tr>${headers.map((cell) => `<th>${renderInlineMarkdown(cell)}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.map((row) => `<tr>${headers.map((_cell, index) => `<td>${renderInlineMarkdown(row[index] || '')}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("'", '&#39;');
    }

    function safeId(value) {
      return btoa(unescape(encodeURIComponent(value))).replaceAll('=', '');
    }

    function formatBytes(value) {
      const size = Number(value || 0);
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
      return `${(size / 1024 / 1024).toFixed(1)} MB`;
    }

      event.preventDefault();
      zone.classList.add('active');
      event.dataTransfer.dropEffect = 'copy';
    });
    document.body.addEventListener('dragleave', (event) => {
      const zone = event.target.closest?.('[data-skill-drop-zone]');
      if (!zone) return;
      zone.classList.remove('active');
    });
    document.body.addEventListener('drop', (event) => {
      const zone = event.target.closest?.('[data-skill-drop-zone]');
      if (!zone) return;
      event.preventDefault();
      zone.classList.remove('active');
      const file = [...(event.dataTransfer?.files || [])].find((item) => item.name.toLowerCase().endsWith('.zip'));
      if (!file) {
        renderSkillEditor({ type: 'error', text: '请拖入 Skill zip 文件' });
        return;
      }
      uploadSkillPlugin(file).catch((err) => {
        renderSkillEditor({ type: 'error', text: err.message });
      });
    });
    els.newThread.addEventListener('click', startNewThread);
    els.thread.addEventListener('input', () => {
      const previousThread = els.threadMini.textContent;
      const nextThread = ensureThread();
      if (previousThread && previousThread !== nextThread) {
        resetThreadUiState({ clearCapabilities: true });
      }
    });
    els.thread.addEventListener('change', () => {
      refreshArtifacts().catch((err) => console.debug('artifact refresh skipped', err));
    });
    els.agent.addEventListener('change', renderSelectedAgent);
    els.refresh.addEventListener('click', refreshArtifacts);
    els.refreshTop.addEventListener('click', refreshArtifacts);
    els.sandboxStatus.addEventListener('click', loadSandboxStatus);
    els.saveAdminToken.addEventListener('click', saveAdminToken);
    els.clearAdminToken.addEventListener('click', clearAdminToken);
    els.adminToken.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') saveAdminToken();
    });
    els.refreshSkills.addEventListener('click', () => {
      state.skillsLoaded = false;
      loadSkills({ showLoading: false }).catch((err) => {
        renderSkillEditor({ type: 'error', text: err.message });
      });
    });
    els.refreshApps.addEventListener('click', () => {
      state.appTemplatesLoaded = false;
      loadAppTemplates().catch((err) => {
        if (els.appTemplateList) els.appTemplateList.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        renderAppTemplateSummary(err.message);
      });
    });
    els.refreshTools.addEventListener('click', () => {
      state.mcpToolsLoaded = false;
      loadMcpTools({ showLoading: false }).catch((err) => {
        renderToolEditor({ type: 'error', text: err.message });
      });
    });
    els.refreshWorkflows.addEventListener('click', () => {
      state.workflowsLoaded = false;
      loadWorkflows().catch((err) => {
        renderWorkflowEditor({ type: 'error', text: err.message });
      });
    });
    els.refreshCron.addEventListener('click', () => {
      state.cronLoaded = false;
      loadCronJobs().catch((err) => {
        renderCronEditor({ type: 'error', text: err.message });
      });
    });
    els.deepExecution?.addEventListener('change', (event) => {
      setDeepExecution(event.target.checked);
    });
    els.yoloExecution?.addEventListener('change', (event) => {
      setYoloExecution(event.target.checked);
    });
    els.skillEditor.addEventListener('click', (event) => {
      const packageFileButton = event.target.closest('[data-skill-file]');
      if (packageFileButton && state.selectedSkillName) {
        loadSkillPackageFile(state.selectedSkillName, packageFileButton.dataset.skillFile, { showLoading: true }).catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
        return;
      }
      if (event.target.closest('[data-skill-save-file]')) {
        saveSelectedSkillFile();
        return;
      }
      if (event.target.closest('[data-skill-format-file]')) {
        formatSelectedSkillFile();
        return;
      }
      if (event.target.closest('[data-skill-refresh-manifest]')) {
        updateSkillManifestPreview();
        return;
      }
      if (event.target.closest('[data-skill-warm-env]')) {
        warmSelectedSkillEnvironment();
        return;
      }
      const schemaAddButton = event.target.closest('[data-schema-add]');
      if (schemaAddButton) {
        const kind = schemaAddButton.dataset.schemaAdd;
        const preset = document.querySelector(`[data-schema-add-preset="${kind}"]`)?.value || '';
        addSchemaFieldRow(kind, preset);
        return;
      }
      if (event.target.closest('[data-schema-remove-field]')) {
        const row = event.target.closest('[data-schema-row]');
        const list = row?.parentElement;
        row?.remove();
        if (list && !list.querySelector('[data-schema-row]') && !list.querySelector('[data-schema-empty]')) {
          list.insertAdjacentHTML('beforeend', '<div class="empty" data-schema-empty>暂未添加字段，请先选择字段模板。</div>');
        }
        updateSkillManifestPreview();
        return;
      }
      if (event.target.closest('[data-schema-toggle-advanced]')) {
        const row = event.target.closest('[data-schema-row]');
        const advanced = row?.querySelector('.schema-row-grid');
        if (advanced) {
          advanced.hidden = !advanced.hidden;
          event.target.closest('[data-schema-toggle-advanced]').textContent = advanced.hidden ? '高级' : '收起';
        }
        return;
      }
      const saveButton = event.target.closest('[data-skill-save]');
      if (saveButton) {
        saveSelectedSkill();
        return;
      }
      const resetButton = event.target.closest('[data-skill-reset]');
      if (resetButton && state.selectedSkillName) {
        loadSkillDetail(state.selectedSkillName).catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
      }
    });
    els.skillEditor.addEventListener('input', (event) => {
      if (event.target.closest('#skillForm') && document.getElementById('skillManifestPreview')) {
        updateSkillManifestPreview();
      }
    });
    els.skillEditor.addEventListener('change', (event) => {
      const typeSelect = event.target.closest('[data-schema-field-type]');
      if (typeSelect) {
        const row = typeSelect.closest('[data-schema-row]');
        const itemsType = row?.querySelector('[data-schema-field-items-type]');
        if (itemsType) itemsType.disabled = typeSelect.value !== 'array';
      }
      if (event.target.closest('#skillForm') && document.getElementById('skillManifestPreview')) {
        updateSkillManifestPreview();
      }
    });
    els.toolEditor.addEventListener('click', (event) => {
      if (event.target.closest('[data-tool-save-file]')) {
        saveSelectedToolFile();
        return;
      }
      if (event.target.closest('[data-tool-format-file]')) {
        formatSelectedToolFile();
        return;
      }
      if (event.target.closest('[data-tool-save]')) {
        saveSelectedTool();
        return;
      }
      if (event.target.closest('[data-tool-reset]')) {
        loadMcpTools({ showLoading: false }).catch((err) => {
          renderToolEditor({ type: 'error', text: err.message });
        });
        return;
      }
      if (event.target.closest('[data-open-tool-skill]')) {
        const skillName = state.selectedMcpTool?.source?.skill_name || state.selectedMcpToolName;
        setView('skills');
        loadSkillDetail(skillName, { showLoading: false }).catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
      }
    });

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        selectInspectorTab(tab.dataset.tab);
      });
    });

    document.querySelectorAll('[data-view]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        setView(button.dataset.view || 'chat');
      });
    });

    document.body.addEventListener('click', (event) => {
      if (event.target === els.capabilityPicker) {
        closeCapabilityPicker();
        return;
      }
      const capabilityOpenButton = event.target.closest('[data-capability-open]');
      if (capabilityOpenButton) {
        openCapabilityPicker(capabilityOpenButton.dataset.capabilityOpen || 'skills');
        return;
      }
      if (event.target.closest('[data-capability-close]')) {
        closeCapabilityPicker();
        return;
      }
      const removeCapabilityButton = event.target.closest('[data-remove-capability]');
      if (removeCapabilityButton) {
        removeCapability(removeCapabilityButton.dataset.removeCapability, removeCapabilityButton.dataset.name || '');
        return;
      }
      const chatSkillButton = event.target.closest('[data-chat-skill]');
      if (chatSkillButton) {
        toggleCapability('skill', chatSkillButton.dataset.chatSkill || '');
        return;
      }
      const chatMcpButton = event.target.closest('[data-chat-mcp]');
      if (chatMcpButton) {
        toggleCapability('mcp', chatMcpButton.dataset.chatMcp || '');
        return;
      }
      const chatWorkflowButton = event.target.closest('[data-chat-workflow]');
      if (chatWorkflowButton) {
        toggleCapability('workflow', chatWorkflowButton.dataset.chatWorkflow || '');
        return;
      }
      if (event.target.closest('[data-clear-workflow]')) {
        state.selectedChatWorkflow = null;
        renderComposerCapabilities();
        renderCapabilityPicker();
        return;
      }
      if (event.target.closest('[data-add-cron-job]')) {
        addCronJobDraft();
        return;
      }
      const installSkillPathButton = event.target.closest('[data-install-skill-plugin-path]');
      if (installSkillPathButton) {
        const scope = installSkillPathButton.closest('.manager-actions, .ability-actions') || document;
        const input = scope.querySelector('[data-skill-plugin-path]');
        installSkillPluginFromLocalPath(input?.value || '').catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
        return;
      }
      if (event.target.closest('[data-compose-add-skill]')) {
        closeCapabilityPicker();
        setView('skills');
        openSkillPluginUpload();
        return;
      }
      if (event.target.closest('[data-upload-workflow-plugin]')) {
        closeCapabilityPicker();
        setView('workflows');
        openWorkflowPluginUpload();
        return;
      }
      if (event.target.closest('[data-compose-add-mcp]')) {
        closeCapabilityPicker();
        addMcpToolDraft();
        setView('tools');
        return;
      }
      const composeManageButton = event.target.closest('[data-compose-manage]');
      if (composeManageButton) {
        closeCapabilityPicker();
        setView(composeManageButton.dataset.composeManage || 'chat');
        return;
      }
      const viewButton = event.target.closest('[data-view]');
      if (viewButton) {
        setView(viewButton.dataset.view || 'chat');
        return;
      }
      const skillFilterButton = event.target.closest('[data-skill-filter]');
      if (skillFilterButton) {
        state.skillFilter = skillFilterButton.dataset.skillFilter || 'all';
        document.querySelectorAll('[data-skill-filter]').forEach((item) => {
          item.classList.toggle('active', item.dataset.skillFilter === state.skillFilter);
        });
        renderSkillList();
        return;
      }
      const toolFilterButton = event.target.closest('[data-tool-filter]');
      if (toolFilterButton) {
        state.toolFilter = toolFilterButton.dataset.toolFilter || 'all';
        document.querySelectorAll('[data-tool-filter]').forEach((item) => {
          item.classList.toggle('active', item.dataset.toolFilter === state.toolFilter);
        });
        renderToolList();
        return;
      }
      const workflowFilterButton = event.target.closest('[data-workflow-filter]');
      if (workflowFilterButton) {
        state.workflowFilter = workflowFilterButton.dataset.workflowFilter || 'all';
        document.querySelectorAll('[data-workflow-filter]').forEach((item) => {
          item.classList.toggle('active', item.dataset.workflowFilter === state.workflowFilter);
        });
        renderWorkflowList();
        return;
      }
      const cronFilterButton = event.target.closest('[data-cron-filter]');
      if (cronFilterButton) {
        state.cronFilter = cronFilterButton.dataset.cronFilter || 'all';
        document.querySelectorAll('[data-cron-filter]').forEach((item) => {
          item.classList.toggle('active', item.dataset.cronFilter === state.cronFilter);
        });
        renderCronList();
        return;
      }
      const appFilterButton = event.target.closest('[data-app-filter]');
      if (appFilterButton) {
        state.appFilter = appFilterButton.dataset.appFilter || 'all';
        state.selectedAppTemplateJsonName = null;
        document.querySelectorAll('[data-app-filter]').forEach((item) => {
          item.classList.toggle('active', item.dataset.appFilter === state.appFilter);
        });
        renderAppTemplateSummary();
        renderAppTemplateList();
        return;
      }
      const appJsonButton = event.target.closest('[data-app-template-json]');
      if (appJsonButton) {
        const name = appJsonButton.dataset.appTemplateJson || '';
        state.selectedAppTemplateJsonName = state.selectedAppTemplateJsonName === name ? null : name;
        renderAppTemplateList();
        return;
      }
      const appUseButton = event.target.closest('[data-app-template-use]');
      if (appUseButton) {
        applyAppTemplate(appUseButton.dataset.appTemplateUse || '');
        return;
      }
      const appCronButton = event.target.closest('[data-app-template-cron]');
      if (appCronButton) {
        createCronFromAppTemplate(appCronButton.dataset.appTemplateCron || '');
        return;
      }
      const appPromptButton = event.target.closest('[data-app-template-prompt]');
      if (appPromptButton) {
        applyAppTemplate(appPromptButton.dataset.appTemplatePrompt || '', { fillPrompt: true });
        return;
      }
      const skillButton = event.target.closest('[data-skill-select]');
      if (skillButton) {
        loadSkillDetail(skillButton.dataset.skillSelect).catch((err) => {
          renderSkillEditor({ type: 'error', text: err.message });
        });
        return;
      }
      const toolButton = event.target.closest('[data-tool-select]');
      if (toolButton) {
        state.selectedMcpToolName = toolButton.dataset.toolSelect;
        state.selectedMcpTool = filteredMcpTools().find((tool) => tool.name === state.selectedMcpToolName)
          || state.mcpTools.find((tool) => tool.name === state.selectedMcpToolName)
          || null;
        renderToolList();
        renderToolEditor();
        return;
      }
      const workflowButton = event.target.closest('[data-workflow-select-row]');
      if (workflowButton) {
        state.selectedWorkflowName = workflowButton.dataset.workflowSelectRow;
        renderWorkflowList();
        renderWorkflowEditor();
        return;
      }
      const cronButton = event.target.closest('[data-cron-select]');
      if (cronButton) {
        state.selectedCronJobName = cronButton.dataset.cronSelect;
        state.selectedCronJob = filteredCronJobs().find((job) => job.name === state.selectedCronJobName)
          || state.cronJobs.find((job) => job.name === state.selectedCronJobName)
          || null;
        state.selectedCronRuns = [];
        state.cronPreviewRuns = [];
        renderCronList();
        renderCronEditor({ text: '加载 Cron 详情中' });
        Promise.all([
          state.selectedCronJob?.isDraft ? Promise.resolve() : loadCronRuns(state.selectedCronJobName),
          previewSelectedCronJob()
        ]).then(() => {
          renderCronEditor();
        }).catch((err) => {
          renderCronEditor({ type: 'error', text: err.message });
        });
        return;
      }
      if (event.target.closest('[data-cron-save]')) {
        saveCronJob();
        return;
      }
      if (event.target.closest('[data-cron-run]')) {
        runCronJobNow();
        return;
      }
      if (event.target.closest('[data-cron-delete]')) {
        deleteCronJob();
        return;
      }
      if (event.target.closest('[data-cron-preview]')) {
        refreshCronPreviewFromForm();
        return;
      }
      if (event.target.closest('[data-cron-refresh-runs]')) {
        refreshCronRuns();
        return;
      }
      const useWorkflowButton = event.target.closest('[data-workflow-use]');
      if (useWorkflowButton) {
        state.selectedChatWorkflow = useWorkflowButton.dataset.workflowUse || null;
        state.nextWorkflowOverride = null;
        renderComposerCapabilities();
        renderWorkflowEditor({ type: 'ok', text: '本轮将使用该 Workflow' });
        if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '本轮将使用该 Workflow' });
        setView('chat');
        return;
      }
      if (event.target.closest('[data-workflow-clear]')) {
        state.selectedChatWorkflow = null;
        state.nextWorkflowOverride = null;
        renderComposerCapabilities();
        renderWorkflowEditor({ type: 'ok', text: '本轮不使用 Workflow' });
        if (state.activeTab === 'abilities') renderAbilityPanel({ type: 'ok', text: '本轮不使用 Workflow' });
        return;
      }
      const abilityModeButton = event.target.closest('[data-ability-mode]');
      if (abilityModeButton) {
        state.abilityMode = abilityModeButton.dataset.abilityMode || 'skills';
        renderAbilityPanel();
        return;
      }
      const abilitySkillButton = event.target.closest('[data-ability-skill]');
      if (abilitySkillButton) {
        state.selectedSkillName = abilitySkillButton.dataset.abilitySkill;
        state.selectedSkill = state.skills.find((skill) => skill.name === state.selectedSkillName) || null;
        renderAbilityPanel();
        loadSkillDetail(state.selectedSkillName, { showLoading: false }).catch((err) => {
          renderAbilityPanel({ type: 'error', text: err.message });
        });
        return;
      }
      const abilityMcpButton = event.target.closest('[data-ability-mcp]');
      if (abilityMcpButton) {
        state.selectedMcpToolName = abilityMcpButton.dataset.abilityMcp;
        state.selectedMcpTool = state.mcpTools.find((tool) => tool.name === state.selectedMcpToolName) || null;
        renderAbilityPanel();
        return;
      }
      const abilityWorkflowButton = event.target.closest('[data-ability-workflow]');
      if (abilityWorkflowButton) {
        state.selectedWorkflowName = abilityWorkflowButton.dataset.abilityWorkflow;
        renderWorkflowList();
        renderWorkflowEditor();
        renderAbilityPanel();
        return;
      }
      if (event.target.closest('[data-upload-skill-plugin]')) {
        setView('skills');
        openSkillPluginUpload();
        return;
      }
      if (event.target.closest('[data-upload-workflow-plugin]')) {
        setView('workflows');
        openWorkflowPluginUpload();
        return;
      }
      if (event.target.closest('[data-add-mcp-tool]')) {
        addMcpToolDraft();
        return;
      }
      if (event.target.closest('[data-refresh-abilities]')) {
        state.skillsLoaded = false;
        state.mcpToolsLoaded = false;
        state.workflowsLoaded = false;
        loadAbilities().catch((err) => {
          els.panel.innerHTML = `<div class="empty-panel">${escapeHtml(err.message)}</div>`;
        });
        return;
      }
      if (event.target.closest('[data-ability-save-skill]')) {
        saveAbilitySkill();
        return;
      }
      if (event.target.closest('[data-ability-save-mcp]')) {
        saveAbilityMcpTool();
        return;
      }
      const promptButton = event.target.closest('[data-prompt]');
      if (promptButton) {
        els.input.value = promptButton.dataset.prompt;
        setNextAgentOverride(promptButton.dataset.agentSelect || null, promptButton.dataset.workflowSelect || null);
        els.input.focus();
        return;
      }
      const agentButton = event.target.closest('[data-agent-select]');
      if (agentButton) {
        if (agentButton.dataset.workflowSelect) {
          setNextAgentOverride(agentButton.dataset.agentSelect || null, agentButton.dataset.workflowSelect);
          els.input.focus();
        } else {
          setAgent(agentButton.dataset.agentSelect);
        }
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.capabilityPickerMode) {
        closeCapabilityPicker();
      }
    });

    els.panel.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.download) {
        const link = document.createElement('a');
        link.href = button.dataset.download;
        link.download = '';
        link.rel = 'noreferrer';
        document.body.appendChild(link);
        link.click();
        link.remove();
        return;
      }
      if (button.dataset.preview) {
        const container = document.getElementById(`preview-${button.dataset.id}`);
        preview(button.dataset.preview, button.dataset.kind, container);
      }
    });

    loadAdminToken();
    loadAgents();
    loadSandboxStatus();
    ensureThread();
    renderMessages();
    renderAttachments();
    renderComposerCapabilities();
    renderPanel();
    refreshArtifacts().catch((err) => console.debug('artifact refresh skipped', err));
  </script>
</body>
</html>
