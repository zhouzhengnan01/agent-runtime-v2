name: docker-image

on:
  push:
    branches:
      - agent-v2
    tags:
      - "v*"
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.base
      - .dockerignore
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - app/**
      - config/**
      - plugins/**
      - static/**
      - runtime-env.sh
      - up.sh
      - status.sh
      - stop.sh
      - sync-image-code.sh
      - docker-entrypoint.sh
      - .github/workflows/docker-image.yml
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_TAG: base-agent-v2

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest \
            tests/test_acp_content.py \
            tests/test_acp_ws.py \
            tests/test_parking_abnormal_review_workflow.py

  docker:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build dependency base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BASE_TAG }}
          cache-from: type=gha,scope=base-agent-v2
          cache-to: type=gha,mode=max,scope=base-agent-v2
          build-args: |
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple

      - name: Build and push app image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=app-agent-v2
            type=gha,scope=base-agent-v2
          cache-to: type=gha,mode=max,scope=app-agent-v2
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BASE_TAG }}
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple
