<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JetLinks Agent Console</title>
    <meta name="description" content="基于 JetLinks Agent 接口的轻量管理与对话前端" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-badge"></div>
          <div>
            <div class="brand-title">JetLinks Agent Console</div>
            <div class="brand-sub">
              API: <span class="mono" id="baseUrlBadge"></span>
            </div>
          </div>
        </div>
        <nav class="nav">
          <a data-nav="dashboard" href="#dashboard">概览</a>
          <a data-nav="agents" href="#agents">智能体</a>
          <a data-nav="chat" href="#chat">对话</a>
          <a data-nav="patrol" href="#patrol">实时巡检</a>
          <a data-nav="patrol-review" href="#patrol-review">实时巡检（复判）</a>
          <a data-nav="patrol-streams" href="#patrol-streams">巡检流列表</a>
          <a data-nav="tools" href="#tools">工具</a>
          <a data-nav="prompts" href="#prompts">提示词</a>
          <a data-nav="settings" href="#settings">设置</a>
          <a href="/review.html" target="_blank" rel="noreferrer">复判</a>
          <a href="/review-screen.html" target="_blank" rel="noreferrer">复判大屏</a>
          <a class="pill" href="/docs" target="_blank" rel="noreferrer">API Docs</a>
        </nav>
      </div>
    </div>

    <main id="main"></main>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <div style="font-weight: 800" id="toastMsg"></div>
      <small id="toastDetail"></small>
    </div>

    <script src="/assets/patrol_streams.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js" crossorigin="anonymous"></script>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
