<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetLinks Agent 应用中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease 0.2s;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .app-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease;
            animation-fill-mode: both;
            display: flex;
            flex-direction: column;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .app-header {
            padding: 20px;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            position: relative;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .app-description {
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.4;
        }

        .app-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .app-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-dot.inactive {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        .app-features {
            list-style: none;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .app-features li {
            padding: 6px 0;
            color: #666;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-features li:before {
            content: "✓";
            color: #4caf50;
            font-weight: bold;
        }

        .app-actions {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease 0.4s;
        }

        .stat-item {
            text-align: center;
            color: white;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            animation: slideInUp 0.3s ease;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .modal-body {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .iframe-container {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translate(-50%, -40%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .app-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                gap: 20px;
            }

            .stat-number {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🚀 JetLinks Agent 应用中心</h1>
            <p>智能体应用管理与控制平台</p>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <input type="text" class="search-input" placeholder="🔍 搜索应用..." id="searchInput">
        </div>

        <!-- 统计信息 -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalApps">0</div>
                <div class="stat-label">总应用数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="activeApps">0</div>
                <div class="stat-label">运行中</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="lastUpdate">0</div>
                <div class="stat-label">今日更新</div>
            </div>
        </div>

        <!-- 应用网格 -->
        <div class="app-grid" id="appGrid">
            <!-- 应用卡片将通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="appModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">应用详情</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal内容将动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 应用数据
        const applications = [
            {
                id: 'iotHomeAgent',
                name: 'IoT智能助手',
                description: '专业的物联网设备和数据管理智能助手，支持设备监控、数据分析和告警管理',
                url: 'http://124.132.152.75:8005',
                websocketUrl: 'ws://124.132.152.75:8005/api/v1/jaip/session/iotHomeAgent',
                status: 'active',
                features: [
                    '设备监控',
                    '数据分析',
                    '智能问答',
                    '告警管理',
                    '实时连接'
                ],
                category: 'iot',
                lastUpdate: '2025-11-13'
            },
            {
                id: 'jetlinks-admin',
                name: 'JetLinks管理平台',
                description: 'JetLinks物联网平台管理界面，包含设备管理、规则配置、用户管理等核心功能',
                url: 'http://124.132.152.75:8080',
                websocketUrl: null,
                status: 'active',
                features: [
                    '设备管理',
                    '规则配置',
                    '用户管理',
                    '系统设置',
                    '数据可视化'
                ],
                category: 'admin',
                lastUpdate: '2025-11-12'
            },
            {
                id: 'data-analysis',
                name: '数据分析平台',
                description: '强大的数据分析和可视化平台，支持多维度数据分析和报表生成',
                url: 'http://124.132.152.75:3000',
                websocketUrl: null,
                status: 'active',
                features: [
                    '实时分析',
                    '报表生成',
                    '数据可视化',
                    '趋势预测',
                    '自定义报表'
                ],
                category: 'analytics',
                lastUpdate: '2025-11-13'
            },
            {
                id: 'device-monitor',
                name: '设备监控系统',
                description: '实时监控物联网设备状态，提供设备健康度分析和预测性维护建议',
                url: 'http://124.132.152.75:4000',
                websocketUrl: 'ws://124.132.152.75:4000/ws',
                status: 'maintenance',
                features: [
                    '实时监控',
                    '健康度分析',
                    '预测性维护',
                    '告警推送',
                    '性能分析'
                ],
                category: 'monitor',
                lastUpdate: '2025-11-10'
            },
            {
                id: 'smart-factory',
                name: '智慧工厂平台',
                description: '工业4.0智能制造平台，整合生产管理、质量控制和供应链管理',
                url: 'http://124.132.152.75:5000',
                websocketUrl: 'ws://124.132.152.75:5000/ws',
                status: 'active',
                features: [
                    '生产管理',
                    '质量控制',
                    '供应链管理',
                    '工艺优化',
                    '效率分析'
                ],
                category: 'industry',
                lastUpdate: '2025-11-11'
            },
            {
                id: 'ai-training',
                name: 'AI训练平台',
                description: '机器学习模型训练和管理平台，支持模型训练、部署和版本管理',
                url: 'http://124.132.152.75:6000',
                websocketUrl: null,
                status: 'active',
                features: [
                    '模型训练',
                    '模型部署',
                    '版本管理',
                    '数据集管理',
                    '性能监控'
                ],
                category: 'ai',
                lastUpdate: '2025-11-09'
            },
            {
                id: 'asset-management',
                name: '资产管理中心',
                description: '企业级资产管理平台，支持设备、软件、人员等多种资产的综合管理',
                url: 'http://124.132.152.75:7000',
                websocketUrl: null,
                status: 'active',
                features: [
                    '设备资产',
                    '软件资产',
                    '人员管理',
                    '库存管理',
                    '报表统计'
                ],
                category: 'management',
                lastUpdate: '2025-11-08'
            },
            {
                id: 'api-gateway',
                name: 'API网关服务',
                description: 'API服务网关，提供路由、认证、限流、监控等API管理功能',
                url: 'http://124.132.152.75:9000',
                websocketUrl: null,
                status: 'active',
                features: [
                    'API路由',
                    '认证授权',
                    '限流控制',
                    '监控统计',
                    '版本管理'
                ],
                category: 'api',
                lastUpdate: '2025-11-07'
            }
        ];

        // 页面加载完成时初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderApplications();
            updateStats();
            setupSearch();
            setupModal();

            // 添加渐变延迟动画
            const cards = document.querySelectorAll('.app-card');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.1}s`;
            });
        });

        // 渲染应用卡片
        function renderApplications() {
            const appGrid = document.getElementById('appGrid');
            appGrid.innerHTML = '';

            applications.forEach((app, index) => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-header">
                        <h3 class="app-title">${app.name}</h3>
                        <p class="app-description">${app.description}</p>
                    </div>
                    <div class="app-content">
                        <div class="app-status">
                            <div class="status-dot ${app.status === 'active' ? '' : 'inactive'}"></div>
                            <span>${app.status === 'active' ? '运行中' : app.status === 'maintenance' ? '维护中' : '离线'}</span>
                        </div>
                        <ul class="app-features">
                            ${app.features.map(feature => `<li>${feature}</li>`).join('')}
                        </ul>
                        <div class="app-actions">
                            <button class="btn btn-primary" onclick="openApp('${app.id}')">
                                打开应用
                            </button>
                            <button class="btn btn-secondary" onclick="showDetails('${app.id}')">
                                查看详情
                            </button>
                        </div>
                    </div>
                `;
                appGrid.appendChild(card);
            });
        }

        // 更新统计信息
        function updateStats() {
            const totalApps = applications.length;
            const activeApps = applications.filter(app => app.status === 'active').length;
            const today = new Date().toISOString().split('T')[0];
            const lastUpdate = applications.filter(app => app.lastUpdate === today).length;

            document.getElementById('totalApps').textContent = totalApps;
            document.getElementById('activeApps').textContent = activeApps;
            document.getElementById('lastUpdate').textContent = lastUpdate;
        }

        // 设置搜索功能
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const cards = document.querySelectorAll('.app-card');

                cards.forEach(card => {
                    const title = card.querySelector('.app-title').textContent.toLowerCase();
                    const description = card.querySelector('.app-description').textContent.toLowerCase();
                    const features = Array.from(card.querySelectorAll('.app-features li')).map(li => li.textContent.toLowerCase());

                    if (title.includes(searchTerm) ||
                        description.includes(searchTerm) ||
                        features.some(feature => feature.includes(searchTerm))) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        }

        // 设置Modal功能
        function setupModal() {
            const modal = document.getElementById('appModal');
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });
        }

        // 打开应用
        function openApp(appId) {
            const app = applications.find(a => a.id === appId);
            if (app) {
                window.open(app.url, '_blank');
            }
        }

        // 显示应用详情
        function showDetails(appId) {
            const app = applications.find(a => a.id === appId);
            if (!app) return;

            const modal = document.getElementById('appModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = app.name;
            modalBody.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <p><strong>应用ID:</strong> ${app.id}</p>
                    <p><strong>描述:</strong> ${app.description}</p>
                    <p><strong>状态:</strong>
                        <span style="color: ${app.status === 'active' ? '#4caf50' : app.status === 'maintenance' ? '#ff9800' : '#f44336'}">
                            ${app.status === 'active' ? '运行中' : app.status === 'maintenance' ? '维护中' : '离线'}
                        </span>
                    </p>
                    <p><strong>分类:</strong> ${getCategoryName(app.category)}</p>
                    <p><strong>最后更新:</strong> ${app.lastUpdate}</p>
                    <p><strong>主URL:</strong> <a href="${app.url}" target="_blank" style="color: #4facfe;">${app.url}</a></p>
                    ${app.websocketUrl ? `<p><strong>WebSocket:</strong> ${app.websocketUrl}</p>` : ''}
                </div>

                <div style="margin-bottom: 20px;">
                    <h4>🚀 核心功能</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                        ${app.features.map(feature => `
                            <div style="padding: 10px; background: #f5f5f5; border-radius: 8px; text-align: center;">
                                ✅ ${feature}
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div style="text-align: center;">
                    <button class="btn btn-primary" onclick="openAppFromModal('${app.id}')">
                        打开应用
                    </button>
                </div>
            `;

            modal.style.display = 'block';
        }

        // 从Modal中打开应用
        function openAppFromModal(appId) {
            closeModal();
            setTimeout(() => openApp(appId), 100);
        }

        // 关闭Modal
        function closeModal() {
            document.getElementById('appModal').style.display = 'none';
        }

        // 获取分类名称
        function getCategoryName(category) {
            const categories = {
                'iot': 'IoT物联网',
                'admin': '管理平台',
                'analytics': '数据分析',
                'monitor': '监控告警',
                'industry': '工业制造',
                'ai': '人工智能',
                'management': '业务管理',
                'api': 'API服务'
            };
            return categories[category] || category;
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            // ESC关闭Modal
            if (e.key === 'Escape') {
                closeModal();
            }

            // Ctrl+F 聚焦搜索
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });
    </script>
</body>
</html>
