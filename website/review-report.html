<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日复判报告</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: rgba(255, 255, 255, 0.92);
      --border: rgba(148, 163, 184, 0.25);
      --text: #0b1220;
      --muted: #5c6b82;
      --primary: #1d4ed8;
      --accent: #0ea5e9;
      --accent-2: #14b8a6;
      --warning: #f59e0b;
      --danger: #ef4444;
      --success: #16a34a;
      --shadow: 0 20px 60px rgba(15, 23, 42, 0.14);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: radial-gradient(1100px 520px at 5% -10%, #dbeafe 0%, rgba(219, 234, 254, 0) 60%),
        radial-gradient(980px 520px at 95% 0%, #cffafe 0%, rgba(207, 250, 254, 0) 60%),
        radial-gradient(980px 600px at 20% 100%, #fef3c7 0%, rgba(254, 243, 199, 0) 60%),
        linear-gradient(180deg, #f8fafc 0%, #edf2fb 100%);
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        radial-gradient(circle at 85% 20%, rgba(14, 165, 233, 0.16), transparent 55%);
      background-size: 120px 120px, 120px 120px, 100% 100%;
      pointer-events: none;
      opacity: 0.6;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(800px 300px at 18% 0%, rgba(14, 165, 233, 0.12), transparent 60%),
        radial-gradient(800px 320px at 80% 100%, rgba(20, 184, 166, 0.12), transparent 60%);
      pointer-events: none;
      opacity: 0.7;
      mix-blend-mode: multiply;
    }
    .page {
      max-width: 1750px;
      margin: 0 auto;
      padding: 20px 26px 32px;
      position: relative;
      z-index: 1;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      padding: 18px 20px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .topbar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
      pointer-events: none;
      opacity: 0.7;
    }
    .topbar > * { position: relative; z-index: 1; }
    .brand { display: grid; gap: 8px; }
    .brand-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.2px;
      font-family: "Space Grotesk", "Manrope", "Noto Sans SC", sans-serif;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.3px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(14, 165, 233, 0.25);
      background: rgba(14, 165, 233, 0.12);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    }
    .status-pill.error {
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.12);
      color: #b91c1c;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 rgba(14, 165, 233, 0.6);
      animation: pulse 2.2s infinite;
    }
    .status-pill.error .status-dot {
      background: var(--danger);
      box-shadow: 0 0 0 rgba(239, 68, 68, 0.5);
      animation: none;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .control {
      display: grid;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      min-width: 160px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .control input,
    .control select {
      border: 1px solid rgba(148, 163, 184, 0.5);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      background: #f8fafc;
      color: var(--text);
      min-width: 160px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .control input:focus,
    .control select:focus {
      outline: none;
      border-color: rgba(14, 165, 233, 0.6);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
      color: #fff;
      box-shadow: 0 14px 28px rgba(29, 78, 216, 0.25);
      letter-spacing: 0.2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
    }
    .report-layout {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(0, 2.2fr);
      gap: 16px;
    }
    .panel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.88));
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
      opacity: 0.8;
      pointer-events: none;
    }
    .panel > * { position: relative; z-index: 1; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .panel-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .panel-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .list-filters {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .list-filters input,
    .list-filters select {
      border: 1px solid rgba(148, 163, 184, 0.5);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      background: #f8fafc;
      color: var(--text);
      min-width: 160px;
    }
    .report-list {
      display: grid;
      gap: 10px;
      max-height: calc(100vh - 300px);
      overflow: auto;
      padding-right: 4px;
    }
    .report-item {
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.92);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .report-item:hover {
      transform: translateY(-2px);
      border-color: rgba(29, 78, 216, 0.45);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
    }
    .report-item.active {
      border-color: rgba(29, 78, 216, 0.7);
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.2);
    }
    .report-item h4 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }
    .report-item .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .report-item .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.06);
      color: var(--muted);
    }
    .viewer-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .viewer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 8px 0 14px;
    }
    .stats-card {
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: center;
    }
    .stats-icon {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: rgba(29, 78, 216, 0.12);
      display: grid;
      place-items: center;
      color: #1d4ed8;
    }
    .stats-icon svg {
      width: 16px;
      height: 16px;
    }
    .stats-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stats-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .media-section {
      margin-bottom: 16px;
    }
    .media-title {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .media-card {
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      text-decoration: none;
      color: inherit;
      position: relative;
    }
    .media-thumb {
      position: relative;
      height: 120px;
      overflow: hidden;
    }
    .media-thumb img,
    .media-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .media-label {
      font-size: 11px;
      color: var(--muted);
      padding: 6px 10px;
      background: rgba(248, 250, 252, 0.9);
    }
    .media-play {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      border-radius: 999px;
      font-size: 10px;
      padding: 4px 6px;
    }
    .empty-state {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.4);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.7);
    }
    @media (max-width: 1100px) {
      .report-layout {
        grid-template-columns: 1fr;
      }
      .report-list {
        max-height: none;
      }
    }
    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.86));
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
      opacity: 0.8;
      pointer-events: none;
    }
    .card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, rgba(14, 165, 233, 0.65), rgba(20, 184, 166, 0.35), transparent);
      opacity: 0.9;
      pointer-events: none;
    }
    .card > * { position: relative; z-index: 1; }
    .card.reveal {
      opacity: 0;
      transform: translateY(14px) scale(0.985);
      animation: floatIn 0.75s ease forwards;
      animation-delay: var(--delay, 0s);
    }
    .kpi {
      grid-column: span 3;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 120px;
      --kpi-accent: rgba(29, 78, 216, 0.22);
    }
    .kpi::after {
      content: "";
      position: absolute;
      right: -20px;
      top: -30px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, var(--kpi-accent), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    .kpi .label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }
    .kpi .value {
      font-size: 36px;
      font-weight: 800;
      margin-top: 6px;
      font-family: "Space Grotesk", "Manrope", "Noto Sans SC", sans-serif;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }
    .kpi .unit {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 4px;
    }
    .kpi .icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.2);
    }
    .kpi.total { --kpi-accent: rgba(29, 78, 216, 0.22); }
    .kpi.alarm { --kpi-accent: rgba(239, 68, 68, 0.28); }
    .kpi.pending { --kpi-accent: rgba(245, 158, 11, 0.28); }
    .kpi.done { --kpi-accent: rgba(22, 163, 74, 0.25); }
    .kpi.total .icon { background: linear-gradient(140deg, #1d4ed8, #38bdf8); }
    .kpi.alarm .icon { background: linear-gradient(140deg, #ef4444, #f97316); }
    .kpi.pending .icon { background: linear-gradient(140deg, #f59e0b, #facc15); color: #111827; }
    .kpi.done .icon { background: linear-gradient(140deg, #16a34a, #22c55e); }

    .wide { grid-column: span 8; min-height: 320px; }
    .narrow { grid-column: span 4; min-height: 320px; }
    .triple { grid-column: span 4; min-height: 260px; }
    .full { grid-column: span 12; }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 12px;
    }
    .card-sub {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .chart-wrap {
      position: relative;
      height: 210px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(255, 255, 255, 0.65);
    }
    canvas { width: 100%; height: 100%; }

    .legend {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend i {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      background: var(--accent);
    }
    .legend .alarm i { background: var(--danger); }

    .report-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .report-controls .control {
      min-width: 170px;
    }
    .report-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn.secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid rgba(29, 78, 216, 0.25);
      box-shadow: none;
    }
    .btn.secondary:hover {
      border-color: rgba(14, 165, 233, 0.6);
    }
    .report-doc {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      padding: 14px;
      min-height: 200px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }
    .report-section {
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(248, 250, 252, 0.85);
      margin-bottom: 12px;
      position: relative;
    }
    .report-section::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }
    .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .section-icon {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: rgba(29, 78, 216, 0.12);
      display: grid;
      place-items: center;
      color: #1d4ed8;
    }
    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .section-body {
      color: #0f172a;
    }
    .section-body p {
      margin: 6px 0;
    }
    .section-body ul,
    .section-body ol {
      padding-left: 18px;
      margin: 6px 0;
    }
    .section-body li {
      margin: 4px 0;
    }
    .evidence-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .evidence-card {
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      text-decoration: none;
      color: inherit;
    }
    .evidence-thumb {
      height: 110px;
      position: relative;
      overflow: hidden;
    }
    .evidence-thumb img,
    .evidence-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .evidence-label {
      padding: 6px 8px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(248, 250, 252, 0.9);
    }
    .evidence-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 10px;
    }
    .status-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .status-card {
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .status-card .label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .status-card .value {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }
    .report-doc h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    .report-doc h2 {
      font-size: 16px;
      margin: 14px 0 6px;
    }
    .report-doc h3 {
      font-size: 14px;
      margin: 12px 0 4px;
    }
    .report-doc p {
      margin: 6px 0;
    }
    .report-doc ul,
    .report-doc ol {
      padding-left: 18px;
      margin: 6px 0;
    }
    .report-doc li {
      margin: 4px 0;
    }
    .report-doc code {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.06);
      padding: 1px 4px;
      border-radius: 4px;
    }
    .report-meta {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .report-raw {
      margin-top: 10px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 320px;
      overflow: auto;
    }

    .insights {
      display: grid;
      gap: 10px;
    }
    .insight-item {
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(255, 255, 255, 0.92);
      padding: 10px 12px;
      display: grid;
      gap: 6px;
    }
    .insight-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .insight-value {
      font-size: 14px;
      font-weight: 700;
    }

    .bar-track { height: 9px; background: rgba(148, 163, 184, 0.2); border-radius: 999px; overflow: hidden; }

    .table-tools {
