<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云端训练中心</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f5f7fb; --panel:#fff; --border:#e5e7eb; --text:#0f172a; --muted:#6b7280;
      --primary:#2563eb; --success:#16a34a; --warning:#f59e0b; --danger:#ef4444;
      --radius:14px; --shadow:0 12px 32px rgba(15,23,42,0.08);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:"DM Sans","Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding:18px;}
    h1,h2,h3{margin:0;}
    .layout{max-width:1400px;margin:0 auto;display:grid;grid-template-columns: 380px 1fr;gap:16px;}
    @media (max-width:1100px){.layout{grid-template-columns:1fr;}}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
    .title{font-size:20px;font-weight:700;}
    .muted{color:var(--muted);font-size:13px;}
    .tabs{display:flex;gap:10px;padding:0 2px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;}
    .tab{padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted);background:#f3f4f6;border:1px solid var(--border);}
    .tab.active{background:#e7efff;border-color:#cbdcff;color:var(--primary);}
    .search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;}
    .list{display:flex;flex-direction:column;gap:10px;max-height:74vh;overflow:auto;padding-right:4px;}
    .task{border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;display:grid;gap:6px;cursor:pointer;transition:all .15s ease;}
    .task:hover{border-color:var(--primary);box-shadow:var(--shadow);}
    .task.active{border-color:var(--primary);box-shadow:var(--shadow);}
    .task-top{display:flex;justify-content:space-between;align-items:center;}
    .badge{padding:6px 10px;border-radius:10px;font-weight:700;font-size:12px;display:inline-block;border:1px solid transparent;}
    .badge.blue{background:#e7efff;color:var(--primary);border-color:#cbdcff;}
    .badge.green{background:#ecfdf3;color:var(--success);border-color:#bbf7d0;}
    .badge.orange{background:#fff7ed;color:#c2410c;border-color:#fed7aa;}
    .badge.red{background:#fef2f2;color:var(--danger);border-color:#fecdd3;}
    .progress{width:100%;height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;}
    .bar{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);width:0%;}
    .grid{display:grid;grid-template-columns: repeat(auto-fit,minmax(260px,1fr));gap:12px;}
    input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);font-family:inherit;font-size:14px;background:#fff;}
    textarea{min-height:110px;resize:vertical;}
    .upload{border:1px dashed #cbd5e1;background:#f8fafc;padding:12px;border-radius:12px;text-align:center;cursor:pointer;}
    .actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;}
    .btn{border:none;cursor:pointer;padding:10px 14px;border-radius:10px;font-weight:700;}
    .btn.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,0.25);}
    .btn.ghost{background:#f3f4f6;border:1px solid var(--border);color:var(--text);}
    .section{border:1px solid var(--border);border-radius:12px;padding:10px;background:#f8fafc;}
    pre{background:#0f172a;color:#e5e7eb;border-radius:10px;padding:10px;overflow:auto;}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <div class="title">云端训练任务</div>
      <div class="muted" style="margin-top:4px;">选择任务查看详情或创建新任务</div>
      <div style="margin:10px 0;" class="search"><input id="search" placeholder="搜索任务"></div>
      <div class="tabs">
        <div class="tab active" data-tab="all">全部</div>
        <div class="tab" data-tab="running">进行中</div>
        <div class="tab" data-tab="pending">待启动</div>
        <div class="tab" data-tab="done">已完成</div>
      </div>
      <div class="list" id="taskList"></div>
    </aside>

    <main style="display:grid; gap:14px;">
      <div class="panel">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div>
            <h3 id="jobTitle">-</h3>
            <div class="muted" id="jobDesc">请选择左侧任务</div>
          </div>
          <span class="badge blue" id="jobStatus">-</span>
        </div>
        <div class="muted" style="margin-top:6px;">进度 <strong id="jobProgress">0%</strong></div>
        <div class="progress"><div class="bar" id="jobBar"></div></div>
        <div class="grid" style="margin-top:10px;">
          <div class="section">
            <div class="muted">数据集</div>
            <div id="jobDataset" style="font-weight:700;">-</div>
          </div>
          <div class="section">
            <div class="muted">模型</div>
            <div id="jobModel" style="font-weight:700;">-</div>
          </div>
          <div class="section">
            <div class="muted">资源</div>
            <div id="jobResource" style="font-weight:700;">-</div>
          </div>
          <div class="section">
            <div class="muted">最新日志</div>
            <div id="jobLog" class="muted">-</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <h3>新建云端训练</h3>
          <span class="muted">POST /api/v1/training/jobs</span>
        </div>
        <form id="createForm" style="display:grid; gap:12px;">
          <div class="grid">
            <div>
              <label>任务名称</label>
              <input id="name" placeholder="如：门禁模型训练-202512">
            </div>
            <div>
              <label>数据集</label>
              <select id="dataset"></select>
            </div>
            <div>
              <label>基础模型</label>
              <select id="model">
                <option value="qwen2">Qwen2</option>
                <option value="glm4">GLM-4</option>
                <option value="llama38b">LLaMA3-8B</option>
              </select>
            </div>
            <div>
              <label>资源规格</label>
              <select id="resource">
                <option value="A100x1">A100x1</option>
                <option value="A100x2">A100x2</option>
                <option value="V100x4">V100x4</option>
              </select>
            </div>
          </div>
          <div class="grid">
            <div>
              <label>学习率</label>
              <input id="lr" type="number" step="0.0001" value="0.0002">
            </div>
            <div>
              <label>批大小</label>
              <input id="batch" type="number" value="16">
            </div>
            <div>
              <label>训练轮数</label>
              <input id="epoch" type="number" value="3">
            </div>
            <div>
              <label>评估间隔（step）</label>
              <input id="evalStep" type="number" value="500">
            </div>
          </div>
          <div class="grid">
            <div>
              <label>镜像 / 环境</label>
              <input id="image" value="registry.example.com/trainer:latest">
            </div>
            <div>
              <label>输出路径</label>
              <input id="output" value="oss://jetlinks/train/output/">
            </div>
          </div>
          <div>
            <label>训练描述</label>
            <textarea id="desc" placeholder="可选：说明目标、评估指标、注意事项"></textarea>
          </div>
          <div class="actions">
            <button type="button" class="btn ghost" id="fillDemo">填充示例</button>
            <button type="submit" class="btn primary">提交训练</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3>请求/响应</h3>
          <div class="muted">HTTP <strong id="httpStatus">-</strong> · 耗时 <strong id="cost">-</strong></div>
        </div>
        <div class="section">
          <div class="muted" style="margin-bottom:6px;">请求体</div>
          <pre id="reqBox">{}</pre>
        </div>
        <div class="section" style="margin-top:10px;">
          <div class="muted" style="margin-bottom:6px;">响应体</div>
          <pre id="resBox">等待中…</pre>
        </div>
      </div>
    </main>
  </div>

  <script>
    const jobs = [
      { id:"job1", name:"门禁异常检测-增量训练", desc:"结合最新门禁异常样本", dataset:"多场景目标识别数据集", model:"Qwen2", resource:"A100x2", status:"进行中", pct:62, log:"Step 1800 loss 1.12", media:"https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=80" },
      { id:"job2", name:"文本告警工单-微调", desc:"历史告警工单语料微调", dataset:"文本告警工单数据集", model:"GLM-4", resource:"V100x4", status:"待启动", pct:0, log:"排队中", media:"https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1600&q=80" },
      { id:"job3", name:"工业表面瑕疵-重新训练", desc:"新增缺陷标注，重训", dataset:"工业表面瑕疵检测数据集", model:"LLaMA3-8B", resource:"A100x4", status:"已完成", pct:100, log:"已完成，F1=0.91", media:"https://images.unsplash.com/photo-1441148345475-03a2e82f9719?auto=format&fit=crop&w=1600&q=80" }
    ];

    const datasets = [
      { id:"ds1", name:"多场景目标识别数据集" },
      { id:"ds2", name:"工业表面瑕疵检测数据集" },
      { id:"ds3", name:"文本告警工单数据集" },
      { id:"ds4", name:"IoT 设备时序数据" }
    ];

    let activeTab = "all";
    let activeJob = jobs[0];

    const taskList = document.getElementById("taskList");
    const jobTitle = document.getElementById("jobTitle");
    const jobDesc = document.getElementById("jobDesc");
    const jobStatus = document.getElementById("jobStatus");
    const jobProgress = document.getElementById("jobProgress");
    const jobBar = document.getElementById("jobBar");
    const jobDataset = document.getElementById("jobDataset");
    const jobModel = document.getElementById("jobModel");
    const jobResource = document.getElementById("jobResource");
    const jobLog = document.getElementById("jobLog");
    const finishTime = document.getElementById("finishTime");
    const mediaSlot = document.getElementById("mediaSlot");
    const reqBox = document.getElementById("reqBox");
    const resBox = document.getElementById("resBox");
    const httpStatus = document.getElementById("httpStatus");
    const cost = document.getElementById("cost");

    function filterJobs() {
      const kw = document.getElementById("search").value.trim();
      return jobs.filter(j => {
        if (activeTab === "running" && j.status !== "进行中") return false;
        if (activeTab === "pending" && j.status !== "待启动") return false;
        if (activeTab === "done" && j.status !== "已完成") return false;
        if (kw && !(j.name.includes(kw) || j.desc.includes(kw))) return false;
        return true;
      });
    }

    function renderJobs() {
      taskList.innerHTML = "";
      filterJobs().forEach(j => {
        const card = document.createElement("div");
        card.className = "task" + (activeJob?.id === j.id ? " active" : "");
        const statusClass = j.status === "进行中" ? "blue" : (j.status === "待启动" ? "orange" : "green");
        card.innerHTML = `
          <div class="task-top">
            <div style="font-weight:700;">${j.name}</div>
            <span class="badge ${statusClass}">${j.status}</span>
          </div>
          <div class="muted">${j.desc}</div>
          <div class="muted">${j.dataset} · ${j.model}</div>
          <div class="progress"><div class="bar" style="width:${j.pct}%"></div></div>
        `;
        card.onclick = () => { activeJob = j; renderDetail(); renderJobs(); };
        taskList.appendChild(card);
      });
    }

    function renderDetail() {
      if (!activeJob) return;
      jobTitle.textContent = activeJob.name;
      jobDesc.textContent = activeJob.desc;
      jobDataset.textContent = activeJob.dataset;
      jobModel.textContent = activeJob.model;
      jobResource.textContent = activeJob.resource;
      jobLog.textContent = activeJob.log;
      jobProgress.textContent = `${activeJob.pct}%`;
      jobBar.style.width = `${activeJob.pct}%`;
      const statusClass = activeJob.status === "进行中" ? "blue" : (activeJob.status === "待启动" ? "orange" : "green");
      jobStatus.className = "badge " + statusClass;
      jobStatus.textContent = activeJob.status;
      mediaSlot.innerHTML = `<img src="${activeJob.media}" alt="">`;
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        tab.classList.add("active");
        activeTab = tab.dataset.tab;
        renderJobs();
      };
    });

    document.getElementById("search").oninput = renderJobs;

    function populateDatasetSelect() {
      document.getElementById("dataset").innerHTML = datasets.map(d=>`<option value="${d.id}">${d.name}</option>`).join("");
    }

    function buildPayload() {
      const body = {
        name: document.getElementById("name").value.trim(),
        dataset_id: document.getElementById("dataset").value,
        model: document.getElementById("model").value,
        resource: document.getElementById("resource").value,
        lr: Number(document.getElementById("lr").value),
        batch_size: Number(document.getElementById("batch").value),
        epoch: Number(document.getElementById("epoch").value),
        eval_step: Number(document.getElementById("evalStep").value),
        image: document.getElementById("image").value.trim(),
        output: document.getElementById("output").value.trim(),
        desc: document.getElementById("desc").value.trim()
      };
      reqBox.textContent = JSON.stringify(body,null,2);
      return body;
    }

    document.getElementById("fillDemo").onclick = () => {
      document.getElementById("name").value = "云端训练-门禁增量";
      document.getElementById("dataset").value = "ds1";
      document.getElementById("model").value = "qwen2";
      document.getElementById("resource").value = "A100x2";
      document.getElementById("lr").value = "0.0002";
      document.getElementById("batch").value = "24";
      document.getElementById("epoch").value = "4";
      document.getElementById("evalStep").value = "400";
      document.getElementById("image").value = "registry.example.com/trainer:latest";
      document.getElementById("output").value = "oss://jetlinks/train/output/";
      document.getElementById("desc").value = "门禁异常增量样本，目标F1≥0.9";
      buildPayload();
    };

    document.getElementById("createForm").onsubmit = async (e) => {
      e.preventDefault();
      const body = buildPayload();
      const url = `${window.location.origin.replace(/\\/$/,'')}/api/v1/training/jobs`;
      const start = performance.now();
      resBox.textContent = "请求发送中...";
      try {
        const res = await fetch(url,{ method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
        const txt = await res.text();
        httpStatus.textContent = res.status;
        cost.textContent = `${(performance.now()-start).toFixed(1)} ms`;
        try { resBox.textContent = JSON.stringify(JSON.parse(txt),null,2); } catch { resBox.textContent = txt || "(空响应)"; }
      } catch(err) {
        httpStatus.textContent = "ERR";
        resBox.textContent = err.message;
      }
    };

    populateDatasetSelect();
    renderJobs();
    renderDetail();
    buildPayload();
  </script>
</body>
</html>
