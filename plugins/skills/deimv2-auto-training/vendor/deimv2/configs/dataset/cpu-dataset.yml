task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

num_classes: 2
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:\DEIMv2\DEIMv2\dataset\cpu-test\images\train
    ann_file: D:\DEIMv2\DEIMv2\dataset\cpu-test\annotations\instances_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 0
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:\DEIMv2\DEIMv2\dataset\cpu-test\images\val
    ann_file: D:\DEIMv2\DEIMv2\dataset\cpu-test\annotations\instances_val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 0
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction